openapi: 3.0.3
info:
  title: SlashObserve API
  version: "0"
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerKey: []
paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/auth-login"
  /auth/callback:
    $ref: "./paths/auth.yaml#/auth-callback"
  /auth/logout:
    $ref: "./paths/auth.yaml#/auth-logout"
  /auth/session:
    $ref: "./paths/auth.yaml#/auth-session"
  /me:
    $ref: "./paths/auth.yaml#/me"
  /instance:
    $ref: "./paths/auth.yaml#/instance"
  /service-accounts:
    $ref: "./paths/service-accounts.yaml#/service-accounts"
  /service-accounts/{id}:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id"
  /service-accounts/{id}/keys:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys"
  /service-accounts/{id}/keys/{keyId}:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys-keyid"
  /users:
    $ref: "./paths/users.yaml#/users"
  /users/{id}:
    $ref: "./paths/users.yaml#/users-id"
  /users/{id}/sessions:
    $ref: "./paths/users.yaml#/users-id-sessions"
  /outbound-domains:
    $ref: "./paths/outbound-domains.yaml#/outbound-domains"
  /outbound-domains/{domain}:
    $ref: "./paths/outbound-domains.yaml#/outbound-domains-domain"
  /prompts:
    $ref: "./paths/prompts.yaml#/prompts"
  /prompts/{id}:
    $ref: "./paths/prompts.yaml#/prompts-id"
  /annotations:
    $ref: "./paths/annotations.yaml#/annotations"
  /annotations/{id}:
    $ref: "./paths/annotations.yaml#/annotations-id"
  /datasources:
    $ref: "./paths/datasources.yaml#/datasources"
  /folders:
    $ref: "./paths/folders.yaml#/folders"
  /folders/{id}:
    $ref: "./paths/folders.yaml#/folders-id"
  /folders/{id}/permissions:
    $ref: "./paths/folders.yaml#/folders-id-permissions"
  /dashboards:
    $ref: "./paths/dashboards.yaml#/dashboards"
  /dashboards/tags:
    $ref: "./paths/dashboards.yaml#/dashboards-tags"
  /dashboards/{id}:
    $ref: "./paths/dashboards.yaml#/dashboards-id"
  /dashboards/{id}/versions:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions"
  /dashboards/{id}/versions/{version}:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version"
  /dashboards/{id}/versions/{version}/restore:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version-restore"
  /dashboards/{id}/duplicate:
    $ref: "./paths/dashboards.yaml#/dashboards-id-duplicate"
  /dashboards/{id}/diff:
    $ref: "./paths/dashboards.yaml#/dashboards-id-diff"
  /dashboards/{id}/import:
    $ref: "./paths/imports.yaml#/dashboards-id-import"
  /dashboards/{id}/actions:
    $ref: "./paths/actions.yaml#/dashboards-id-actions"
  /dashboards/{id}/events:
    $ref: "./paths/events.yaml#/dashboards-id-events"
  /dashboards/{id}/comments:
    $ref: "./paths/comments.yaml#/dashboards-id-comments"
  /dashboards/{id}/comments/{comment_id}:
    $ref: "./paths/comments.yaml#/dashboards-id-comments-commentid"
  /dashboards/{id}/versions/{version}/panels/{panel_id}/data:
    $ref: "./paths/queryproxy.yaml#/dashboards-id-versions-version-panels-panel-id-data"
  /dashboards/{id}/versions/{version}/variables/{name}/values:
    $ref: "./paths/queryproxy.yaml#/dashboards-id-versions-version-variables-name-values"
  /datasources/{uid}/lint:
    $ref: "./paths/queryproxy.yaml#/datasources-uid-lint"
  /datasources/{uid}/preview:
    $ref: "./paths/preview.yaml#/datasources-uid-preview"
  /datasources/{uid}/query:
    $ref: "./paths/explore.yaml#/datasources-uid-query"
  /datasources/{uid}/metrics:
    $ref: "./paths/names.yaml#/datasources-uid-metrics"
  /datasources/{uid}/labels:
    $ref: "./paths/names.yaml#/datasources-uid-labels"
  /datasources/{uid}/labels/{name}/values:
    $ref: "./paths/names.yaml#/datasources-uid-labels-name-values"
  /dashboards/{id}/revisions:
    $ref: "./paths/revisions.yaml#/dashboards-id-revisions"
  /dashboards/{id}/revisions/{revision_id}:
    $ref: "./paths/revisions.yaml#/dashboards-id-revisions-revisionid"
  /dashboards/{id}/suggestions:
    $ref: "./paths/suggestions.yaml#/dashboards-id-suggestions"
  /dashboards/{id}/suggestions/{suggestion_id}:
    $ref: "./paths/suggestions.yaml#/dashboards-id-suggestions-suggestionid"
  /agent:
    $ref: "./paths/observe.yaml#/agent"
  /observe:
    $ref: "./paths/observe.yaml#/observe"
  /observe/{id}:
    $ref: "./paths/observe.yaml#/observe-id"
  /observe/{id}/build:
    $ref: "./paths/observe.yaml#/observe-id-build"
  /observe/{id}/cancel:
    $ref: "./paths/observe.yaml#/observe-id-cancel"
  /observe/{id}/continue:
    $ref: "./paths/observe.yaml#/observe-id-continue"
  /observe/{id}/build/save:
    $ref: "./paths/observe.yaml#/observe-id-build-save"
  /observe/{id}/build/panels/{panel_id}/data:
    $ref: "./paths/observe.yaml#/observe-id-build-panels-panel-id-data"
  /observe/{id}/build/variables/{name}/values:
    $ref: "./paths/observe.yaml#/observe-id-build-variables-name-values"
  /news:
    $ref: "./paths/news.yaml#/news"
  /assets/image:
    $ref: "./paths/assets.yaml#/image"
  /assets/geojson:
    $ref: "./paths/assets.yaml#/geojson"
  /imports/preview:
    $ref: "./paths/imports.yaml#/imports-preview"
  /imports:
    $ref: "./paths/imports.yaml#/imports"
  /provision:
    $ref: "./paths/provision.yaml#/provision"
  /provision/run:
    $ref: "./paths/provision.yaml#/provision-run"
  /grafana:
    $ref: "./paths/grafana.yaml#/grafana"
  /grafana/{id}:
    $ref: "./paths/grafana.yaml#/grafana-id"
  /grafana/{id}/test:
    $ref: "./paths/grafana.yaml#/grafana-id-test"
  /grafana/{id}/folders:
    $ref: "./paths/grafana.yaml#/grafana-id-folders"
  /grafana/{id}/datasources:
    $ref: "./paths/grafana.yaml#/grafana-id-datasources"
  /grafana/{id}/imports:
    $ref: "./paths/grafana.yaml#/grafana-id-imports"
  /grafana/{id}/imports/{sync_id}:
    $ref: "./paths/grafana.yaml#/grafana-id-imports-syncid"
  /grafana/resolve/{uid}:
    $ref: "./paths/grafana.yaml#/grafana-resolve-uid"
  /repairs:
    $ref: "./paths/repairs.yaml#/repairs"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: so_session
      description: Opaque session token set by the OIDC callback. The cookie is named `__Host-so_session` when the public URL is https.
    bearerKey:
      type: http
      scheme: bearer
      description: Service-account key issued by the keys endpoint, prefixed `sok_`.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    Issue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
          description: >-
            Spec parsing adds schema and semantic codes such as `schema`, `too_large`, `unknown_unit`, `duplicate_panel_id`, `unknown_variable`,
            `too_many_panels` (more than 200 panels counting row children), `duplicate_query_ref`, `unknown_query_ref` (an override or an expression names a query ref the panel does not have),
            `threshold_value_missing` (a threshold other than the first omits its value), `duplicate_element_id` (a canvas panel repeats an element id, path `/panels/{i}/display/elements/{k}/id`)
            and `unknown_element` (a canvas connection names no element, path `/panels/{i}/display/connections/{k}/from` or `/to`).
            A `timezone` the server cannot load is `unknown_timezone` (path `/timezone`).
            Saving a dashboard also runs every panel and variable query and adds `unknown_datasource`, `time_range_invalid` (path `/time`),
            `variable_failed`, `variable_empty` and `variable_unresolved` (paths `/variables/{i}` or `/panels/{i}/queries/{j}/query`, with `/panels/{i}/panels/{j}` for a row child),
            and `query_invalid`, `query_forbidden`, `limit_exceeded`, `query_timeout`, `datasource_unavailable`, `not_found`, `query_empty`, `expression_error` and `internal`
            (paths `/panels/{i}/queries/{j}/query`, `/panels/{i}/queries/{j}/expression` for an expression query, `/panels/{i}/datasource` and `/panels/{i}/queries/{j}/datasource`; `query_empty` is reported once for the panel at `/panels/{i}/queries`, and never for an `alertlist` panel, whose empty result is valid).
            A query issue on a panel or variable the parent version lists in `unverified` may be kept instead of failing the save; see `POST /dashboards/{id}/versions`.
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, code, issues]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Role:
      type: string
      enum: [admin, editor, commenter, viewer]
    RoleSource:
      type: string
      enum: [admin_emails, first_user, group, manual, default]
      description: Where a person's role comes from. admin_emails, first_user and group are decided by the server settings or the identity provider and cannot be changed through the API.
    Principal:
      type: object
      additionalProperties: false
      required: [kind, id, name, role]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Instance:
      type: object
      additionalProperties: false
      required:
        - public_url
        - mcp_url
        - oidc_issuer_url
        - oidc_provider_name
        - allowed_email_domains
        - any_email_domain
        - session_ttl_seconds
      properties:
        public_url:
          type: string
          format: uri
        mcp_url:
          type: string
          format: uri
        oidc_issuer_url:
          type: string
          description: The identity provider's issuer, as browsers reach it.
        oidc_provider_name:
          type: string
          description: The identity provider's display name, empty when none is configured.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Empty when any domain may sign in.
        any_email_domain:
          type: boolean
        session_ttl_seconds:
          type: integer
          minimum: 300
    SessionState:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, name, description, created_by, created_at, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description:
          type: string
          maxLength: 256
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role the account's keys act with; editor when omitted.
    UpdateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    ServiceAccountKey:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - name
        - display_prefix
        - created_by
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        service_account_id:
          type: string
          format: uuid
        name:
          type: string
        display_prefix:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ServiceAccountKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccountKey"
    CreateServiceAccountKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
    IssuedServiceAccountKey:
      type: object
      additionalProperties: false
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/ServiceAccountKey"
        token:
          type: string
          description: The full key, returned only once.
    Person:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - created_at
        - last_login_at
        - last_seen_at
        - dashboard_count
        - key_count
        - session_count
        - role
        - role_source
        - role_group
        - role_set_by
        - role_locked
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once a minute while a session is used; seen within the last 2 minutes means online now.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose first version this person saved, either directly or through an agent request they sent. Dashboards created with a service-account key are not counted. Only dashboards in folders you can see are counted, so another person's My Dashboards is left out.
        key_count:
          type: integer
          minimum: 0
          description: Unrevoked, unexpired service-account keys this person created.
        session_count:
          type: integer
          minimum: 0
          description: Unexpired sessions.
        role:
          $ref: "#/components/schemas/Role"
        role_source:
          $ref: "#/components/schemas/RoleSource"
        role_group:
          type: string
          nullable: true
          description: The identity-provider group that decided the role when role_source is group.
        role_set_by:
          type: string
          nullable: true
          description: The name of the Admin who chose the role when role_source is manual.
        role_locked:
          type: boolean
          description: True when the role cannot be changed through the API.
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role to set, or null to clear the chosen role and fall back to the computed one.
    OutboundDomain:
      type: object
      additionalProperties: false
      required: [domain, added_at, added_by]
      properties:
        domain:
          type: string
          description: A host name, or `*.` followed by a host name for its subdomains only, in lower case ASCII.
        added_at:
          type: string
          format: date-time
          nullable: true
          description: Null for an entry set by `SLASHOBSERVE_OUTBOUND_DOMAINS`.
        added_by:
          type: string
          nullable: true
          description: The name of the person who allowed the domain; null for an entry set by `SLASHOBSERVE_OUTBOUND_DOMAINS` and when that person was deleted.
    OutboundDomainList:
      type: object
      additionalProperties: false
      required: [managed_by, domains]
      properties:
        managed_by:
          type: string
          enum: [settings, config]
          description: "`config` when `SLASHOBSERVE_OUTBOUND_DOMAINS` is set; the list is then read-only."
        domains:
          type: array
          items:
            $ref: "#/components/schemas/OutboundDomain"
    Permissions:
      type: object
      additionalProperties: false
      required: [comment, edit, manage, create]
      description: What the caller may do with the object; being able to read it implies viewing.
      properties:
        comment:
          type: boolean
        edit:
          type: boolean
        manage:
          type: boolean
          description: Rename, change the permissions of and delete a folder.
        create:
          type: boolean
          description: Create, duplicate or import dashboards into the folder, or move dashboards into it (the Edit level).
    FolderLevel:
      type: string
      enum: [view, comment, edit, admin]
    Folder:
      type: object
      additionalProperties: false
      required: [id, title, general, personal, restricted, dashboard_count, grantees, grantee_count, created_by, permissions, level]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        general:
          type: boolean
          description: True for the General folder, which holds dashboards without a folder of their own and is never restricted, renamed or deleted.
        personal:
          type: boolean
          description: True for the caller's own My Dashboards folder, which only they see, Admins included. It is never restricted, renamed or shared, takes new dashboards but no moves, and lists first.
        restricted:
          type: boolean
          description: True when the folder lists people or groups; false means open to everyone by instance role.
        dashboard_count:
          type: integer
          description: All dashboards in the folder, including ones the caller cannot see when the caller manages it.
        grantees:
          type: array
          maxItems: 5
          description: The names of up to 5 listed people, then groups.
          items:
            type: string
        grantee_count:
          type: integer
          description: How many people and groups are listed.
        created_by:
          nullable: true
          description: Null for General and for folders made before creators were recorded. For a personal folder, its owner.
          allOf:
            - $ref: "#/components/schemas/Author"
        permissions:
          $ref: "#/components/schemas/Permissions"
        level:
          description: The caller's level on this folder and on every dashboard in it, the higher of what their role gives and their highest matching entry. Admins have `admin` on every folder except other people's personal folders, and a personal folder's owner has `edit`.
          allOf:
            - $ref: "#/components/schemas/FolderLevel"
    FolderPermissionEntry:
      type: object
      additionalProperties: false
      required: [kind, level]
      properties:
        kind:
          type: string
          enum: [user, group]
        user:
          type: object
          additionalProperties: false
          required: [id, name, email, role]
          description: Present when `kind` is `user`.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            role:
              $ref: "#/components/schemas/Role"
        group:
          type: string
          description: Present when `kind` is `group`.
        member_count:
          type: integer
          description: Present when `kind` is `group`; people who signed in with the group in their stored claims.
        level:
          $ref: "#/components/schemas/FolderLevel"
    FolderPermissions:
      type: object
      additionalProperties: false
      required: [restricted, entries]
      properties:
        restricted:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FolderPermissionEntry"
    SavedPrompt:
      type: object
      additionalProperties: false
      required: [id, name, body, shared, owner, can_edit, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique per owner and among shared prompts, ignoring case. Letters, numbers, spaces, `-` and `_`; it starts and ends with a letter or number, and runs of spaces are stored as one.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The prompt text sent to the agent, trimmed; at most 4000 characters, the same limit as `POST /observe`.
        shared:
          type: boolean
          description: True when everyone on the server can see and run it; false when only its owner can.
        owner:
          $ref: "#/components/schemas/SavedPromptOwner"
        can_edit:
          type: boolean
          description: Whether the caller may change or delete it. The server decides; clients never recompute it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedPromptOwner:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The owner's display name, or their email when they have no name.
    SavedPromptList:
      type: object
      additionalProperties: false
      required: [prompts]
      properties:
        prompts:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SavedPrompt"
    Annotation:
      type: object
      additionalProperties: false
      required: [id, dashboard_id, panel_id, time_from, time_to, text, tags, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: Null for a global annotation, shown on every dashboard.
        panel_id:
          type: string
          nullable: true
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
          nullable: true
          description: The end of a range annotation; null for a single instant.
        text:
          type: string
          minLength: 1
          maxLength: 2000
        tags:
          type: array
          maxItems: 10
          items:
            type: string
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The id of the person or service account that added it.
        created_at:
          type: string
          format: date-time
    AnnotationList:
      type: object
      additionalProperties: false
      required: [annotations, next_cursor]
      properties:
        annotations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Annotation"
        next_cursor:
          type: string
          nullable: true
    NewsItem:
      type: object
      additionalProperties: false
      required: [title, link, published, summary]
      properties:
        title:
          type: string
          maxLength: 300
          description: Plain text, never markup.
        link:
          type: string
          nullable: true
          maxLength: 2000
          description: An absolute http or https URL without user info, or null when the feed gave none or an unsafe one.
        published:
          type: string
          format: date-time
          nullable: true
        summary:
          type: string
          maxLength: 500
          description: Plain text, never markup; may be empty.
    ActionResult:
      type: object
      additionalProperties: false
      required: [status, ok]
      properties:
        status:
          type: integer
          description: The HTTP status the remote server answered with; a redirect is reported as its own 3xx status.
        ok:
          type: boolean
          description: True when the status is 2xx.
    ActionError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        host:
          type: string
          description: The domain the request was meant for, present on `outbound_domain_not_allowed` and `action_failed`.
    NewsFeed:
      type: object
      additionalProperties: false
      required: [title, items, fetched_at]
      properties:
        title:
          type: string
          maxLength: 200
        items:
          type: array
          maxItems: 50
          description: In feed order, at most 50.
          items:
            $ref: "#/components/schemas/NewsItem"
        fetched_at:
          type: string
          format: date-time
          description: When the server fetched the feed; a cached feed keeps the time of its fetch.
    DatasourceStatus:
      type: object
      additionalProperties: false
      required: [uid, type, name, healthy, checked_at, dashboard_count]
      properties:
        uid:
          type: string
        type:
          type: string
        name:
          type: string
        healthy:
          type: boolean
        message:
          type: string
        checked_at:
          type: string
          format: date-time
          description: When the server last checked the datasource; checks are cached for 10 seconds.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose latest version uses this datasource.
    DatasourceList:
      type: object
      additionalProperties: false
      required: [datasources]
      properties:
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceStatus"
    MetricName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
        help:
          type: string
          maxLength: 163
        unit:
          type: string
        table:
          type: string
    Author:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    Creator:
      type: object
      additionalProperties: false
      required: [author, origin, origin_client, via]
      description: Who made version 1 of the dashboard. It never changes.
      properties:
        author:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where version 1 came from; null for dashboards created before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's name when `origin` is `mcp`, else null.
        via:
          type: string
          enum: [direct, agent]
          description: "`agent` when the agent saved version 1; `author` is then the person or key that asked."
    DashboardFolder:
      type: object
      additionalProperties: false
      required: [id, title, general, personal]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        general:
          type: boolean
          description: True for the General folder.
        personal:
          type: boolean
          description: True when the dashboard is in a personal folder.
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [id, title, tags, latest_version, created_at, updated_at, updated_by, creator, folder, permissions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
        creator:
          $ref: "#/components/schemas/Creator"
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        permissions:
          $ref: "#/components/schemas/Permissions"
    DashboardListItem:
      type: object
      additionalProperties: false
      required: [id, title, description, tags, latest_version, created_at, updated_at, updated_by, creator, datasource_uids, open_comment_count, folder, permissions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
          description: The latest version's Spec description; null when it has none.
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
        creator:
          $ref: "#/components/schemas/Creator"
        datasource_uids:
          type: array
          items:
            type: string
          description: The distinct datasource uids the latest version uses, sorted.
        open_comment_count:
          type: integer
          minimum: 0
          description: Open comment threads on the dashboard; replies are not counted.
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        permissions:
          $ref: "#/components/schemas/Permissions"
    VersionMeta:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at, origin, origin_client, agent_request_id]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the save came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. A version saved by the agent records the origin of the request that asked for it. Null for versions saved before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        agent_request_id:
          type: string
          format: uuid
          nullable: true
          description: The agent request that saved this version; null for a version saved directly.
    Version:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at, origin, origin_client, agent_request_id, spec, unverified]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the save came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. A version saved by the agent records the origin of the request that asked for it. Null for versions saved before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        agent_request_id:
          type: string
          format: uuid
          nullable: true
          description: The agent request that saved this version; null for a version saved directly.
        spec:
          type: object
          additionalProperties: true
          description: The ObserveSpec document, validated against its own schema.
        unverified:
          $ref: "#/components/schemas/Unverified"
    Unverified:
      type: object
      additionalProperties: false
      required: [panels, variables]
      description: >-
        Panels and variables of this version whose queries failed when it was saved but were kept:
        a Grafana import keeps every failing panel and variable, and a later save keeps one only while it stays unchanged
        (see `POST /dashboards/{id}/versions`).
      properties:
        panels:
          type: array
          items:
            $ref: "#/components/schemas/UnverifiedPanel"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/UnverifiedVariable"
    UnverifiedPanel:
      type: object
      additionalProperties: false
      required: [panel_id, issues]
      properties:
        panel_id:
          type: string
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Issue"
    UnverifiedVariable:
      type: object
      additionalProperties: false
      required: [name, issues]
      properties:
        name:
          type: string
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Issue"
    DashboardWithVersion:
      type: object
      additionalProperties: false
      required: [dashboard, version]
      properties:
        dashboard:
          $ref: "#/components/schemas/DashboardSummary"
        version:
          $ref: "#/components/schemas/Version"
    SpecChange:
      type: object
      additionalProperties: false
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, reorder]
        path:
          type: string
          description: JSON Pointer into the Spec document; the empty string is the whole document.
        from:
          nullable: true
          description: The previous JSON value at the path.
        to:
          nullable: true
          description: The new JSON value at the path.
    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, code, latest_version]
      properties:
        error:
          type: string
        code:
          type: string
        latest_version:
          type: integer
          minimum: 1
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - parent_id
        - version
        - panel_id
        - body
        - status
        - author
        - created_at
        - updated_at
        - resolved_at
        - resolved_by
        - resolved_by_version
        - panel_present
        - revision
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The thread's first comment, for a reply; null for a thread's first comment.
        version:
          type: integer
          minimum: 1
        panel_id:
          type: string
          nullable: true
          description: The panel the thread is on; null for the whole dashboard. A reply has its thread's panel.
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
          description: For a reply, the status of its thread.
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Author"
        resolved_by_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version that fixed the thread, when the resolver named one. Also set by the server when an agent request sent from the thread succeeds. Always null on a reply.
        panel_present:
          type: boolean
          description: Whether the latest version of the dashboard still has the panel the comment is anchored to. Always true for a whole-dashboard comment.
        revision:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, status]
          description: The latest revision requested for this comment, or null when none was requested.
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, running, succeeded, failed]
    CommentEnvelope:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
    Field:
      type: object
      additionalProperties: false
      required: [name, type, values]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [time, number, string, bool, other]
        values:
          type: array
          description: >-
            Time fields hold epoch milliseconds as integers, number fields hold numbers with `null` for gaps,
            and `other` fields hold JSON exactly as the datasource adapter produced it.
          items:
            nullable: true
    Frame:
      type: object
      additionalProperties: false
      required: [ref, fields]
      properties:
        ref:
          type: string
          description: >-
            The ref of the panel query that produced this frame: its written ref, or A, B, C... by position.
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
    QueryMeta:
      type: object
      additionalProperties: false
      required: [ref, kind, step_ms]
      properties:
        ref:
          type: string
        kind:
          type: string
          enum: [range, instant]
        step_ms:
          type: integer
          minimum: 0
          description: The query's resolution; 0 for an instant query.
        exemplars:
          type: string
          enum: [ok, truncated, unavailable, unsupported]
          description: >-
            Present only when the query asked for exemplars (`exemplar: true` on a Prometheus range query, on the panel data and preview routes).
            `ok` has all of them, `truncated` has the 2,000 newest after thinning to one per step,
            `unavailable` means the exemplar call failed or timed out and the panel still succeeded,
            and `unsupported` means the datasource or the query kind has no exemplars.
    DataMeta:
      type: object
      additionalProperties: false
      required: [kind, from, to, step_ms, queries, cached, executed_at]
      properties:
        kind:
          type: string
          enum: [range, instant]
          description: range when any visible query runs as a range query, which also decides how from and to are aligned.
        from:
          type: string
          format: date-time
          description: The start of the aligned range the query ran over.
        to:
          type: string
          format: date-time
          description: The end of the aligned range the query ran over.
        step_ms:
          type: integer
          minimum: 0
          description: The panel's resolution; 0 for an instant panel.
        queries:
          type: array
          description: Every query that ran, in panel order; hidden queries do not run.
          items:
            $ref: "#/components/schemas/QueryMeta"
        cached:
          type: boolean
          description: True when the response was served from the proxy's response cache instead of running the query.
        executed_at:
          type: string
          format: date-time
          description: When the query ran upstream, which for a cached response is earlier than the request.
        source_panel:
          type: string
          description: The id of the panel whose queries ran, present only when the requested panel reuses another panel's results; the frames, queries and range are that panel's, and its transforms apply first when the reusing query sets withTransforms.
    PanelDataError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        ref:
          type: string
          description: The query that failed, when one query's run failed.
    PanelData:
      type: object
      additionalProperties: false
      required: [frames, meta]
      properties:
        frames:
          type: array
          items:
            $ref: "#/components/schemas/Frame"
        exemplars:
          type: array
          description: >-
            Present only when at least one query asked for exemplars, and then possibly empty.
            Each frame is one series' exemplars, its `ref` naming the query and its `labels` the series labels;
            the fields are `Time` (epoch milliseconds), `Value`, then one string field per exemplar label key.
          items:
            $ref: "#/components/schemas/Frame"
        meta:
          $ref: "#/components/schemas/DataMeta"
    VariableValues:
      type: object
      additionalProperties: false
      required: [values, truncated, cached]
      properties:
        values:
          type: array
          items:
            type: string
          description: The values a selection may hold.
        texts:
          type: array
          items:
            type: string
          description: The display text of each value, same length and order as values; present only when some text differs from its value.
        truncated:
          type: boolean
        cached:
          type: boolean
          description: True when the list was served from the proxy's response cache instead of running the query.
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, message, start, end]
      properties:
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        start:
          type: integer
          minimum: 0
          description: Byte offset of the first byte the diagnostic covers.
        end:
          type: integer
          minimum: 0
          description: Byte offset just past the last byte the diagnostic covers.
    LintResult:
      type: object
      additionalProperties: false
      required: [diagnostics]
      properties:
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
    Revision:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - source
        - comment_id
        - panel_id
        - prompt
        - base_version
        - status
        - attempts
        - result_version
        - error
        - failure_code
        - build
        - build_saved_at
        - continues_id
        - continued_by
        - continue_note
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe]
          description: "`observe` is the new-dashboard request that created the dashboard; it appears once it has succeeded."
        comment_id:
          type: string
          format: uuid
          nullable: true
          description: The comment that requested the revision; null for a prompt, or after the comment was deleted.
        panel_id:
          type: string
          nullable: true
          description: The panel the request is about (a comment's panel, or the panel a prompt was sent from); null for the whole dashboard.
        prompt:
          type: string
          description: The follow-up text, or the comment body.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the requester was looking at; null for the `observe` request that created the dashboard. The agent revises the latest version.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the revision saved, set when the status is `succeeded`.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the revision failed, set when the status is `failed`.
        failure_code:
          type: string
          nullable: true
          description: Why the request failed, as one code (the codes of `AgentRequest.failure_code`), set when the status is `failed` and null otherwise. Clients must tolerate codes they do not know.
        build:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentBuildProgress"
          description: Progress of the build the agent assembles for this request, null when there is none.
        build_saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester saved the stopped build of a `failed` request as a version; null otherwise.
        continues_id:
          type: string
          format: uuid
          nullable: true
          description: The stopped request this one continues.
        continued_by:
          type: string
          format: uuid
          nullable: true
          description: The request that continues this one; its build moved there.
        continue_note:
          type: string
          nullable: true
          description: The note given when continuing a stopped request, null when none was given or this request continues nothing.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. Null for requests made before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    RevisionEnvelope:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
    SuggestionEnvelope:
      type: object
      additionalProperties: false
      required: [suggestion]
      properties:
        suggestion:
          $ref: "#/components/schemas/Suggestion"
    Suggestion:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - panel_id
        - base_version
        - prompt
        - status
        - steps
        - panel
        - error
        - failure_code
        - usage
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        panel_id:
          type: string
          minLength: 1
          maxLength: 64
          description: The panel the agent was asked to change.
        base_version:
          type: integer
          minimum: 1
          description: The version the proposal is judged inside.
        prompt:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        steps:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/AgentStep"
        panel:
          type: object
          additionalProperties: true
          nullable: true
          description: The proposed panel, set only when the status is `succeeded`. It is not saved anywhere; the client decides whether to apply it.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the suggestion failed, set only when the status is `failed`.
        failure_code:
          type: string
          nullable: true
          description: "Why the suggestion failed, as one code, set when the status is `failed` and null otherwise. One of `run_timeout`, `call_timeout`, `rate_limited`, `provider_error`, `output_limit`, `no_tool_call`, `refused`, `validation_exhausted`, `conflict`, `invalid_task`, `not_found`, `draft_invalid`, `canceled`, `load_failed`, `context_failed`, `tool_failed`, `result_too_large`, `tool_panicked`, `malformed_result`, `internal`, `no_fixture`, `requester_gone`, `requester_forbidden`, `check_failed`, `crashed`, `no_suggestion`, `lease_expired` or `no_progress`. Clients must tolerate codes they do not know."
        usage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUsage"
          description: Tokens, model calls and timings of the attempt that finished the suggestion. Null when no model call was attempted.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name`, only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    AgentInfo:
      type: object
      additionalProperties: false
      required: [available, provider, model, effort]
      properties:
        available:
          type: boolean
        provider:
          type: string
          nullable: true
          description: The configured LLM provider, null when no agent is configured.
        model:
          type: string
          nullable: true
          description: The model the agent uses, null when no agent is configured.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          nullable: true
          description: Reasoning effort of the Anthropic provider; null otherwise.
    AgentStep:
      type: object
      additionalProperties: false
      required: [at, attempt, phase, tool, status, message, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        attempt:
          type: integer
          minimum: 0
          description: >-
            The attempt that ran the step.
            A shutdown release gives the attempt back and keeps its steps, so the re-claimed run continues the same step list; an attempt keeps its most recent 1000 steps.
            Clients detect a restarted list by each step's `at`, not by `attempt` alone.
        phase:
          type: string
          enum: [discover, lint, query, save, repair]
        tool:
          type: string
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
          description: The tool's fixed progress text, for example `Listed 37 metrics on prom`.
        duration_ms:
          type: integer
          minimum: 0
    AgentUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - model_calls
        - repair_rounds
        - tool_calls
        - failed_calls
        - retries
        - model_ms
        - tool_ms
        - max_save_output_tokens
        - build_saves
        - renewals
        - compactions
        - nudges
        - save_now_refusals
        - stalled_turns
        - one_panel_refusals
      properties:
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        repair_rounds:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
          description: Tool calls the model made.
        failed_calls:
          type: integer
          minimum: 0
          description: Model calls that failed. The call that ended a failed run counts here, so a run that fails on its first call reports `model_calls` 0 and `failed_calls` 1.
        retries:
          type: integer
          minimum: 0
          description: Extra HTTP attempts made inside model calls after a retryable answer or an idle or first-token timeout, including the resend after an answer cut off at the output limit.
        model_ms:
          type: integer
          minimum: 0
          description: Wall-clock milliseconds spent waiting on the model, retries included.
        tool_ms:
          type: integer
          minimum: 0
          description: Wall-clock milliseconds spent running tools; tools of one turn that run in parallel count once.
        max_save_output_tokens:
          type: integer
          minimum: 0
          description: The largest output token count of any model turn that contained a save, or 0 when no turn did.
        build_saves:
          type: integer
          minimum: 0
          description: Accepted saves into the request's build during the run, counted across every session of the run.
        renewals:
          type: integer
          minimum: 0
          description: Compactions made because the session's history passed the renewal size after an accepted save; also counted in `compactions`.
        compactions:
          type: integer
          minimum: 0
          description: Times the run compacted its session history (on renewal, on the first cut-off answer, or when the model answered without a tool call while the build held fewer panels than planned).
        nudges:
          type: integer
          minimum: 0
          description: Steering messages sent one call before the save-now rule refuses reads.
        save_now_refusals:
          type: integer
          minimum: 0
          description: Read calls refused because six model calls passed without a save (or twelve without a proposal in a suggest run).
        stalled_turns:
          type: integer
          minimum: 0
          description: Turns in which the agent answered no call because every call was refused.
        one_panel_refusals:
          type: integer
          minimum: 0
          description: Saves refused for adding or changing more than one panel.
    AgentBuildProgress:
      type: object
      additionalProperties: false
      required: [saves, panels, planned_panels, title, updated_at]
      description: How far a request's build has come, without its Spec; the build title is for the requester only.
      properties:
        saves:
          type: integer
          minimum: 1
          description: Accepted build saves so far; a client refetches the build when it changes.
        panels:
          type: integer
          minimum: 0
          description: Panels in the build, row children included and rows themselves excluded.
        planned_panels:
          type: integer
          minimum: 0
          maximum: 200
          description: Panels the agent expects the finished dashboard to have, rows not counted; 0 when it gave no estimate. It is an estimate, so `panels` can exceed it.
        title:
          type: string
          nullable: true
          description: The build's current dashboard title; null for anyone but the principal that made the request, because a build is visible only to its requester.
        updated_at:
          type: string
          format: date-time
    AgentBuild:
      type: object
      additionalProperties: false
      required: [request_id, dashboard_id, base_version, saves, panels, planned_panels, spec, updated_at]
      properties:
        request_id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard being revised; null for a new-dashboard request.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the revision started from; null for a new-dashboard request.
        saves:
          type: integer
          minimum: 1
        panels:
          type: integer
          minimum: 0
        planned_panels:
          type: integer
          minimum: 0
          maximum: 200
          description: Panels the agent expects the finished dashboard to have, rows not counted; 0 when it gave no estimate. It is an estimate, so `panels` can exceed it.
        spec:
          type: object
          additionalProperties: true
          description: The ObserveSpec document as built so far, checked like a version.
        updated_at:
          type: string
          format: date-time
    AgentBuildSaved:
      type: object
      additionalProperties: false
      required: [dashboard_id, version, url, replayed]
      properties:
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        url:
          type: string
          description: The address of the dashboard, empty when the server has no public URL configured.
        replayed:
          type: boolean
          description: True when the request had already saved a version, so this call changed nothing.
    AgentRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - prompt
        - dashboard_id
        - base_version
        - panel_id
        - comment_id
        - status
        - attempts
        - result_version
        - url
        - error
        - failure_code
        - steps
        - usage
        - build
        - build_saved_at
        - queue_position
        - cancel_requested_at
        - canceled_by
        - can_cancel
        - continues_id
        - continue_note
        - continued_by
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe]
        prompt:
          type: string
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard the request targets; for a new-dashboard request it is null until the request has succeeded.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version a revision was requested against; null for a new-dashboard request.
        panel_id:
          type: string
          nullable: true
        comment_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the request saved, set when the status is `succeeded` and, once the requester saved a stopped build, when it is `failed`.
        url:
          type: string
          nullable: true
          description: The address of the dashboard, set when the status is `succeeded`.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the request failed, set when the status is `failed`.
        failure_code:
          type: string
          nullable: true
          description: "Why the request failed, as one code, set when the status is `failed` and null otherwise. One of `run_timeout`, `call_timeout`, `rate_limited`, `provider_error`, `output_limit`, `no_tool_call`, `refused`, `validation_exhausted`, `conflict`, `invalid_task`, `not_found`, `draft_invalid`, `canceled`, `load_failed`, `context_failed`, `tool_failed`, `result_too_large`, `tool_panicked`, `malformed_result`, `internal`, `no_fixture`, `requester_gone`, `requester_forbidden`, `check_failed`, `crashed`, `no_suggestion`, `lease_expired` or `no_progress`. Clients must tolerate codes they do not know."
        steps:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/AgentStep"
        usage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUsage"
          description: Tokens, model calls, repair rounds and timings of the attempt that finished the request. Null when no model call was attempted.
        build:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentBuildProgress"
          description: Progress of the build the agent assembles for this request, null when there is none. Shown to everyone who can see the request; the build's Spec is readable only by the requester through `GET /observe/{id}/build`.
        build_saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester saved the stopped build of a `failed` request as a version; null otherwise. The request stays `failed` with its `failure_code`.
        queue_position:
          type: integer
          minimum: 1
          nullable: true
          description: 1-based place among queued requests in claim order, null unless queued. The worker skips a request whose dashboard already has a running revision, so the order can shift.
        cancel_requested_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester asked to cancel the request; null when they did not. A running request keeps running until its worker sees the flag, then ends `failed` with the `canceled` failure code and keeps its build.
        canceled_by:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Author"
          description: Who asked to cancel the request; the email is never set.
        can_cancel:
          type: boolean
          description: Whether the caller may cancel this request now. Only the requester may, while it is queued or running.
        continues_id:
          type: string
          format: uuid
          nullable: true
          description: The stopped request this one continues.
        continue_note:
          type: string
          nullable: true
          description: The note given when continuing a stopped request, null when none was given or this request continues nothing.
        continued_by:
          type: string
          format: uuid
          nullable: true
          description: The request that continues this one; its build moved there.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. Null for requests made before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    RequestSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - prompt
        - status
        - dashboard_id
        - dashboard_title
        - panel_id
        - result_version
        - url
        - error
        - failure_code
        - build
        - build_saved_at
        - continues_id
        - continued_by
        - continue_note
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe]
        prompt:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        dashboard_id:
          type: string
          format: uuid
          nullable: true
        dashboard_title:
          type: string
          nullable: true
          description: The dashboard's current title; null when the request has no dashboard or the dashboard is in a folder you cannot see.
        panel_id:
          type: string
          nullable: true
        result_version:
          type: integer
          minimum: 1
          nullable: true
        url:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          maxLength: 500
        failure_code:
          type: string
          nullable: true
          description: Why the request failed, as one code (the codes of `AgentRequest.failure_code`), set when the status is `failed` and null otherwise. Clients must tolerate codes they do not know.
        build:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentBuildProgress"
          description: Progress of the build the agent assembles for this request, null when there is none.
        build_saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester saved the stopped build of a `failed` request as a version; null otherwise.
        continues_id:
          type: string
          format: uuid
          nullable: true
          description: The stopped request this one continues.
        continued_by:
          type: string
          format: uuid
          nullable: true
          description: The request that continues this one; its build moved there.
        continue_note:
          type: string
          nullable: true
          description: The note given when continuing a stopped request, null when none was given or this request continues nothing.
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
        origin_client:
          type: string
          nullable: true
          maxLength: 64
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    ContinueObserveRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          nullable: true
          maxLength: 4000
          description: An instruction for the continued run, trimmed; 1 to 4000 characters without control or bidirectional override characters, the same rule as a prompt.
    AgentRequestEnvelope:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/AgentRequest"
    ImportRequest:
      type: object
      additionalProperties: false
      required: [json]
      properties:
        json:
          type: string
          minLength: 1
          description: The Grafana dashboard JSON text, exactly as pasted or uploaded.
        mapping:
          type: object
          nullable: true
          maxProperties: 50
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
          description: Source datasource key to our datasource uid; keys and values are 1 to 200 bytes.
        folder:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The title of the folder for the new dashboard, trimmed and checked like a folder title; 400 `invalid_request` otherwise.
            Only the import uses it; the preview checks it and ignores it.
    ImportSummary:
      type: object
      additionalProperties: false
      required: [format, title, uid, schema_version, bytes, panels, rows, variables]
      properties:
        format:
          type: string
          enum: [classic, export, api]
        title:
          type: string
        uid:
          type: string
        schema_version:
          type: integer
          minimum: 0
        bytes:
          type: integer
          minimum: 0
        panels:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        variables:
          type: integer
          minimum: 0
    ImportSourceDatasource:
      type: object
      additionalProperties: false
      required: [key, name, type, kind, panels, match, matched_by, candidates]
      properties:
        key:
          type: string
          description: How the dashboard refers to the datasource (a uid, a name or an `${DS_...}` input).
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          description: The Grafana datasource type.
        kind:
          type: string
          nullable: true
          description: Our datasource type it needs (`prometheus` or `clickhouse`); null for a built-in datasource.
        panels:
          type: integer
          minimum: 0
        match:
          type: string
          nullable: true
          description: The uid of our datasource it will use; null while unmatched.
        matched_by:
          type: string
          enum: [mapping, uid, alias, only]
          nullable: true
        candidates:
          type: array
          items:
            type: string
          description: The uids of ours of the same kind.
    ImportQueryLine:
      type: object
      additionalProperties: false
      required: [ref_id, ref, datasource, rewrites, dropped]
      properties:
        ref_id:
          type: string
        ref:
          type: string
          nullable: true
        datasource:
          type: string
          nullable: true
        rewrites:
          type: array
          items:
            type: string
        dropped:
          type: string
          nullable: true
    ImportPanelLine:
      type: object
      additionalProperties: false
      required: [panel_id, grafana_id, grafana_path, title, type, source_type, row, status, reasons, paths, queries]
      properties:
        panel_id:
          type: string
        grafana_id:
          type: integer
          nullable: true
        grafana_path:
          type: string
        title:
          type: string
        type:
          type: string
        source_type:
          type: string
        row:
          type: string
          nullable: true
        status:
          type: string
          enum: [imported, partial, placeholder, unverified]
        reasons:
          type: array
          items:
            type: string
        paths:
          type: array
          items:
            type: string
        queries:
          type: array
          items:
            $ref: "#/components/schemas/ImportQueryLine"
    ImportNote:
      type: object
      additionalProperties: false
      required: [subject, status, reason, paths]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [imported, partial, placeholder, unverified]
        reason:
          type: string
        paths:
          type: array
          items:
            type: string
    ImportCounts:
      type: object
      additionalProperties: false
      required: [total, imported, partial, placeholder, unverified]
      properties:
        total:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        partial:
          type: integer
          minimum: 0
        placeholder:
          type: integer
          minimum: 0
        unverified:
          type: integer
          minimum: 0
    ImportOptionLine:
      type: object
      additionalProperties: false
      required: [path, outcome, spec, reason]
      properties:
        path:
          type: string
          description: The Grafana option path relative to its block, in report syntax.
        outcome:
          type: string
          enum: [mapped, excluded, reported, default, no_effect, bookkeeping]
          description: "`default`, `no_effect` and `bookkeeping` are implicit options: a Grafana default value, an option with no visible effect, and editor bookkeeping; they need no Spec setting."
        spec:
          type: array
          items:
            type: string
          description: The ObserveSpec fields the option became, relative to the block's Spec object, array indexes written `[]`; empty when the option was not imported, is implicit, or no catalog names its field.
        reason:
          type: string
          nullable: true
          description: Why the option was excluded or not imported; null for every other outcome.
    ImportBlock:
      type: object
      additionalProperties: false
      required: [kind, path, title, source_type, panel_id, outcome, reason, options, implicit, omitted, blocks]
      properties:
        kind:
          type: string
          enum: [dashboard, variable, row, panel, query, transformation, field_config, override]
        path:
          type: string
          description: The Grafana path of the block from the dashboard root; empty for the dashboard.
        title:
          type: string
          description: The panel or row title, variable name, query ref id, transformation id or override matcher id; empty for the dashboard and field config.
        source_type:
          type: string
          description: The Grafana panel or variable type, or the query kind; empty otherwise.
        panel_id:
          type: string
          nullable: true
          description: The id of the Spec panel, for panel and row blocks; it matches `panels[].panel_id`.
        outcome:
          type: string
          enum: [excluded, reported]
          nullable: true
          description: Set when the whole block was not imported.
        reason:
          type: string
          nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/ImportOptionLine"
        implicit:
          type: integer
          minimum: 0
          description: How many implicit options the block carried (outcomes `default`, `no_effect` and `bookkeeping`), including any the size limits left out of `options`.
        omitted:
          type: integer
          minimum: 0
          description: Options of any outcome not listed because of the report's size limits.
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ImportBlock"
          description: Child blocks.
    ImportReport:
      type: object
      additionalProperties: false
      required: [importer_version, verified, counts, panels, notes]
      properties:
        importer_version:
          type: integer
          minimum: 1
        verified:
          type: boolean
          description: True once every query ran at save time; always false in a preview.
        counts:
          $ref: "#/components/schemas/ImportCounts"
        panels:
          type: array
          items:
            $ref: "#/components/schemas/ImportPanelLine"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ImportNote"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ImportBlock"
          description: The report grouped by dashboard block. Absent in reports stored before importer version 2.
    ImportPreview:
      type: object
      additionalProperties: false
      required: [summary, datasources, ready, report, spec]
      properties:
        summary:
          $ref: "#/components/schemas/ImportSummary"
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceDatasource"
        ready:
          type: boolean
          description: True when every source datasource has a match, so the import can be saved.
        report:
          $ref: "#/components/schemas/ImportReport"
        spec:
          type: object
          additionalProperties: true
          nullable: true
          description: The converted ObserveSpec document; null when `ready` is false.
    ImportRecord:
      type: object
      additionalProperties: false
      required: [id, dashboard_id, version, source, importer_version, title, mapping, summary, datasources, report, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: The dashboard version the import produced.
        source:
          type: string
          enum: [grafana]
        importer_version:
          type: integer
          minimum: 1
        title:
          type: string
        mapping:
          type: object
          additionalProperties:
            type: string
        summary:
          $ref: "#/components/schemas/ImportSummary"
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceDatasource"
        report:
          $ref: "#/components/schemas/ImportReport"
        grafana_uid:
          type: string
          description: >-
            The Grafana dashboard uid this import answers for, or empty.
            Only the first import of a uid holds it, and only a uid of 1 to 40 letters, digits, `-` or `_`;
            a later import of the same uid, from a file or a connection, gets an empty value.
        created_by:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
    ImportMeta:
      type: object
      additionalProperties: false
      required: [id, dashboard_id, version, importer_version, title, counts, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        importer_version:
          type: integer
          minimum: 1
        title:
          type: string
        counts:
          $ref: "#/components/schemas/ImportCounts"
        created_by:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
    ImportList:
      type: object
      additionalProperties: false
      required: [imports, next_cursor]
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/ImportMeta"
        next_cursor:
          type: string
          nullable: true
    ImportedDashboard:
      type: object
      additionalProperties: false
      required: [dashboard, version, import, folder_note]
      properties:
        dashboard:
          $ref: "#/components/schemas/DashboardSummary"
        version:
          $ref: "#/components/schemas/Version"
        import:
          $ref: "#/components/schemas/ImportRecord"
        folder_note:
          type: string
          nullable: true
          description: Why the dashboard is not in the requested folder, or null when it is where the request or the source asked.
    DatasourcesUnresolved:
      type: object
      additionalProperties: false
      required: [error, code, datasources]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [datasources_unresolved]
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceDatasource"
    ProvisionStatus:
      type: object
      additionalProperties: false
      required: [dir, dashboards, errors]
      properties:
        dir:
          type: string
          nullable: true
          description: The value of `SLASHOBSERVE_PROVISION_DIR`, or null when provisioning is off.
        dashboards:
          type: array
          description: Files that became a dashboard, including files that have since left the directory, because their dashboards stay.
          items:
            type: object
            additionalProperties: false
            required: [path, dashboard_id, folder, updated_at, last_error]
            properties:
              path:
                type: string
              dashboard_id:
                type: string
                format: uuid
              folder:
                type: string
                description: The title of the folder the file was first provisioned into.
              updated_at:
                type: string
                format: date-time
                description: When the file's content was last saved as a version.
              last_error:
                type: string
                nullable: true
                description: Why the file's current content could not be saved; the dashboard keeps its last saved version. Null when the last save of the file worked.
        errors:
          type: array
          description: Files in the directory that never became a dashboard.
          items:
            type: object
            additionalProperties: false
            required: [path, message, seen_at]
            properties:
              path:
                type: string
              message:
                type: string
              seen_at:
                type: string
                format: date-time
    GrafanaConnectionTest:
      type: object
      additionalProperties: false
      required: [at, ok, message]
      properties:
        at:
          type: string
          format: date-time
        ok:
          type: boolean
        message:
          type: string
          description: A fixed sentence chosen by the outcome, such as the folder and dashboard counts or why Grafana could not be read.
    GrafanaImportSummary:
      type: object
      additionalProperties: false
      required: [id, status, total, done, failed, skipped, error, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, finished, failed, canceled]
          description: "`failed` means the run could not list Grafana's dashboards; one failing dashboard only counts in `failed`."
        total:
          type: integer
          description: The dashboards chosen, known once the dashboards are listed; 0 until then.
        done:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
          description: Dashboards imported before whose Grafana version is not newer.
        error:
          type: string
          nullable: true
          description: Why the run failed; null unless `status` is `failed`.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    GrafanaImportResult:
      type: object
      additionalProperties: false
      required: [uid, title, outcome, dashboard_id, unverified_panels, placeholder_panels, error]
      properties:
        uid:
          type: string
          description: The Grafana dashboard uid.
        title:
          type: string
        outcome:
          type: string
          enum: [imported, updated, skipped, failed]
        dashboard_id:
          type: string
          format: uuid
          nullable: true
        unverified_panels:
          type: integer
        placeholder_panels:
          type: integer
        error:
          type: string
          nullable: true
          description: A fixed sentence chosen by the kind of failure; null unless `outcome` is `failed`.
    GrafanaImport:
      type: object
      additionalProperties: false
      required: [id, connection_id, status, total, done, failed, skipped, error, started_at, finished_at, results]
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, finished, failed, canceled]
        total:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        error:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        results:
          type: array
          description: One entry per dashboard handled so far, in the order they finished.
          items:
            $ref: "#/components/schemas/GrafanaImportResult"
    GrafanaConnection:
      type: object
      additionalProperties: false
      required: [id, name, url, created_by, created_at, updated_at, last_test, last_sync]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          description: The Grafana base URL as stored, without a trailing slash.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The id of the person or service account that stored the connection.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_test:
          nullable: true
          description: Null until the connection is tested, and again after its URL or token changes.
          allOf:
            - $ref: "#/components/schemas/GrafanaConnectionTest"
        last_sync:
          nullable: true
          description: The summary of the last finished import, or null before the first one.
          allOf:
            - $ref: "#/components/schemas/GrafanaImportSummary"
    GrafanaConnectionList:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/GrafanaConnection"
    CreateGrafanaConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, url, token]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: The Grafana base URL, http or https, with a domain name and no user info, query or fragment.
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: A Grafana service-account token with Viewer access to the folders to import.
    UpdateGrafanaConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: A new URL needs `token` in the same request.
        token:
          type: string
          minLength: 1
          maxLength: 4096
    StartGrafanaImportRequest:
      type: object
      additionalProperties: false
      required: [folders]
      properties:
        folders:
          description: '"all", or the Grafana folder uids to import, each with its subfolders; `general` names the dashboards outside any folder.'
          oneOf:
            - type: string
              enum: [all]
            - type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
                maxLength: 64
        mapping:
          type: object
          maxProperties: 200
          description: Grafana datasource uid or name to the uid of a datasource here, for the datasources the automatic match leaves open.
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
    GrafanaFolder:
      type: object
      additionalProperties: false
      required: [uid, title, dashboards]
      properties:
        uid:
          type: string
        title:
          type: string
        dashboards:
          type: integer
    GrafanaDatasource:
      type: object
      additionalProperties: false
      required: [uid, name, type, kind, candidates, matched_uid]
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
          description: The Grafana plugin id, such as `prometheus`.
        kind:
          type: string
          nullable: true
          description: Our datasource type the importer maps it to (`prometheus` or `clickhouse`); null when SlashObserve does not query this type, and its panels import as placeholders.
        candidates:
          type: array
          items:
            type: string
          description: The uids of our datasources of that kind, the only valid mapping targets.
        matched_uid:
          type: string
          nullable: true
    RepairList:
      type: object
      additionalProperties: false
      required: [dashboards, next_cursor]
      properties:
        dashboards:
          type: array
          items:
            $ref: "#/components/schemas/RepairItem"
        next_cursor:
          type: string
          nullable: true
    RepairItem:
      type: object
      additionalProperties: false
      required: [id, title, url, folder, unverified_panels, unverified_variables, placeholder_panels, last_import_at, repair]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          description: The dashboard's address in the web app.
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        unverified_panels:
          type: integer
          minimum: 0
        unverified_variables:
          type: integer
          minimum: 0
        placeholder_panels:
          type: integer
          minimum: 0
          description: Placeholder panels, top level or inside rows; people replace them, the agent does not.
        last_import_at:
          type: string
          format: date-time
          nullable: true
          description: When the version the dashboard's import record points at was saved; null for a dashboard that was not imported, such as a duplicate of one.
        repair:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RepairStatus"
    RepairStatus:
      type: object
      additionalProperties: false
      required: [id, status, finished_at]
      properties:
        id:
          type: string
          format: uuid
          description: The agent request id.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        finished_at:
          type: string
          format: date-time
          nullable: true
    RequestRepairsRequest:
      type: object
      additionalProperties: false
      properties:
        dashboard_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        all:
          type: boolean
          enum: [true]
        folder_id:
          type: string
          format: uuid
          description: Only with `all`.
    RepairsQueued:
      type: object
      additionalProperties: false
      required: [queued, skipped]
      properties:
        queued:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dashboard_id, request_id]
            properties:
              dashboard_id:
                type: string
                format: uuid
              request_id:
                type: string
                format: uuid
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dashboard_id, reason]
            properties:
              dashboard_id:
                type: string
                format: uuid
              reason:
                type: string
                enum: [active, nothing_to_repair, not_found, forbidden_role, queue_full]
    GrafanaResolved:
      type: object
      additionalProperties: false
      required: [dashboard_id, url]
      properties:
        dashboard_id:
          type: string
          format: uuid
        url:
          type: string
          description: The web app path of the dashboard.
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is not allowed to perform the request; a role that is too low is code `forbidden_role`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSpec:
      description: The Spec fails validation or one of its queries fails; every problem is listed in `issues`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    VersionConflict:
      description: The parent version is no longer the latest; `latest_version` names the current one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflict"
    TooManyRequests:
      description: The caller already has the maximum number of query requests in flight, or the server's shared upstream call slots stayed busy for 5 seconds.
      headers:
        Retry-After:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryUnprocessable:
      description: The query or its variables cannot run, or its result exceeds a limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryBadGateway:
      description: The datasource is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryTimeout:
      description: The datasource did not answer within the query timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
