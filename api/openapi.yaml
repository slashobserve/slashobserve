openapi: 3.0.3
info:
  title: SlashObserve API
  version: "0"
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerKey: []
paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/auth-login"
  /auth/callback:
    $ref: "./paths/auth.yaml#/auth-callback"
  /auth/logout:
    $ref: "./paths/auth.yaml#/auth-logout"
  /auth/session:
    $ref: "./paths/auth.yaml#/auth-session"
  /me:
    $ref: "./paths/auth.yaml#/me"
  /instance:
    $ref: "./paths/auth.yaml#/instance"
  /service-accounts:
    $ref: "./paths/service-accounts.yaml#/service-accounts"
  /service-accounts/{id}:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id"
  /service-accounts/{id}/keys:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys"
  /service-accounts/{id}/keys/{keyId}:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys-keyid"
  /users:
    $ref: "./paths/users.yaml#/users"
  /users/{id}:
    $ref: "./paths/users.yaml#/users-id"
  /users/{id}/sessions:
    $ref: "./paths/users.yaml#/users-id-sessions"
  /outbound-domains:
    $ref: "./paths/outbound-domains.yaml#/outbound-domains"
  /outbound-domains/{domain}:
    $ref: "./paths/outbound-domains.yaml#/outbound-domains-domain"
  /prompts:
    $ref: "./paths/prompts.yaml#/prompts"
  /prompts/{id}:
    $ref: "./paths/prompts.yaml#/prompts-id"
  /datasources:
    $ref: "./paths/datasources.yaml#/datasources"
  /folders:
    $ref: "./paths/folders.yaml#/folders"
  /folders/{id}:
    $ref: "./paths/folders.yaml#/folders-id"
  /folders/{id}/permissions:
    $ref: "./paths/folders.yaml#/folders-id-permissions"
  /dashboards:
    $ref: "./paths/dashboards.yaml#/dashboards"
  /dashboards/tags:
    $ref: "./paths/dashboards.yaml#/dashboards-tags"
  /dashboards/{id}:
    $ref: "./paths/dashboards.yaml#/dashboards-id"
  /dashboards/{id}/versions:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions"
  /dashboards/{id}/versions/{version}:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version"
  /dashboards/{id}/versions/{version}/restore:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version-restore"
  /dashboards/{id}/duplicate:
    $ref: "./paths/dashboards.yaml#/dashboards-id-duplicate"
  /dashboards/{id}/diff:
    $ref: "./paths/dashboards.yaml#/dashboards-id-diff"
  /dashboards/{id}/import:
    $ref: "./paths/imports.yaml#/dashboards-id-import"
  /dashboards/{id}/actions:
    $ref: "./paths/actions.yaml#/dashboards-id-actions"
  /dashboards/{id}/events:
    $ref: "./paths/events.yaml#/dashboards-id-events"
  /dashboards/{id}/comments:
    $ref: "./paths/comments.yaml#/dashboards-id-comments"
  /dashboards/{id}/comments/{comment_id}:
    $ref: "./paths/comments.yaml#/dashboards-id-comments-commentid"
  /dashboards/{id}/versions/{version}/panels/{panel_id}/data:
    $ref: "./paths/queryproxy.yaml#/dashboards-id-versions-version-panels-panel-id-data"
  /dashboards/{id}/versions/{version}/variables/{name}/values:
    $ref: "./paths/queryproxy.yaml#/dashboards-id-versions-version-variables-name-values"
  /datasources/{uid}/lint:
    $ref: "./paths/queryproxy.yaml#/datasources-uid-lint"
  /datasources/{uid}/preview:
    $ref: "./paths/preview.yaml#/datasources-uid-preview"
  /datasources/{uid}/metrics:
    $ref: "./paths/names.yaml#/datasources-uid-metrics"
  /datasources/{uid}/labels:
    $ref: "./paths/names.yaml#/datasources-uid-labels"
  /datasources/{uid}/labels/{name}/values:
    $ref: "./paths/names.yaml#/datasources-uid-labels-name-values"
  /dashboards/{id}/revisions:
    $ref: "./paths/revisions.yaml#/dashboards-id-revisions"
  /dashboards/{id}/revisions/{revision_id}:
    $ref: "./paths/revisions.yaml#/dashboards-id-revisions-revisionid"
  /dashboards/{id}/suggestions:
    $ref: "./paths/suggestions.yaml#/dashboards-id-suggestions"
  /dashboards/{id}/suggestions/{suggestion_id}:
    $ref: "./paths/suggestions.yaml#/dashboards-id-suggestions-suggestionid"
  /agent:
    $ref: "./paths/observe.yaml#/agent"
  /observe:
    $ref: "./paths/observe.yaml#/observe"
  /observe/{id}:
    $ref: "./paths/observe.yaml#/observe-id"
  /news:
    $ref: "./paths/news.yaml#/news"
  /assets/image:
    $ref: "./paths/assets.yaml#/image"
  /assets/geojson:
    $ref: "./paths/assets.yaml#/geojson"
  /imports/preview:
    $ref: "./paths/imports.yaml#/imports-preview"
  /imports:
    $ref: "./paths/imports.yaml#/imports"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: so_session
      description: Opaque session token set by the OIDC callback. The cookie is named `__Host-so_session` when the public URL is https.
    bearerKey:
      type: http
      scheme: bearer
      description: Service-account key issued by the keys endpoint, prefixed `sok_`.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    Issue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
          description: >-
            Spec parsing adds schema and semantic codes such as `schema`, `too_large`, `unknown_unit`, `duplicate_panel_id`, `unknown_variable`,
            `too_many_panels` (more than 200 panels counting row children), `duplicate_query_ref`, `unknown_query_ref` (an override or an expression names a query ref the panel does not have),
            `threshold_value_missing` (a threshold other than the first omits its value), `duplicate_element_id` (a canvas panel repeats an element id, path `/panels/{i}/display/elements/{k}/id`)
            and `unknown_element` (a canvas connection names no element, path `/panels/{i}/display/connections/{k}/from` or `/to`).
            A `timezone` the server cannot load is `unknown_timezone` (path `/timezone`).
            Saving a dashboard also runs every panel and variable query and adds `unknown_datasource`, `time_range_invalid` (path `/time`),
            `variable_failed`, `variable_empty` and `variable_unresolved` (paths `/variables/{i}` or `/panels/{i}/queries/{j}/query`, with `/panels/{i}/panels/{j}` for a row child),
            and `query_invalid`, `query_forbidden`, `limit_exceeded`, `query_timeout`, `datasource_unavailable`, `not_found`, `query_empty`, `expression_error` and `internal`
            (paths `/panels/{i}/queries/{j}/query`, `/panels/{i}/queries/{j}/expression` for an expression query, `/panels/{i}/datasource` and `/panels/{i}/queries/{j}/datasource`; `query_empty` is reported once for the panel at `/panels/{i}/queries`, and never for an `alertlist` panel, whose empty result is valid).
            A query issue on a panel or variable the parent version lists in `unverified` may be kept instead of failing the save; see `POST /dashboards/{id}/versions`.
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, code, issues]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Role:
      type: string
      enum: [admin, editor, commenter, viewer]
    RoleSource:
      type: string
      enum: [admin_emails, first_user, group, manual, default]
      description: Where a person's role comes from. admin_emails, first_user and group are decided by the server settings or the identity provider and cannot be changed through the API.
    Principal:
      type: object
      additionalProperties: false
      required: [kind, id, name, role]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Instance:
      type: object
      additionalProperties: false
      required:
        - public_url
        - mcp_url
        - oidc_issuer_url
        - oidc_provider_name
        - allowed_email_domains
        - any_email_domain
        - session_ttl_seconds
      properties:
        public_url:
          type: string
          format: uri
        mcp_url:
          type: string
          format: uri
        oidc_issuer_url:
          type: string
          description: The identity provider's issuer, as browsers reach it.
        oidc_provider_name:
          type: string
          description: The identity provider's display name, empty when none is configured.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Empty when any domain may sign in.
        any_email_domain:
          type: boolean
        session_ttl_seconds:
          type: integer
          minimum: 300
    SessionState:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, name, description, created_by, created_at, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description:
          type: string
          maxLength: 256
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role the account's keys act with; editor when omitted.
    UpdateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    ServiceAccountKey:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - name
        - display_prefix
        - created_by
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        service_account_id:
          type: string
          format: uuid
        name:
          type: string
        display_prefix:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ServiceAccountKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccountKey"
    CreateServiceAccountKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
    IssuedServiceAccountKey:
      type: object
      additionalProperties: false
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/ServiceAccountKey"
        token:
          type: string
          description: The full key, returned only once.
    Person:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - created_at
        - last_login_at
        - last_seen_at
        - dashboard_count
        - key_count
        - session_count
        - role
        - role_source
        - role_group
        - role_set_by
        - role_locked
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once a minute while a session is used; seen within the last 2 minutes means online now.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose first version this person saved, either directly or through an agent request they sent. Dashboards created with a service-account key are not counted.
        key_count:
          type: integer
          minimum: 0
          description: Unrevoked, unexpired service-account keys this person created.
        session_count:
          type: integer
          minimum: 0
          description: Unexpired sessions.
        role:
          $ref: "#/components/schemas/Role"
        role_source:
          $ref: "#/components/schemas/RoleSource"
        role_group:
          type: string
          nullable: true
          description: The identity-provider group that decided the role when role_source is group.
        role_set_by:
          type: string
          nullable: true
          description: The name of the Admin who chose the role when role_source is manual.
        role_locked:
          type: boolean
          description: True when the role cannot be changed through the API.
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role to set, or null to clear the chosen role and fall back to the computed one.
    OutboundDomain:
      type: object
      additionalProperties: false
      required: [domain, added_at, added_by]
      properties:
        domain:
          type: string
          description: A host name, or `*.` followed by a host name for its subdomains only, in lower case ASCII.
        added_at:
          type: string
          format: date-time
          nullable: true
          description: Null for an entry set by `SLASHOBSERVE_OUTBOUND_DOMAINS`.
        added_by:
          type: string
          nullable: true
          description: The name of the person who allowed the domain; null for an entry set by `SLASHOBSERVE_OUTBOUND_DOMAINS` and when that person was deleted.
    OutboundDomainList:
      type: object
      additionalProperties: false
      required: [managed_by, domains]
      properties:
        managed_by:
          type: string
          enum: [settings, config]
          description: "`config` when `SLASHOBSERVE_OUTBOUND_DOMAINS` is set; the list is then read-only."
        domains:
          type: array
          items:
            $ref: "#/components/schemas/OutboundDomain"
    Permissions:
      type: object
      additionalProperties: false
      required: [comment, edit, manage, create]
      description: What the caller may do with the object; being able to read it implies viewing.
      properties:
        comment:
          type: boolean
        edit:
          type: boolean
        manage:
          type: boolean
          description: Rename, change the permissions of and delete a folder.
        create:
          type: boolean
          description: Create, duplicate or import dashboards into the folder, or move dashboards into it (the Edit level).
    FolderLevel:
      type: string
      enum: [view, comment, edit, admin]
    Folder:
      type: object
      additionalProperties: false
      required: [id, title, general, restricted, dashboard_count, grantees, grantee_count, created_by, permissions, level]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        general:
          type: boolean
          description: True for the General folder, which holds dashboards without a folder of their own and is never restricted, renamed or deleted.
        restricted:
          type: boolean
          description: True when the folder lists people or groups; false means open to everyone by instance role.
        dashboard_count:
          type: integer
          description: All dashboards in the folder, including ones the caller cannot see when the caller manages it.
        grantees:
          type: array
          maxItems: 5
          description: The names of up to 5 listed people, then groups.
          items:
            type: string
        grantee_count:
          type: integer
          description: How many people and groups are listed.
        created_by:
          nullable: true
          description: Null for General and for folders made before creators were recorded.
          allOf:
            - $ref: "#/components/schemas/Author"
        permissions:
          $ref: "#/components/schemas/Permissions"
        level:
          description: The caller's level on this folder and on every dashboard in it, the higher of what their role gives and their highest matching entry. Admins always have `admin`.
          allOf:
            - $ref: "#/components/schemas/FolderLevel"
    FolderPermissionEntry:
      type: object
      additionalProperties: false
      required: [kind, level]
      properties:
        kind:
          type: string
          enum: [user, group]
        user:
          type: object
          additionalProperties: false
          required: [id, name, email, role]
          description: Present when `kind` is `user`.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            role:
              $ref: "#/components/schemas/Role"
        group:
          type: string
          description: Present when `kind` is `group`.
        member_count:
          type: integer
          description: Present when `kind` is `group`; people who signed in with the group in their stored claims.
        level:
          $ref: "#/components/schemas/FolderLevel"
    FolderPermissions:
      type: object
      additionalProperties: false
      required: [restricted, entries]
      properties:
        restricted:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FolderPermissionEntry"
    SavedPrompt:
      type: object
      additionalProperties: false
      required: [id, name, body, shared, owner, can_edit, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique per owner and among shared prompts, ignoring case. Letters, numbers, spaces, `-` and `_`; it starts and ends with a letter or number, and runs of spaces are stored as one.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The prompt text sent to the agent, trimmed; at most 4000 characters, the same limit as `POST /observe`.
        shared:
          type: boolean
          description: True when everyone on the server can see and run it; false when only its owner can.
        owner:
          $ref: "#/components/schemas/SavedPromptOwner"
        can_edit:
          type: boolean
          description: Whether the caller may change or delete it. The server decides; clients never recompute it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedPromptOwner:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The owner's display name, or their email when they have no name.
    SavedPromptList:
      type: object
      additionalProperties: false
      required: [prompts]
      properties:
        prompts:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SavedPrompt"
    NewsItem:
      type: object
      additionalProperties: false
      required: [title, link, published, summary]
      properties:
        title:
          type: string
          maxLength: 300
          description: Plain text, never markup.
        link:
          type: string
          nullable: true
          maxLength: 2000
          description: An absolute http or https URL without user info, or null when the feed gave none or an unsafe one.
        published:
          type: string
          format: date-time
          nullable: true
        summary:
          type: string
          maxLength: 500
          description: Plain text, never markup; may be empty.
    ActionResult:
      type: object
      additionalProperties: false
      required: [status, ok]
      properties:
        status:
          type: integer
          description: The HTTP status the remote server answered with; a redirect is reported as its own 3xx status.
        ok:
          type: boolean
          description: True when the status is 2xx.
    ActionError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        host:
          type: string
          description: The domain the request was meant for, present on `outbound_domain_not_allowed` and `action_failed`.
    NewsFeed:
      type: object
      additionalProperties: false
      required: [title, items, fetched_at]
      properties:
        title:
          type: string
          maxLength: 200
        items:
          type: array
          maxItems: 50
          description: In feed order, at most 50.
          items:
            $ref: "#/components/schemas/NewsItem"
        fetched_at:
          type: string
          format: date-time
          description: When the server fetched the feed; a cached feed keeps the time of its fetch.
    DatasourceStatus:
      type: object
      additionalProperties: false
      required: [uid, type, name, healthy, checked_at, dashboard_count]
      properties:
        uid:
          type: string
        type:
          type: string
        name:
          type: string
        healthy:
          type: boolean
        message:
          type: string
        checked_at:
          type: string
          format: date-time
          description: When the server last checked the datasource; checks are cached for 10 seconds.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose latest version uses this datasource.
    DatasourceList:
      type: object
      additionalProperties: false
      required: [datasources]
      properties:
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceStatus"
    MetricName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
        help:
          type: string
          maxLength: 163
        unit:
          type: string
        table:
          type: string
    Author:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    Creator:
      type: object
      additionalProperties: false
      required: [author, origin, origin_client, via]
      description: Who made version 1 of the dashboard. It never changes.
      properties:
        author:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where version 1 came from; null for dashboards created before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's name when `origin` is `mcp`, else null.
        via:
          type: string
          enum: [direct, agent]
          description: "`agent` when the agent saved version 1; `author` is then the person or key that asked."
    DashboardFolder:
      type: object
      additionalProperties: false
      required: [id, title, general]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        general:
          type: boolean
          description: True for the General folder.
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [id, title, tags, latest_version, created_at, updated_at, updated_by, creator, folder, permissions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
        creator:
          $ref: "#/components/schemas/Creator"
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        permissions:
          $ref: "#/components/schemas/Permissions"
    DashboardListItem:
      type: object
      additionalProperties: false
      required: [id, title, description, tags, latest_version, created_at, updated_at, updated_by, creator, datasource_uids, open_comment_count, folder, permissions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
          description: The latest version's Spec description; null when it has none.
        tags:
          type: array
          items:
            type: string
