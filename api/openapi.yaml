openapi: 3.0.3
info:
  title: SlashObserve API
  version: "0"
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerKey: []
paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/auth-login"
  /auth/callback:
    $ref: "./paths/auth.yaml#/auth-callback"
  /auth/logout:
    $ref: "./paths/auth.yaml#/auth-logout"
  /auth/session:
    $ref: "./paths/auth.yaml#/auth-session"
  /me:
    $ref: "./paths/auth.yaml#/me"
  /service-accounts:
    $ref: "./paths/service-accounts.yaml#/service-accounts"
  /service-accounts/{id}/keys:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys"
  /service-accounts/{id}/keys/{keyId}:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys-keyid"
  /datasources:
    $ref: "./paths/datasources.yaml#/datasources"
  /dashboards:
    $ref: "./paths/dashboards.yaml#/dashboards"
  /dashboards/{id}:
    $ref: "./paths/dashboards.yaml#/dashboards-id"
  /dashboards/{id}/versions:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions"
  /dashboards/{id}/versions/{version}:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version"
  /dashboards/{id}/versions/{version}/restore:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version-restore"
  /dashboards/{id}/diff:
    $ref: "./paths/dashboards.yaml#/dashboards-id-diff"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: so_session
      description: Opaque session token set by the OIDC callback. The cookie is named `__Host-so_session` when the public URL is https.
    bearerKey:
      type: http
      scheme: bearer
      description: Service-account key issued by the keys endpoint, prefixed `sok_`.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    Issue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
          description: >-
            Spec parsing adds schema and semantic codes such as `schema`, `too_large`, `duplicate_panel_id` and `unknown_variable`.
            Saving a dashboard also runs every panel and variable query and adds `unknown_datasource`, `datasource_type_mismatch`, `time_range_invalid` (path `/timeRange`),
            `variable_failed`, `variable_empty` and `variable_unresolved` (paths `/variables/{i}` or `/panels/{i}/query`),
            and `query_invalid`, `query_forbidden`, `limit_exceeded`, `query_timeout`, `datasource_unavailable`, `not_found`, `query_empty` and `internal`
            (paths `/panels/{i}/query` or `/panels/{i}/datasource/uid` and `/type`).
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, code, issues]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Principal:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    SessionState:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, name, description, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description:
          type: string
          maxLength: 256
    ServiceAccountKey:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - name
        - display_prefix
        - created_by
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        service_account_id:
          type: string
          format: uuid
        name:
          type: string
        display_prefix:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ServiceAccountKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccountKey"
    CreateServiceAccountKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
    IssuedServiceAccountKey:
      type: object
      additionalProperties: false
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/ServiceAccountKey"
        token:
          type: string
          description: The full key, returned only once.
    DatasourceStatus:
      type: object
      additionalProperties: false
      required: [uid, type, name, healthy, checked_at]
      properties:
        uid:
          type: string
        type:
          type: string
        name:
          type: string
        healthy:
          type: boolean
        message:
          type: string
        checked_at:
          type: string
          format: date-time
    DatasourceList:
      type: object
      additionalProperties: false
      required: [datasources]
      properties:
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceStatus"
    Author:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [id, title, tags, latest_version, created_at, updated_at, updated_by]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
    VersionMeta:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
    Version:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at, spec]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        spec:
          type: object
          additionalProperties: true
          description: The ObserveSpec document, validated against its own schema.
    DashboardWithVersion:
      type: object
      additionalProperties: false
      required: [dashboard, version]
      properties:
        dashboard:
          $ref: "#/components/schemas/DashboardSummary"
        version:
          $ref: "#/components/schemas/Version"
    SpecChange:
      type: object
      additionalProperties: false
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, reorder]
        path:
          type: string
          description: JSON Pointer into the Spec document.
        from:
          nullable: true
          description: The previous JSON value at the path.
        to:
          nullable: true
          description: The new JSON value at the path.
    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, code, latest_version]
      properties:
        error:
          type: string
        code:
          type: string
        latest_version:
          type: integer
          minimum: 1
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is not allowed to perform the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSpec:
      description: The Spec fails validation or one of its queries fails; every problem is listed in `issues`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    VersionConflict:
      description: The parent version is no longer the latest; `latest_version` names the current one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflict"
