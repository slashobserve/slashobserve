openapi: 3.0.3
info:
  title: SlashObserve API
  version: "0"
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerKey: []
paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/auth-login"
  /auth/callback:
    $ref: "./paths/auth.yaml#/auth-callback"
  /auth/logout:
    $ref: "./paths/auth.yaml#/auth-logout"
  /auth/session:
    $ref: "./paths/auth.yaml#/auth-session"
  /me:
    $ref: "./paths/auth.yaml#/me"
  /instance:
    $ref: "./paths/auth.yaml#/instance"
  /service-accounts:
    $ref: "./paths/service-accounts.yaml#/service-accounts"
  /service-accounts/{id}/keys:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys"
  /service-accounts/{id}/keys/{keyId}:
    $ref: "./paths/service-accounts.yaml#/service-accounts-id-keys-keyid"
  /users:
    $ref: "./paths/users.yaml#/users"
  /users/{id}/sessions:
    $ref: "./paths/users.yaml#/users-id-sessions"
  /datasources:
    $ref: "./paths/datasources.yaml#/datasources"
  /dashboards:
    $ref: "./paths/dashboards.yaml#/dashboards"
  /dashboards/{id}:
    $ref: "./paths/dashboards.yaml#/dashboards-id"
  /dashboards/{id}/versions:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions"
  /dashboards/{id}/versions/{version}:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version"
  /dashboards/{id}/versions/{version}/restore:
    $ref: "./paths/dashboards.yaml#/dashboards-id-versions-version-restore"
  /dashboards/{id}/diff:
    $ref: "./paths/dashboards.yaml#/dashboards-id-diff"
  /dashboards/{id}/events:
    $ref: "./paths/events.yaml#/dashboards-id-events"
  /dashboards/{id}/comments:
    $ref: "./paths/comments.yaml#/dashboards-id-comments"
  /dashboards/{id}/comments/{comment_id}:
    $ref: "./paths/comments.yaml#/dashboards-id-comments-commentid"
  /dashboards/{id}/versions/{version}/panels/{panel_id}/data:
    $ref: "./paths/queryproxy.yaml#/dashboards-id-versions-version-panels-panel-id-data"
  /dashboards/{id}/versions/{version}/variables/{name}/values:
    $ref: "./paths/queryproxy.yaml#/dashboards-id-versions-version-variables-name-values"
  /datasources/{uid}/lint:
    $ref: "./paths/queryproxy.yaml#/datasources-uid-lint"
  /dashboards/{id}/revisions:
    $ref: "./paths/revisions.yaml#/dashboards-id-revisions"
  /dashboards/{id}/revisions/{revision_id}:
    $ref: "./paths/revisions.yaml#/dashboards-id-revisions-revisionid"
  /agent:
    $ref: "./paths/observe.yaml#/agent"
  /observe:
    $ref: "./paths/observe.yaml#/observe"
  /observe/{id}:
    $ref: "./paths/observe.yaml#/observe-id"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: so_session
      description: Opaque session token set by the OIDC callback. The cookie is named `__Host-so_session` when the public URL is https.
    bearerKey:
      type: http
      scheme: bearer
      description: Service-account key issued by the keys endpoint, prefixed `sok_`.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    Issue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
          description: >-
            Spec parsing adds schema and semantic codes such as `schema`, `too_large`, `duplicate_panel_id` and `unknown_variable`.
            Saving a dashboard also runs every panel and variable query and adds `unknown_datasource`, `datasource_type_mismatch`, `time_range_invalid` (path `/timeRange`),
            `variable_failed`, `variable_empty` and `variable_unresolved` (paths `/variables/{i}` or `/panels/{i}/query`),
            and `query_invalid`, `query_forbidden`, `limit_exceeded`, `query_timeout`, `datasource_unavailable`, `not_found`, `query_empty` and `internal`
            (paths `/panels/{i}/query` or `/panels/{i}/datasource/uid` and `/type`).
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, code, issues]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Principal:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    Instance:
      type: object
      additionalProperties: false
      required:
        - public_url
        - mcp_url
        - oidc_issuer_url
        - oidc_provider_name
        - allowed_email_domains
        - any_email_domain
        - session_ttl_seconds
      properties:
        public_url:
          type: string
          format: uri
        mcp_url:
          type: string
          format: uri
        oidc_issuer_url:
          type: string
          description: The identity provider's issuer, as browsers reach it.
        oidc_provider_name:
          type: string
          description: The identity provider's display name, empty when none is configured.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Empty when any domain may sign in.
        any_email_domain:
          type: boolean
        session_ttl_seconds:
          type: integer
          minimum: 300
    SessionState:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, name, description, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description:
          type: string
          maxLength: 256
    ServiceAccountKey:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - name
        - display_prefix
        - created_by
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        service_account_id:
          type: string
          format: uuid
        name:
          type: string
        display_prefix:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ServiceAccountKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccountKey"
    CreateServiceAccountKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
    IssuedServiceAccountKey:
      type: object
      additionalProperties: false
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/ServiceAccountKey"
        token:
          type: string
          description: The full key, returned only once.
    Person:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - created_at
        - last_login_at
        - last_seen_at
        - dashboard_count
        - key_count
        - session_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once a minute while a session is used; seen within the last 2 minutes means online now.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose version 1 this person authored, including agent-made ones they asked for.
        key_count:
          type: integer
          minimum: 0
          description: Unrevoked, unexpired service-account keys this person created.
        session_count:
          type: integer
          minimum: 0
          description: Unexpired sessions.
    DatasourceStatus:
      type: object
      additionalProperties: false
      required: [uid, type, name, healthy, checked_at]
      properties:
        uid:
          type: string
        type:
          type: string
        name:
          type: string
        healthy:
          type: boolean
        message:
          type: string
        checked_at:
          type: string
          format: date-time
    DatasourceList:
      type: object
      additionalProperties: false
      required: [datasources]
      properties:
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceStatus"
    Author:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [id, title, tags, latest_version, created_at, updated_at, updated_by]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
    VersionMeta:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
    Version:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at, spec]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        spec:
          type: object
          additionalProperties: true
          description: The ObserveSpec document, validated against its own schema.
    DashboardWithVersion:
      type: object
      additionalProperties: false
      required: [dashboard, version]
      properties:
        dashboard:
          $ref: "#/components/schemas/DashboardSummary"
        version:
          $ref: "#/components/schemas/Version"
    SpecChange:
      type: object
      additionalProperties: false
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, reorder]
        path:
          type: string
          description: JSON Pointer into the Spec document; the empty string is the whole document.
        from:
          nullable: true
          description: The previous JSON value at the path.
        to:
          nullable: true
          description: The new JSON value at the path.
    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, code, latest_version]
      properties:
        error:
          type: string
        code:
          type: string
        latest_version:
          type: integer
          minimum: 1
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - version
        - panel_id
        - body
        - status
        - author
        - created_at
        - updated_at
        - resolved_at
        - resolved_by
        - panel_present
        - revision
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        panel_id:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Author"
        panel_present:
          type: boolean
          description: Whether the latest version of the dashboard still has the panel the comment is anchored to.
        revision:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, status]
          description: The latest revision requested for this comment, or null when none was requested.
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, running, succeeded, failed]
    CommentEnvelope:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
    Field:
      type: object
      additionalProperties: false
      required: [name, type, values]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [time, number, string, bool, other]
        values:
          type: array
          description: >-
            Time fields hold epoch milliseconds as integers, number fields hold numbers with `null` for gaps,
            and `other` fields hold JSON exactly as the datasource adapter produced it.
          items:
            nullable: true
    Frame:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
    DataMeta:
      type: object
      additionalProperties: false
      required: [kind, from, to, step_ms, cached, executed_at]
      properties:
        kind:
          type: string
          enum: [range, instant]
        from:
          type: string
          format: date-time
          description: The start of the aligned range the query ran over.
        to:
          type: string
          format: date-time
          description: The end of the aligned range the query ran over.
        step_ms:
          type: integer
          minimum: 0
          description: The query resolution; 0 for an instant panel.
        cached:
          type: boolean
          description: True when the response was served from the proxy's response cache instead of running the query.
        executed_at:
          type: string
          format: date-time
          description: When the query ran upstream, which for a cached response is earlier than the request.
    PanelData:
      type: object
      additionalProperties: false
      required: [frames, meta]
      properties:
        frames:
          type: array
          items:
            $ref: "#/components/schemas/Frame"
        meta:
          $ref: "#/components/schemas/DataMeta"
    VariableValues:
      type: object
      additionalProperties: false
      required: [values, truncated, cached]
      properties:
        values:
          type: array
          items:
            type: string
        truncated:
          type: boolean
        cached:
          type: boolean
          description: True when the list was served from the proxy's response cache instead of running the query.
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, message, start, end]
      properties:
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        start:
          type: integer
          minimum: 0
          description: Byte offset of the first byte the diagnostic covers.
        end:
          type: integer
          minimum: 0
          description: Byte offset just past the last byte the diagnostic covers.
    LintResult:
      type: object
      additionalProperties: false
      required: [diagnostics]
      properties:
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
    Revision:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - source
        - comment_id
        - panel_id
        - prompt
        - base_version
        - status
        - attempts
        - result_version
        - error
        - requested_by
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt]
        comment_id:
          type: string
          format: uuid
          nullable: true
          description: The comment that requested the revision; null for a prompt, or after the comment was deleted.
        panel_id:
          type: string
          nullable: true
          description: The panel the comment is anchored to; null for a prompt.
        prompt:
          type: string
          description: The follow-up text, or the comment body.
        base_version:
          type: integer
          minimum: 1
          description: The version the requester was looking at; the agent revises the latest version.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the revision saved, set when the status is `succeeded`.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the revision failed, set when the status is `failed`.
        requested_by:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    RevisionEnvelope:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
    AgentInfo:
      type: object
      additionalProperties: false
      required: [available, provider, model, effort]
      properties:
        available:
          type: boolean
        provider:
          type: string
          nullable: true
          description: The configured LLM provider, null when no agent is configured.
        model:
          type: string
          nullable: true
          description: The model the agent uses, null when no agent is configured.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          nullable: true
          description: Reasoning effort of the Anthropic provider; null otherwise.
    AgentStep:
      type: object
      additionalProperties: false
      required: [at, attempt, phase, tool, status, message, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        attempt:
          type: integer
          minimum: 0
          description: >-
            The attempt that ran the step.
            A shutdown release gives the attempt back and deletes its steps, so the re-claimed run reuses the same attempt number with a fresh step list.
            Clients detect a restarted list by each step's `at`, not by `attempt` alone.
        phase:
          type: string
          enum: [discover, lint, query, save, repair]
        tool:
          type: string
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
          description: The tool's fixed progress text, for example `Listed 37 metrics on prom`.
        duration_ms:
          type: integer
          minimum: 0
    AgentUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - model_calls
        - repair_rounds
      properties:
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        repair_rounds:
          type: integer
          minimum: 0
    AgentRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - prompt
        - dashboard_id
        - base_version
        - panel_id
        - comment_id
        - status
        - attempts
        - result_version
        - url
        - error
        - steps
        - usage
        - requested_by
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe]
        prompt:
          type: string
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard the request targets; for a new-dashboard request it is null until the request has succeeded.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version a revision was requested against; null for a new-dashboard request.
        panel_id:
          type: string
          nullable: true
        comment_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the request saved, set when the status is `succeeded`.
        url:
          type: string
          nullable: true
          description: The address of the dashboard, set when the status is `succeeded`.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the request failed, set when the status is `failed`.
        steps:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AgentStep"
        usage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUsage"
          description: Tokens, model calls and repair rounds of the attempt that finished the request.
        requested_by:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    AgentRequestEnvelope:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/AgentRequest"
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is not allowed to perform the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSpec:
      description: The Spec fails validation or one of its queries fails; every problem is listed in `issues`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    VersionConflict:
      description: The parent version is no longer the latest; `latest_version` names the current one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflict"
    TooManyRequests:
      description: The caller already has the maximum number of query requests in flight.
      headers:
        Retry-After:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryUnprocessable:
      description: The query or its variables cannot run, or its result exceeds a limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryBadGateway:
      description: The datasource is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryTimeout:
      description: The datasource did not answer within the query timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
