        - steps
        - usage
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe]
        prompt:
          type: string
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard the request targets; for a new-dashboard request it is null until the request has succeeded.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version a revision was requested against; null for a new-dashboard request.
        panel_id:
          type: string
          nullable: true
        comment_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the request saved, set when the status is `succeeded`.
        url:
          type: string
          nullable: true
          description: The address of the dashboard, set when the status is `succeeded`.
        error:
          type: string
          nullable: true
          maxLength: 500
