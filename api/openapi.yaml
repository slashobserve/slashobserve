components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: so_session
      description: Opaque session token set by the OIDC callback. The cookie is named `__Host-so_session` when the public URL is https.
    bearerKey:
      type: http
      scheme: bearer
      description: Service-account key issued by the keys endpoint, prefixed `sok_`.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    Issue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
          description: >-
            Spec parsing adds schema and semantic codes such as `schema`, `too_large`, `unknown_unit`, `duplicate_panel_id`, `unknown_variable`,
            `too_many_panels` (more than 200 panels counting row children), `duplicate_query_ref`, `unknown_query_ref` (an override or an expression names a query ref the panel does not have),
            `threshold_value_missing` (a threshold other than the first omits its value), `duplicate_element_id` (a canvas panel repeats an element id, path `/panels/{i}/display/elements/{k}/id`)
            and `unknown_element` (a canvas connection names no element, path `/panels/{i}/display/connections/{k}/from` or `/to`).
            A `timezone` the server cannot load is `unknown_timezone` (path `/timezone`).
            Saving a dashboard also runs every panel and variable query and adds `unknown_datasource`, `time_range_invalid` (path `/time`),
            `variable_failed`, `variable_empty` and `variable_unresolved` (paths `/variables/{i}` or `/panels/{i}/queries/{j}/query`, with `/panels/{i}/panels/{j}` for a row child),
            and `query_invalid`, `query_forbidden`, `limit_exceeded`, `query_timeout`, `datasource_unavailable`, `not_found`, `query_empty`, `expression_error` and `internal`
            (paths `/panels/{i}/queries/{j}/query`, `/panels/{i}/queries/{j}/expression` for an expression query, `/panels/{i}/datasource` and `/panels/{i}/queries/{j}/datasource`; `query_empty` is reported once for the panel at `/panels/{i}/queries`, and never for an `alertlist` panel, whose empty result is valid).
            A query issue on a panel or variable the parent version lists in `unverified` may be kept instead of failing the save; see `POST /dashboards/{id}/versions`.
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [error, code, issues]
      properties:
        error:
          type: string
        code:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Role:
      type: string
      enum: [admin, editor, commenter, viewer]
    RoleSource:
      type: string
      enum: [admin_emails, first_user, group, manual, default]
      description: Where a person's role comes from. admin_emails, first_user and group are decided by the server settings or the identity provider and cannot be changed through the API.
    Principal:
      type: object
      additionalProperties: false
      required: [kind, id, name, role]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Instance:
      type: object
      additionalProperties: false
      required:
        - public_url
        - mcp_url
        - oidc_issuer_url
        - oidc_provider_name
        - allowed_email_domains
        - any_email_domain
        - session_ttl_seconds
        - version
      properties:
        public_url:
          type: string
          format: uri
        mcp_url:
          type: string
          format: uri
        oidc_issuer_url:
          type: string
          description: The identity provider's issuer, as browsers reach it.
        oidc_provider_name:
          type: string
          description: The identity provider's display name, empty when none is configured.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Empty when any domain may sign in.
        any_email_domain:
          type: boolean
        session_ttl_seconds:
          type: integer
          minimum: 300
        version:
          type: string
          description: The server's release version, `dev` for a local build.
    SessionState:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, name, description, created_by, created_at, role, provisioned]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
        provisioned:
          type: boolean
          description: The account comes from the server's service-accounts file (`SLASHOBSERVE_SERVICE_ACCOUNTS_FILE`); its role, description and file key change only there.
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccount"
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        description:
          type: string
          maxLength: 256
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role the account's keys act with; editor when omitted.
    UpdateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    ServiceAccountKey:
      type: object
      additionalProperties: false
      required:
        - id
        - service_account_id
        - name
        - display_prefix
        - created_by
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        service_account_id:
          type: string
          format: uuid
        name:
          type: string
        display_prefix:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    ServiceAccountKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceAccountKey"
    CreateServiceAccountKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
    IssuedServiceAccountKey:
      type: object
      additionalProperties: false
      required: [key, token]
      properties:
        key:
          $ref: "#/components/schemas/ServiceAccountKey"
        token:
          type: string
          description: The full key, returned only once.
    Person:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - created_at
        - last_login_at
        - last_seen_at
        - dashboard_count
        - key_count
        - session_count
        - role
        - role_source
        - role_group
        - role_set_by
        - role_locked
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Updated at most once a minute while a session is used; seen within the last 2 minutes means online now.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose first version this person saved, either directly or through an agent request they sent. Dashboards created with a service-account key are not counted. Only dashboards in folders you can see are counted, so another person's My Dashboards is left out.
        key_count:
          type: integer
          minimum: 0
          description: Unrevoked, unexpired service-account keys this person created.
        session_count:
          type: integer
          minimum: 0
          description: Unexpired sessions.
        role:
          $ref: "#/components/schemas/Role"
        role_source:
          $ref: "#/components/schemas/RoleSource"
        role_group:
          type: string
          nullable: true
          description: The identity-provider group that decided the role when role_source is group.
        role_set_by:
          type: string
          nullable: true
          description: The name of the Admin who chose the role when role_source is manual.
        role_locked:
          type: boolean
          description: True when the role cannot be changed through the API.
    ConnectedAgent:
      type: object
      additionalProperties: false
      required: [id, client, person, created_at, last_used_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        client:
          type: object
          additionalProperties: false
          required: [id, name, redirect_host, local]
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
              description: The name the client registered under, not verified; null when it registered none.
            redirect_host:
              type: string
              description: The host of the client's first registered redirect URI.
            local:
              type: boolean
              description: True when that redirect URI points at the computer the browser runs on.
        person:
          type: object
          additionalProperties: false
          required: [id, name, email]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the client first uses an access token.
        expires_at:
          type: string
          format: date-time
          description: When the connection ends and the person must approve it again.
    ConnectedAgentList:
      type: object
      additionalProperties: false
      required: [grants, next_cursor]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedAgent"
        next_cursor:
          type: string
          nullable: true
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role to set, or null to clear the chosen role and fall back to the computed one.
    OutboundDomain:
      type: object
      additionalProperties: false
      required: [domain, added_at, added_by]
      properties:
        domain:
          type: string
          description: A host name, or `*.` followed by a host name for its subdomains only, in lower case ASCII.
        added_at:
          type: string
          format: date-time
          nullable: true
          description: Null for an entry set by `SLASHOBSERVE_OUTBOUND_DOMAINS`.
        added_by:
          type: string
          nullable: true
          description: The name of the person who allowed the domain; null for an entry set by `SLASHOBSERVE_OUTBOUND_DOMAINS` and when that person was deleted.
    OutboundDomainList:
      type: object
      additionalProperties: false
      required: [managed_by, domains]
      properties:
        managed_by:
          type: string
          enum: [settings, config]
          description: "`config` when `SLASHOBSERVE_OUTBOUND_DOMAINS` is set; the list is then read-only."
        domains:
          type: array
          items:
            $ref: "#/components/schemas/OutboundDomain"
    Permissions:
      type: object
      additionalProperties: false
      required: [comment, edit, manage, create]
      description: What the caller may do with the object; being able to read it implies viewing.
      properties:
        comment:
          type: boolean
        edit:
          type: boolean
        manage:
          type: boolean
          description: Rename, change the permissions of and delete a folder.
        create:
          type: boolean
          description: Create, duplicate or import dashboards into the folder, or move dashboards into it (the Edit level).
    FolderLevel:
      type: string
      enum: [view, comment, edit, admin]
    Folder:
      type: object
      additionalProperties: false
      required: [id, title, general, personal, restricted, dashboard_count, grantees, grantee_count, created_by, permissions, level]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        general:
          type: boolean
          description: True for the General folder, which holds dashboards without a folder of their own and is never restricted, renamed or deleted.
        personal:
          type: boolean
          description: True for the caller's own My Dashboards folder, which only they see, Admins included. It is never restricted, renamed or shared, takes new dashboards but no moves, and lists first.
        restricted:
          type: boolean
          description: True when the folder lists people or groups; false means open to everyone by instance role.
        dashboard_count:
          type: integer
          description: All dashboards in the folder, including ones the caller cannot see when the caller manages it.
        grantees:
          type: array
          maxItems: 5
          description: The names of up to 5 listed people, then groups.
          items:
            type: string
        grantee_count:
          type: integer
          description: How many people and groups are listed.
        created_by:
          nullable: true
          description: Null for General and for folders made before creators were recorded. For a personal folder, its owner.
          allOf:
            - $ref: "#/components/schemas/Author"
        permissions:
          $ref: "#/components/schemas/Permissions"
        level:
          description: The caller's level on this folder and on every dashboard in it, the higher of what their role gives and their highest matching entry. Admins have `admin` on every folder except other people's personal folders, and a personal folder's owner has `edit`.
          allOf:
            - $ref: "#/components/schemas/FolderLevel"
    FolderPermissionEntry:
      type: object
      additionalProperties: false
      required: [kind, level]
      properties:
        kind:
          type: string
          enum: [user, group]
        user:
          type: object
          additionalProperties: false
          required: [id, name, email, role]
          description: Present when `kind` is `user`.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            role:
              $ref: "#/components/schemas/Role"
        group:
          type: string
          description: Present when `kind` is `group`.
        member_count:
          type: integer
          description: Present when `kind` is `group`; people who signed in with the group in their stored claims.
        level:
          $ref: "#/components/schemas/FolderLevel"
    FolderPermissions:
      type: object
      additionalProperties: false
      required: [restricted, entries]
      properties:
        restricted:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FolderPermissionEntry"
    SavedPrompt:
      type: object
      additionalProperties: false
      required: [id, name, body, shared, owner, can_edit, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique per owner and among shared prompts, ignoring case. Letters, numbers, spaces, `-` and `_`; it starts and ends with a letter or number, and runs of spaces are stored as one.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: The prompt text sent to the agent, trimmed; at most 4000 characters, the same limit as `POST /observe`.
        shared:
          type: boolean
          description: True when everyone on the server can see and run it; false when only its owner can.
        owner:
          $ref: "#/components/schemas/SavedPromptOwner"
        can_edit:
          type: boolean
          description: Whether the caller may change or delete it. The server decides; clients never recompute it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedPromptOwner:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The owner's display name, or their email when they have no name.
    SavedPromptList:
      type: object
      additionalProperties: false
      required: [prompts]
      properties:
        prompts:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SavedPrompt"
    Annotation:
      type: object
      additionalProperties: false
      required: [id, dashboard_id, panel_id, time_from, time_to, text, tags, created_by, created_by_name, actor, created_at]
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: Null for a global annotation, shown on every dashboard.
        panel_id:
          type: string
          nullable: true
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
          nullable: true
          description: The end of a range annotation; null for a single instant.
        text:
          type: string
          minLength: 1
          maxLength: 2000
        tags:
          type: array
          maxItems: 10
          items:
            type: string
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The id of the person or service account that added it.
        created_by_name:
          type: string
          nullable: true
          description: The name of the person or service account that added it; null when it is gone.
        actor:
          nullable: true
          description: Null when the person or service account is gone.
          allOf:
            - $ref: "#/components/schemas/Actor"
        created_at:
          type: string
          format: date-time
    AnnotationList:
      type: object
      additionalProperties: false
      required: [annotations, next_cursor]
      properties:
        annotations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Annotation"
        next_cursor:
          type: string
          nullable: true
    NewsItem:
      type: object
      additionalProperties: false
      required: [title, link, published, summary]
      properties:
        title:
          type: string
          maxLength: 300
          description: Plain text, never markup.
        link:
          type: string
          nullable: true
          maxLength: 2000
          description: An absolute http or https URL without user info, or null when the feed gave none or an unsafe one.
        published:
          type: string
          format: date-time
          nullable: true
        summary:
          type: string
          maxLength: 500
          description: Plain text, never markup; may be empty.
    ActionResult:
      type: object
      additionalProperties: false
      required: [status, ok]
      properties:
        status:
          type: integer
          description: The HTTP status the remote server answered with; a redirect is reported as its own 3xx status.
        ok:
          type: boolean
          description: True when the status is 2xx.
    ActionError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        host:
          type: string
          description: The domain the request was meant for, present on `outbound_domain_not_allowed` and `action_failed`.
    NewsFeed:
      type: object
      additionalProperties: false
      required: [title, items, fetched_at]
      properties:
        title:
          type: string
          maxLength: 200
        items:
          type: array
          maxItems: 50
          description: In feed order, at most 50.
          items:
            $ref: "#/components/schemas/NewsItem"
        fetched_at:
          type: string
          format: date-time
          description: When the server fetched the feed; a cached feed keeps the time of its fetch.
    DatasourceStatus:
      type: object
      additionalProperties: false
      required: [uid, type, name, healthy, checked_at, dashboard_count]
      properties:
        uid:
          type: string
        type:
          type: string
        name:
          type: string
        index:
          type: string
          description: The index pattern an Elasticsearch or OpenSearch datasource reads; absent on other types.
        time_field:
          type: string
          description: The time field of an Elasticsearch or OpenSearch datasource; absent on other types.
        healthy:
          type: boolean
        message:
          type: string
        checked_at:
          type: string
          format: date-time
          description: When the server last checked the datasource; checks are cached for 10 seconds.
        dashboard_count:
          type: integer
          minimum: 0
          description: Dashboards whose latest version uses this datasource.
    DatasourceList:
      type: object
      additionalProperties: false
      required: [datasources]
      properties:
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/DatasourceStatus"
    MetricName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
        help:
          type: string
          maxLength: 163
        unit:
          type: string
        table:
          type: string
    Author:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    Actor:
      type: object
      additionalProperties: false
      required: [kind, id, name, origin, client, run_id, label]
      description: Who made a change, as people see it. Display only, never used for access decisions.
      properties:
        kind:
          type: string
          enum: [user, service_account]
        id:
          type: string
          format: uuid
        name:
          type: string
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
        client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's display name, such as `Claude Code`, when `origin` is `mcp` and the client named itself; else null.
        run_id:
          type: string
          format: uuid
          nullable: true
          description: The agent request when the built-in agent made the change for this person or key; else null.
        label:
          type: string
          minLength: 1
          description: "The one display text: the name; `<name> (via <client>)` over MCP, `(via MCP)` when the client sent no name; `/observe for <name>` when the built-in agent acted."
    ActivityType:
      type: string
      enum: [dashboard.created, dashboard.version_created, dashboard.restored, dashboard.moved, dashboard.deleted, annotation.created, annotation.deleted, finding.created, finding.pinned, finding.moved, saved_search.created, saved_search.updated, saved_search.moved, saved_search.deleted, thread.opened, thread.replied, thread.edited, thread.resolved, thread.reopened, thread.mentioned, run.queued, run.started, run.succeeded, run.failed, run.canceled]
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [seq, type, target, dashboard_id, folder_id, actor, data, created_at]
      description: One entry of the activity log.
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: The event's id; `Last-Event-ID` of the stream takes it.
        type:
          $ref: "#/components/schemas/ActivityType"
        target:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [dashboard, annotation, finding, saved_search, thread, run]
            id:
              type: string
              format: uuid
              description: The id of the dashboard, annotation, finding, saved search, comment thread or agent request the event is about.
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard the event belongs to; it may no longer exist.
        folder_id:
          type: string
          format: uuid
          nullable: true
          description: The folder that decides who sees the event; null for an event with no folder, which only its actor and Admins see.
        actor:
          $ref: "#/components/schemas/Actor"
        data:
          type: object
          description: Ids, numbers, enums, titles and the version summary of the change, by type as `listActivity` lists; never body text.
        created_at:
          type: string
          format: date-time
    ActivityList:
      type: object
      additionalProperties: false
      required: [activity, next_cursor]
      properties:
        activity:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ActivityEvent"
        next_cursor:
          type: string
          nullable: true
    Creator:
      type: object
      additionalProperties: false
      required: [author, origin, origin_client, via, actor]
      description: Who made version 1 of the dashboard. It never changes.
      properties:
        author:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where version 1 came from; null for dashboards created before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's name when `origin` is `mcp`, else null.
        via:
          type: string
          enum: [direct, agent]
          description: "`agent` when the agent saved version 1; `author` is then the person or key that asked."
        actor:
          $ref: "#/components/schemas/Actor"
    DashboardFolder:
      type: object
      additionalProperties: false
      required: [id, title, general, personal]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        general:
          type: boolean
          description: True for the General folder.
        personal:
          type: boolean
          description: True when the dashboard is in a personal folder.
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [id, title, tags, latest_version, created_at, updated_at, updated_by, creator, folder, permissions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
        creator:
          $ref: "#/components/schemas/Creator"
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        permissions:
          $ref: "#/components/schemas/Permissions"
    DashboardListItem:
      type: object
      additionalProperties: false
      required: [id, title, description, tags, latest_version, created_at, updated_at, updated_by, creator, datasource_uids, open_comment_count, folder, permissions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
          description: The latest version's Spec description; null when it has none.
        tags:
          type: array
          items:
            type: string
        latest_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/Author"
        creator:
          $ref: "#/components/schemas/Creator"
        datasource_uids:
          type: array
          items:
            type: string
          description: The distinct datasource uids the latest version uses, sorted.
        open_comment_count:
          type: integer
          minimum: 0
          description: Open comment threads on the dashboard; replies are not counted.
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        permissions:
          $ref: "#/components/schemas/Permissions"
    VersionMeta:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at, origin, origin_client, agent_request_id, actor]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the save came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. A version saved by the agent records the origin of the request that asked for it. Null for versions saved before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        agent_request_id:
          type: string
          format: uuid
          nullable: true
          description: The agent request that saved this version; null for a version saved directly.
        actor:
          $ref: "#/components/schemas/Actor"
    Version:
      type: object
      additionalProperties: false
      required: [version, parent_version, restored_from, summary, author, created_at, origin, origin_client, agent_request_id, actor, spec, unverified]
      properties:
        version:
          type: integer
          minimum: 1
        parent_version:
          type: integer
          minimum: 1
          nullable: true
        restored_from:
          type: integer
          minimum: 1
          nullable: true
        summary:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the save came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. A version saved by the agent records the origin of the request that asked for it. Null for versions saved before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        agent_request_id:
          type: string
          format: uuid
          nullable: true
          description: The agent request that saved this version; null for a version saved directly.
        actor:
          $ref: "#/components/schemas/Actor"
        spec:
          type: object
          additionalProperties: true
          description: The ObserveSpec document, validated against its own schema.
        unverified:
          $ref: "#/components/schemas/Unverified"
    Unverified:
      type: object
      additionalProperties: false
      required: [panels, variables]
      description: >-
        Panels and variables of this version whose queries failed when it was saved but were kept:
        a Grafana import keeps every failing panel and variable, and a later save keeps one only while it stays unchanged
        (see `POST /dashboards/{id}/versions`).
      properties:
        panels:
          type: array
          items:
            $ref: "#/components/schemas/UnverifiedPanel"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/UnverifiedVariable"
    UnverifiedPanel:
      type: object
      additionalProperties: false
      required: [panel_id, issues]
      properties:
        panel_id:
          type: string
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Issue"
    UnverifiedVariable:
      type: object
      additionalProperties: false
      required: [name, issues]
      properties:
        name:
          type: string
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Issue"
    DashboardWithVersion:
      type: object
      additionalProperties: false
      required: [dashboard, version]
      properties:
        dashboard:
          $ref: "#/components/schemas/DashboardSummary"
        version:
          $ref: "#/components/schemas/Version"
    SpecChange:
      type: object
      additionalProperties: false
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, reorder]
        path:
          type: string
          description: JSON Pointer into the Spec document; the empty string is the whole document.
        from:
          nullable: true
          description: The previous JSON value at the path.
        to:
          nullable: true
          description: The new JSON value at the path.
    VersionConflict:
      type: object
      additionalProperties: false
      required: [error, code, latest_version]
      properties:
        error:
          type: string
        code:
          type: string
        latest_version:
          type: integer
          minimum: 1
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - parent_id
        - version
        - panel_id
        - body
        - status
        - author
        - actor
        - created_at
        - updated_at
        - edited_at
        - resolved_at
        - resolved_by
        - resolved_actor
        - resolved_by_version
        - panel_present
        - mentions
        - can_edit
        - revision
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The thread's first comment, for a reply; null for a thread's first comment.
        version:
          type: integer
          minimum: 1
        panel_id:
          type: string
          nullable: true
          description: The panel the thread is on; null for the whole dashboard. A reply has its thread's panel.
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
          description: For a reply, the status of its thread.
        author:
          $ref: "#/components/schemas/Author"
        actor:
          $ref: "#/components/schemas/Actor"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: When the body was last edited; null when it never was.
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Author"
        resolved_actor:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Actor"
          description: Who resolved the thread, with the one `label` to show; `/observe for <name>` when an agent run did. Null on a reply and on an open thread.
        resolved_by_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version that fixed the thread, when the resolver named one. Also set by the server when an agent request sent from the thread succeeds. Always null on a reply.
        panel_present:
          type: boolean
          description: Whether the latest version of the dashboard still has the panel the comment is anchored to. Always true for a whole-dashboard comment.
        mentions:
          type: array
          description: The people and agents the body mentions, in the order shown.
          items:
            $ref: "#/components/schemas/Mention"
        can_edit:
          type: boolean
          description: Whether the caller may edit this comment's body, which only its author may do and only while the caller can still comment.
        revision:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, status]
          description: The latest revision requested for this comment, or null when none was requested.
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, running, succeeded, failed]
    Mention:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind:
          type: string
          enum: [user, agent]
        id:
          type: string
          description: The user's id for a `user` mention, and `observe` for the built-in agent.
        name:
          type: string
          description: The name the mention showed when it was written.
    CommentEnvelope:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
    Thread:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - dashboard_id
        - version
        - panel_id
        - panel_present
        - status
        - created_at
        - updated_at
        - resolved_at
        - resolved_actor
        - resolved_by_version
        - revision
      properties:
        id:
          type: string
          format: uuid
          description: The thread's id, which is also the id of its first message.
        target:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [dashboard, finding, annotation]
            id:
              type: string
              format: uuid
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard the thread is on; null for a finding or annotation.
        version:
          type: integer
          minimum: 1
          nullable: true
          description: The dashboard version the thread is anchored to; null for a finding or annotation.
        panel_id:
          type: string
          nullable: true
          description: The panel the thread is on; null for the whole object.
        panel_present:
          type: boolean
          description: Whether the latest version of the dashboard still has the panel the thread is anchored to. Always true when there is no panel.
        status:
          type: string
          enum: [open, resolved]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_actor:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Actor"
          description: Who resolved the thread, `/observe for <name>` when an agent run did; null while it is open.
        resolved_by_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version that fixed the thread, when the resolver named one or the agent request sent from the thread succeeded.
        revision:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, status]
          description: The latest revision requested for this thread, or null when none was requested.
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, running, succeeded, failed]
    Message:
      type: object
      additionalProperties: false
      required: [id, thread_id, body, actor, created_at, updated_at, edited_at, mentions, can_edit]
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        body:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: When the body was last edited; null when it never was.
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        can_edit:
          type: boolean
          description: Whether the caller may edit this message, which only its author may do and only while the caller can still comment.
    ThreadPage:
      type: object
      additionalProperties: false
      required: [threads, messages, next_cursor, can_comment]
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/Thread"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          nullable: true
        can_comment:
          type: boolean
          description: Whether the caller may start threads and write messages on the target.
    ThreadEnvelope:
      type: object
      additionalProperties: false
      required: [thread]
      properties:
        thread:
          $ref: "#/components/schemas/Thread"
    ThreadMessageEnvelope:
      type: object
      additionalProperties: false
      required: [thread, message]
      properties:
        thread:
          $ref: "#/components/schemas/Thread"
        message:
          $ref: "#/components/schemas/Message"
    Field:
      type: object
      additionalProperties: false
      required: [name, type, values]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [time, number, string, bool, other]
        values:
          type: array
          description: >-
            Time fields hold epoch milliseconds as integers, number fields hold numbers with `null` for gaps,
            and `other` fields hold JSON exactly as the datasource adapter produced it.
          items:
            nullable: true
    Frame:
      type: object
      additionalProperties: false
      required: [ref, fields]
      properties:
        ref:
          type: string
          description: >-
            The ref of the panel query that produced this frame: its written ref, or A, B, C... by position.
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
    QueryMeta:
      type: object
      additionalProperties: false
      required: [ref, kind, step_ms]
      properties:
        ref:
          type: string
        kind:
          type: string
          enum: [range, instant]
        step_ms:
          type: integer
          minimum: 0
          description: The query's resolution; 0 for an instant query.
        exemplars:
          type: string
          enum: [ok, truncated, unavailable, unsupported]
          description: >-
            Present only when the query asked for exemplars (`exemplar: true` on a Prometheus range query, on the panel data and preview routes).
            `ok` has all of them, `truncated` has the 2,000 newest after thinning to one per step,
            `unavailable` means the exemplar call failed or timed out and the panel still succeeded,
            and `unsupported` means the datasource or the query kind has no exemplars.
    DataMeta:
      type: object
      additionalProperties: false
      required: [kind, from, to, step_ms, queries, cached, executed_at, truncated, partial, rows]
      properties:
        kind:
          type: string
          enum: [range, instant]
          description: range when any visible query runs as a range query, which also decides how from and to are aligned.
        from:
          type: string
          format: date-time
          description: The start of the aligned range the query ran over.
        to:
          type: string
          format: date-time
          description: The end of the aligned range the query ran over.
        step_ms:
          type: integer
          minimum: 0
          description: The panel's resolution; 0 for an instant panel.
        queries:
          type: array
          description: Every query that ran, in panel order; hidden queries do not run.
          items:
            $ref: "#/components/schemas/QueryMeta"
        cached:
          type: boolean
          description: True when the response was served from the proxy's response cache instead of running the query.
        executed_at:
          type: string
          format: date-time
          description: When the query ran upstream, which for a cached response is earlier than the request.
        source_panel:
          type: string
          description: The id of the panel whose queries ran, present only when the requested panel reuses another panel's results; the frames, queries and range are that panel's, and its transforms apply first when the reusing query sets withTransforms.
        truncated:
          type: boolean
          description: True when a query stopped at its row limit, so more rows exist in the range.
        partial:
          type: boolean
          description: True when a datasource answered without covering the whole range, such as Tempo searching only some of its blocks.
        rows:
          type: integer
          minimum: 0
          description: The rows across all frames (log lines, traces, spans, table rows); 0 for series data.
        rows_total:
          type: integer
          minimum: 0
          description: Present only when the datasource reports how many rows matched in the range.
        oldest:
          type: string
          format: date-time
          description: >-
            The smallest value of the first time field across all frames, RFC 3339 UTC with nanoseconds; absent when no frame has a time field or no rows.
            To load older rows, repeat the request with `to` set to it.
        newest:
          type: string
          format: date-time
          description: >-
            The largest value of the first time field across all frames, RFC 3339 UTC with nanoseconds; absent when no frame has a time field or no rows.
            To load newer rows, repeat the request with `from` set to it.
        jobs_done:
          type: integer
          minimum: 0
          description: Tempo search jobs completed for this response; present only on Tempo search results.
        jobs_total:
          type: integer
          minimum: 0
          description: Tempo search jobs planned for this response; when jobs_done is lower the result is partial and the window the finished jobs covered is unknown.
        inspected_bytes:
          type: integer
          minimum: 0
          description: Bytes Tempo read for the search; present only on Tempo search results.
        elapsed_ms:
          type: integer
          minimum: 0
          description: Wall time in milliseconds of the upstream run that produced the data; a cached response repeats the value of the run that filled the cache, like executed_at.
        bytes:
          type: integer
          minimum: 0
          description: Size in bytes of the upstream trace payload on a Tempo trace read; absent on ClickHouse and on explore.
        page:
          $ref: "#/components/schemas/PageMeta"
    PageMeta:
      type: object
      description: Present when the request paged; `meta.truncated` is then false and `page.total` replaces `rows_total`.
      additionalProperties: false
      required: [page, page_size, total_relation, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
          description: The page read; with a cursor, the page the cursor named.
        page_size:
          type: integer
          minimum: 50
          maximum: 500
        total:
          type: integer
          minimum: 0
          description: The rows that match, as `total_relation` qualifies it; absent when the relation is `unknown`.
        total_relation:
          type: string
          enum: [eq, gte, unknown]
          description: >-
            `eq` is exact (ClickHouse counts; Loki and Tempo on the last page), `gte` means at least this many (Loki and Tempo while more pages exist),
            and `unknown` means the store could not count, such as a partial Tempo search.
        has_next:
          type: boolean
        has_prev:
          type: boolean
          description: True on every page past the first.
        next:
          type: string
          maxLength: 2048
          description: The opaque cursor of the next page, present whenever `has_next` on Loki and Tempo; ClickHouse sends one too, and Elasticsearch and OpenSearch page by `page` and never send it.
        prev:
          type: string
          maxLength: 2048
          description: The cursor that produced this page, present when `page` is above 1; a client that walks back further keeps the chain of cursors it received.
        window:
          type: integer
          minimum: 1
          description: The largest row offset this store pages to, present only on stores with such a cap, such as an Elasticsearch index's `max_result_window`; a numbered page past it is refused.
    PanelDataError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        ref:
          type: string
          description: The query that failed, when one query's run failed.
    LogVolume:
      type: object
      additionalProperties: false
      required: [step_ms, total, buckets]
      properties:
        step_ms:
          type: integer
          description: The width of every bucket in milliseconds, a whole number of seconds and at least one.
        total:
          type: integer
          description: The sum of every count in every bucket.
        buckets:
          type: array
          description: Every bucket of the aligned range, oldest first, empty buckets included.
          items:
            $ref: "#/components/schemas/LogVolumeBucket"
    LogVolumeBucket:
      type: object
      additionalProperties: false
      required: [start, error, warning, info, other]
      properties:
        start:
          type: string
          format: date-time
          description: The bucket covers this instant up to, but not including, `start` plus `step_ms`.
        error:
          type: integer
        warning:
          type: integer
        info:
          type: integer
        other:
          type: integer
    LogFacets:
      type: object
      additionalProperties: false
      required: [sampled, lines_sampled, fields, truncated]
      properties:
        sampled:
          type: boolean
          description: Whether a sample of the newest lines was read for the fields the datasource cannot count exactly.
        lines_sampled:
          type: integer
          description: The lines the sample held, 0 when none was read.
        fields:
          type: array
          description: Exact fields first, then by cardinality ascending, then by name.
          items:
            type: object
            additionalProperties: false
            required: [name, kind, exact, values, truncated]
            properties:
              name:
                type: string
              kind:
                type: string
                enum: [label, field, metadata, column]
                description: A Loki index label, a Loki parsed field, a Loki structured-metadata field, or a ClickHouse column or `LogAttributes.<key>`.
              exact:
                type: boolean
                description: False when the counts come from the newest `lines_sampled` lines.
              unit:
                type: string
                description: Set to `bytes` on a Loki index label, because the index volume API counts bytes, not lines.
              cardinality:
                type: integer
                description: Distinct values seen, as `detected_fields` reports it on Loki or as the sample or the group showed; a truncated field reports at least `limit` plus one.
              values:
                type: array
                description: By count descending, then by value.
                items:
                  type: object
                  additionalProperties: false
                  required: [value, count]
                  properties:
                    value:
                      type: string
                    count:
                      type: integer
              truncated:
                type: boolean
                description: More values exist than `limit`.
        truncated:
          type: boolean
          description: More fields exist than the 50 returned.
    TraceStats:
      type: object
      additionalProperties: false
      required: [step_ms, partial, spans, errors, buckets, histogram]
      properties:
        step_ms:
          type: integer
          description: The width of every bucket in milliseconds, a whole number of seconds and at least one.
        partial:
          type: boolean
          description: True when Tempo did not search every block, so the counts are a lower bound; always false on ClickHouse.
        spans:
          type: integer
          description: The sum of every bucket's spans.
        errors:
          type: integer
          description: The sum of every bucket's errors.
        buckets:
          type: array
          description: Every bucket of the aligned range, oldest first, empty buckets included.
          items:
            $ref: "#/components/schemas/TraceStatsBucket"
        histogram:
          type: array
          description: The duration distribution of every matched span, ascending by `le_ms`, empty when nothing matched.
          items:
            $ref: "#/components/schemas/DurationBucket"
    TraceStatsBucket:
      type: object
      additionalProperties: false
      required: [start, spans, errors, p50_ms, p95_ms, p99_ms]
      properties:
        start:
          type: string
          format: date-time
          description: The bucket covers this instant up to, but not including, `start` plus `step_ms`.
        spans:
          type: integer
        errors:
          type: integer
        p50_ms:
          type: number
          nullable: true
          description: The median span duration in milliseconds, null when the bucket has no spans.
        p95_ms:
          type: number
          nullable: true
        p99_ms:
          type: number
          nullable: true
    DurationBucket:
      type: object
      additionalProperties: false
      required: [le_ms, count]
      properties:
        le_ms:
          type: number
          description: The upper edge of the bucket in milliseconds; the bucket holds the spans whose duration is at most this value and above the previous edge.
        count:
          type: integer
    TraceCompare:
      type: object
      additionalProperties: false
      required: [selected, baseline, attributes, partial, differences, truncated]
      properties:
        selected:
          $ref: "#/components/schemas/TraceCompareSet"
        baseline:
          $ref: "#/components/schemas/TraceCompareSet"
        attributes:
          type: integer
          description: The number of distinct attribute names seen across both sets.
        partial:
          type: boolean
          description: True when fewer traces were read than requested in either set, because a trace was not found in the range or the deadline cut the read.
        differences:
          type: array
          description: The attribute values whose shares differ by at least 0.1, ranked by the gap, then attribute, then value.
          items:
            $ref: "#/components/schemas/TraceDifference"
        truncated:
          type: boolean
          description: True when more pairs passed the threshold than `limit` allowed.
    TraceCompareSet:
      type: object
      additionalProperties: false
      required: [requested, read]
      properties:
        requested:
          type: integer
          description: The distinct trace ids sent.
        read:
          type: integer
          description: The traces whose spans were read.
    TraceDifference:
      type: object
      additionalProperties: false
      required: [attribute, value, selected_share, baseline_share, selected_count, baseline_count]
      properties:
        attribute:
          type: string
          description: "`name`, `kind`, `status`, `resource.<key>` or `span.<key>`."
        value:
          type: string
          description: The value as text, cut to 256 bytes.
        selected_share:
          type: number
          minimum: 0
          maximum: 1
          description: The share of read selected traces with a span carrying the pair, rounded to 4 decimals.
        baseline_share:
          type: number
          minimum: 0
          maximum: 1
          description: The share of read baseline traces with a span carrying the pair, rounded to 4 decimals.
        selected_count:
          type: integer
        baseline_count:
          type: integer
    LogContext:
      type: object
      additionalProperties: false
      required: [anchor, before, after]
      properties:
        anchor:
          type: string
          description: The `TimeNs` of the request.
        before:
          $ref: "#/components/schemas/LogContextSide"
        after:
          $ref: "#/components/schemas/LogContextSide"
    LogContextSide:
      type: object
      additionalProperties: false
      required: [frames, truncated]
      properties:
        frames:
          type: array
          description: The lines of this side in the panel data frame shape, every frame with `ref` `A` and a `TimeNs` string field beside `Time`.
          items:
            $ref: "#/components/schemas/Frame"
        truncated:
          type: boolean
          description: More lines exist in the window on this side than were asked for.
    LogPatterns:
      type: object
      additionalProperties: false
      required: [source, lines_sampled, lines_matched, patterns, truncated]
      properties:
        source:
          type: string
          enum: [loki, elasticsearch, server]
          description: "`loki` when Loki's pattern index answered, `elasticsearch` when the cluster's `categorize_text` aggregation answered, `server` when the patterns were computed from a sample of the newest lines."
        lines_sampled:
          type: integer
          description: The lines the server read to compute the patterns; 0 when the datasource's index answered.
        lines_matched:
          type: integer
          description: The sum of every pattern's count, before the `limit` cut.
        patterns:
          type: array
          description: The top patterns by count descending, then by pattern.
          items:
            $ref: "#/components/schemas/LogPattern"
        truncated:
          type: boolean
          description: More patterns exist than `limit`.
    LogPattern:
      type: object
      additionalProperties: false
      required: [pattern, count, sample, first, last, trend, level]
      properties:
        pattern:
          type: string
          description: The line template, with every variable token written `<*>`.
        count:
          type: integer
          description: The lines the pattern covers, over the range from Loki's index or within the sample.
        sample:
          type: string
          description: The newest sampled line of the pattern; empty when the index answered.
        first:
          type: string
          description: RFC 3339 time of the first sample bucket or oldest sampled line; empty when the time is unknown.
        last:
          type: string
          description: RFC 3339 time of the last sample bucket or newest sampled line; empty when the time is unknown.
        trend:
          type: array
          description: Exactly 30 buckets of equal width covering the range from `from` to `to`, the first starting at `from`; empty buckets are present with a `count` of 0.
          minItems: 30
          maxItems: 30
          items:
            $ref: "#/components/schemas/LogPatternTrendBucket"
        level:
          type: string
          enum: ["error", "warning", "info", "other", ""]
          description: On `loki` the first level word in the pattern, on `server` the level most of the pattern's sampled lines carry; empty when there is none.
    LogPatternTrendBucket:
      type: object
      additionalProperties: false
      required: [start, count]
      properties:
        start:
          type: string
          description: RFC 3339 start of the bucket.
        count:
          type: integer
          description: The lines of the pattern in the bucket.
    PanelData:
      type: object
      additionalProperties: false
      required: [frames, meta]
      properties:
        frames:
          type: array
          items:
            $ref: "#/components/schemas/Frame"
        exemplars:
          type: array
          description: >-
            Present only when at least one query asked for exemplars, and then possibly empty.
            Each frame is one series' exemplars, its `ref` naming the query and its `labels` the series labels;
            the fields are `Time` (epoch milliseconds), `Value`, then one string field per exemplar label key.
          items:
            $ref: "#/components/schemas/Frame"
        meta:
          $ref: "#/components/schemas/DataMeta"
    VariableValues:
      type: object
      additionalProperties: false
      required: [values, truncated, cached]
      properties:
        values:
          type: array
          items:
            type: string
          description: The values a selection may hold.
        texts:
          type: array
          items:
            type: string
          description: The display text of each value, same length and order as values; present only when some text differs from its value.
        truncated:
          type: boolean
        cached:
          type: boolean
          description: True when the list was served from the proxy's response cache instead of running the query.
    Diagnostic:
      type: object
      additionalProperties: false
      required: [severity, message, start, end]
      properties:
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        start:
          type: integer
          minimum: 0
          description: Byte offset of the first byte the diagnostic covers.
        end:
          type: integer
          minimum: 0
          description: Byte offset just past the last byte the diagnostic covers.
    LintResult:
      type: object
      additionalProperties: false
      required: [diagnostics]
      properties:
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
    Revision:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - source
        - comment_id
        - panel_id
        - prompt
        - base_version
        - status
        - attempts
        - result_version
        - error
        - failure_code
        - build
        - build_saved_at
        - continues_id
        - continued_by
        - continue_note
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe]
          description: "`observe` is the new-dashboard request that created the dashboard; it appears once it has succeeded."
        comment_id:
          type: string
          format: uuid
          nullable: true
          description: The comment that requested the revision; null for a prompt, or after the comment was deleted.
        panel_id:
          type: string
          nullable: true
          description: The panel the request is about (a comment's panel, or the panel a prompt was sent from); null for the whole dashboard.
        prompt:
          type: string
          description: The follow-up text, or the comment body.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the requester was looking at; null for the `observe` request that created the dashboard. The agent revises the latest version.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the revision saved, set when the status is `succeeded` unless the agent answered with a finding.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the revision failed, set when the status is `failed`.
        failure_code:
          type: string
          nullable: true
          description: Why the request failed, as one code (the codes of `AgentRequest.failure_code`), set when the status is `failed` and null otherwise. Clients must tolerate codes they do not know.
        build:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentBuildProgress"
          description: Progress of the build the agent assembles for this request, null when there is none.
        build_saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester saved the stopped build of a `failed` request as a version; null otherwise.
        continues_id:
          type: string
          format: uuid
          nullable: true
          description: The stopped request this one continues.
        continued_by:
          type: string
          format: uuid
          nullable: true
          description: The request that continues this one; its build moved there.
        continue_note:
          type: string
          nullable: true
          description: The note given when continuing a stopped request, null when none was given or this request continues nothing.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. Null for requests made before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    RevisionEnvelope:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
    SuggestionEnvelope:
      type: object
      additionalProperties: false
      required: [suggestion]
      properties:
        suggestion:
          $ref: "#/components/schemas/Suggestion"
    Suggestion:
      type: object
      additionalProperties: false
      required:
        - id
        - dashboard_id
        - panel_id
        - base_version
        - prompt
        - status
        - steps
        - panel
        - error
        - failure_code
        - usage
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        panel_id:
          type: string
          minLength: 1
          maxLength: 64
          description: The panel the agent was asked to change.
        base_version:
          type: integer
          minimum: 1
          description: The version the proposal is judged inside.
        prompt:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        steps:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/AgentStep"
        panel:
          type: object
          additionalProperties: true
          nullable: true
          description: The proposed panel, set only when the status is `succeeded`. It is not saved anywhere; the client decides whether to apply it.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the suggestion failed, set only when the status is `failed`.
        failure_code:
          type: string
          nullable: true
          description: "Why the suggestion failed, as one code, set when the status is `failed` and null otherwise. One of `run_timeout`, `call_timeout`, `rate_limited`, `provider_error`, `output_limit`, `no_tool_call`, `refused`, `validation_exhausted`, `conflict`, `invalid_task`, `not_found`, `draft_invalid`, `canceled`, `load_failed`, `context_failed`, `tool_failed`, `result_too_large`, `tool_panicked`, `malformed_result`, `internal`, `no_fixture`, `requester_gone`, `requester_forbidden`, `check_failed`, `crashed`, `no_suggestion`, `no_finding`, `lease_expired`, `no_progress` or `budget_exhausted`. Clients must tolerate codes they do not know."
        usage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUsage"
          description: Tokens, model calls and timings of the attempt that finished the suggestion. Null when no model call was attempted.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name`, only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    AgentInfo:
      type: object
      additionalProperties: false
      required: [available, provider, model, effort]
      properties:
        available:
          type: boolean
        provider:
          type: string
          nullable: true
          description: The configured LLM provider, null when no agent is configured.
        model:
          type: string
          nullable: true
          description: The model the agent uses, null when no agent is configured.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          nullable: true
          description: Reasoning effort of the Anthropic provider; null otherwise.
    AgentStep:
      type: object
      additionalProperties: false
      required: [at, attempt, phase, tool, status, message, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        attempt:
          type: integer
          minimum: 0
          description: >-
            The attempt that ran the step.
            A shutdown release gives the attempt back and keeps its steps, so the re-claimed run continues the same step list; an attempt keeps its most recent 1000 steps.
            Clients detect a restarted list by each step's `at`, not by `attempt` alone.
        phase:
          type: string
          enum: [discover, lint, query, save, repair]
        tool:
          type: string
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
          description: The tool's fixed progress text, for example `Listed 37 metrics on prom`.
        duration_ms:
          type: integer
          minimum: 0
    AgentUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - model_calls
        - repair_rounds
        - tool_calls
        - failed_calls
        - retries
        - model_ms
        - tool_ms
        - max_save_output_tokens
        - build_saves
        - renewals
        - compactions
        - nudges
        - save_now_refusals
        - stalled_turns
        - one_panel_refusals
        - cost_usd
      properties:
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        repair_rounds:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
          description: Tool calls the model made.
        failed_calls:
          type: integer
          minimum: 0
          description: Model calls that failed. The call that ended a failed run counts here, so a run that fails on its first call reports `model_calls` 0 and `failed_calls` 1.
        retries:
          type: integer
          minimum: 0
          description: Extra HTTP attempts made inside model calls after a retryable answer or an idle or first-token timeout, including the resend after an answer cut off at the output limit.
        model_ms:
          type: integer
          minimum: 0
          description: Wall-clock milliseconds spent waiting on the model, retries included.
        tool_ms:
          type: integer
          minimum: 0
          description: Wall-clock milliseconds spent running tools; tools of one turn that run in parallel count once.
        max_save_output_tokens:
          type: integer
          minimum: 0
          description: The largest output token count of any model turn that contained a save, or 0 when no turn did.
        build_saves:
          type: integer
          minimum: 0
          description: Accepted saves into the request's build during the run, counted across every session of the run.
        renewals:
          type: integer
          minimum: 0
          description: Compactions made because the session's history passed the renewal size after an accepted save; also counted in `compactions`.
        compactions:
          type: integer
          minimum: 0
          description: Times the run compacted its session history (on renewal, on the first cut-off answer, or when the model answered without a tool call while the build held fewer panels than planned).
        nudges:
          type: integer
          minimum: 0
          description: Steering messages sent one call before the save-now rule refuses reads.
        save_now_refusals:
          type: integer
          minimum: 0
          description: Read calls refused because six model calls passed without a save (or twelve without a proposal in a suggest run).
        stalled_turns:
          type: integer
          minimum: 0
          description: Turns in which the agent answered no call because every call was refused.
        one_panel_refusals:
          type: integer
          minimum: 0
          description: Saves refused for adding or changing more than one panel.
        cost_usd:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Estimated cost in USD of the attempt that finished the request, from its tokens and the server's price table (see SLASHOBSERVE_LLM_PRICES_FILE). Null when the model has no complete price, and for requests that finished before costs were recorded.
    AgentBuildProgress:
      type: object
      additionalProperties: false
      required: [saves, panels, planned_panels, title, updated_at]
      description: How far a request's build has come, without its Spec; the build title is for the requester only.
      properties:
        saves:
          type: integer
          minimum: 1
          description: Accepted build saves so far; a client refetches the build when it changes.
        panels:
          type: integer
          minimum: 0
          description: Panels in the build, row children included and rows themselves excluded.
        planned_panels:
          type: integer
          minimum: 0
          maximum: 200
          description: Panels the agent expects the finished dashboard to have, rows not counted; 0 when it gave no estimate. It is an estimate, so `panels` can exceed it.
        title:
          type: string
          nullable: true
          description: The build's current dashboard title; null for anyone but the principal that made the request, because a build is visible only to its requester.
        updated_at:
          type: string
          format: date-time
    AgentBuild:
      type: object
      additionalProperties: false
      required: [request_id, dashboard_id, base_version, saves, panels, planned_panels, spec, updated_at]
      properties:
        request_id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard being revised; null for a new-dashboard request.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the revision started from; null for a new-dashboard request.
        saves:
          type: integer
          minimum: 1
        panels:
          type: integer
          minimum: 0
        planned_panels:
          type: integer
          minimum: 0
          maximum: 200
          description: Panels the agent expects the finished dashboard to have, rows not counted; 0 when it gave no estimate. It is an estimate, so `panels` can exceed it.
        spec:
          type: object
          additionalProperties: true
          description: The ObserveSpec document as built so far, checked like a version.
        updated_at:
          type: string
          format: date-time
    AgentBuildSaved:
      type: object
      additionalProperties: false
      required: [dashboard_id, version, url, replayed]
      properties:
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        url:
          type: string
          description: The address of the dashboard, empty when the server has no public URL configured.
        replayed:
          type: boolean
          description: True when the request had already saved a version, so this call changed nothing.
    AgentRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - title
        - source
        - trigger
        - prompt
        - dashboard_id
        - base_version
        - panel_id
        - comment_id
        - status
        - attempts
        - result_version
        - url
        - error
        - failure_code
        - steps
        - usage
        - build
        - build_saved_at
        - queue_position
        - cancel_requested_at
        - canceled_by
        - can_cancel
        - continues_id
        - continue_note
        - continued_by
        - requested_by
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
        - pinned_at
        - archived_at
        - from
        - to
        - finding
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [build, investigate]
          description: "`investigate` for an investigation that ends with a finding, `build` for every other request, including one that answered a question with a finding."
        title:
          type: string
          description: The title the requester gave the request, or the start of its prompt when they gave none.
        source:
          type: string
          enum: [comment, prompt, observe, investigate]
        trigger:
          type: string
          enum: [person, mention, schedule, webhook, slack]
          description: "What started the run. `person`: the requester asked, through the web app, the CLI or the API; every run is started this way in this release. The other values are reserved for runs that a mention, a schedule, an inbound webhook or Slack will start. Clients must tolerate values they do not know."
        prompt:
          type: string
        dashboard_id:
          type: string
          format: uuid
          nullable: true
          description: The dashboard the request targets; for a new-dashboard request it is null until the request has succeeded.
        base_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version a revision was requested against; null for a new-dashboard request.
        panel_id:
          type: string
          nullable: true
        comment_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
          maximum: 2
        result_version:
          type: integer
          minimum: 1
          nullable: true
          description: The version the request saved, set when the status is `succeeded` unless the agent answered with a finding and, once the requester saved a stopped build, when it is `failed`.
        url:
          type: string
          nullable: true
          description: The address of the dashboard, or of the finding for an investigation or a request that answered a question, set when the status is `succeeded`.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the request failed, set when the status is `failed`.
        failure_code:
          type: string
          nullable: true
          description: "Why the request failed, as one code, set when the status is `failed` and null otherwise. One of `run_timeout`, `call_timeout`, `rate_limited`, `provider_error`, `output_limit`, `no_tool_call`, `refused`, `validation_exhausted`, `conflict`, `invalid_task`, `not_found`, `draft_invalid`, `canceled`, `load_failed`, `context_failed`, `tool_failed`, `result_too_large`, `tool_panicked`, `malformed_result`, `internal`, `no_fixture`, `requester_gone`, `requester_forbidden`, `check_failed`, `crashed`, `no_suggestion`, `no_finding`, `lease_expired`, `no_progress` or `budget_exhausted`. Clients must tolerate codes they do not know."
        steps:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/AgentStep"
        usage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUsage"
          description: Tokens, model calls, repair rounds and timings of the attempt that finished the request. Null when no model call was attempted.
        build:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentBuildProgress"
          description: Progress of the build the agent assembles for this request, null when there is none. Shown to everyone who can see the request; the build's Spec is readable only by the requester through `GET /observe/{id}/build`.
        build_saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester saved the stopped build of a `failed` request as a version; null otherwise. The request stays `failed` with its `failure_code`.
        queue_position:
          type: integer
          minimum: 1
          nullable: true
          description: 1-based place among queued requests in claim order, null unless queued. The worker skips a request whose dashboard already has a running revision, so the order can shift.
        cancel_requested_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester asked to cancel the request; null when they did not. A running request keeps running until its worker sees the flag, then ends `failed` with the `canceled` failure code and keeps its build.
        canceled_by:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Author"
          description: Who asked to cancel the request; the email is never set.
        can_cancel:
          type: boolean
          description: Whether the caller may cancel this request now. Only the requester may, while it is queued or running.
        continues_id:
          type: string
          format: uuid
          nullable: true
          description: The stopped request this one continues.
        continue_note:
          type: string
          nullable: true
          description: The note given when continuing a stopped request, null when none was given or this request continues nothing.
        continued_by:
          type: string
          format: uuid
          nullable: true
          description: The request that continues this one; its build moved there.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from; `web` is a signed-in browser, `cli` the observe CLI, `mcp` an MCP client, `api` any other bearer-key caller. Null for requests made before origins were recorded. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name` (for example `claude-code`), only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        pinned_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester pinned the request; null when it is not pinned.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester archived the request; an archived request is left out of `GET /observe`.
        from:
          type: string
          format: date-time
          nullable: true
          description: The start of the window an investigation was asked to look at; null when none was given.
        to:
          type: string
          format: date-time
          nullable: true
          description: The end of the window an investigation was asked to look at; null when none was given.
        finding:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Finding"
          description: "The finding the run saved: an investigation's, or the answer a request gave instead of a dashboard or a version; null for other runs and until one is saved."
    RequestSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - title
        - pinned_at
        - source
        - trigger
        - prompt
        - status
        - dashboard_id
        - dashboard_title
        - panel_id
        - result_version
        - url
        - error
        - failure_code
        - build
        - build_saved_at
        - continues_id
        - continued_by
        - continue_note
        - origin
        - origin_client
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [comment, prompt, observe, investigate]
        trigger:
          type: string
          enum: [person, mention, schedule, webhook, slack]
          description: "What started the run. `person`: the requester asked, through the web app, the CLI or the API; every run is started this way in this release. The other values are reserved for runs that a mention, a schedule, an inbound webhook or Slack will start. Clients must tolerate values they do not know."
        prompt:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        dashboard_id:
          type: string
          format: uuid
          nullable: true
        dashboard_title:
          type: string
          nullable: true
          description: The dashboard's current title; null when the request has no dashboard or the dashboard is in a folder you cannot see.
        panel_id:
          type: string
          nullable: true
        result_version:
          type: integer
          minimum: 1
          nullable: true
        url:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
          maxLength: 500
        failure_code:
          type: string
          nullable: true
          description: Why the request failed, as one code (the codes of `AgentRequest.failure_code`), set when the status is `failed` and null otherwise. Clients must tolerate codes they do not know.
        build:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentBuildProgress"
          description: Progress of the build the agent assembles for this request, null when there is none.
        build_saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester saved the stopped build of a `failed` request as a version; null otherwise.
        kind:
          type: string
          enum: [build, investigate]
        title:
          type: string
          description: The title the requester gave the request, or the start of its prompt when they gave none.
        pinned_at:
          type: string
          format: date-time
          nullable: true
          description: When the requester pinned the request; pinned requests come first in the list.
        continues_id:
          type: string
          format: uuid
          nullable: true
          description: The stopped request this one continues.
        continued_by:
          type: string
          format: uuid
          nullable: true
          description: The request that continues this one; its build moved there.
        continue_note:
          type: string
          nullable: true
          description: The note given when continuing a stopped request, null when none was given or this request continues nothing.
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
        origin_client:
          type: string
          nullable: true
          maxLength: 64
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    ContinueObserveRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          nullable: true
          maxLength: 4000
          description: An instruction for the continued run, trimmed; 1 to 4000 characters without control or bidirectional override characters, the same rule as a prompt.
    AgentRequestEnvelope:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/AgentRequest"
    FindingAuthor:
      type: object
      additionalProperties: false
      required: [kind, id, name]
