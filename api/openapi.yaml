          type: object
          additionalProperties: true
          nullable: true
          description: The proposed panel, set only when the status is `succeeded`. It is not saved anywhere; the client decides whether to apply it.
        error:
          type: string
          nullable: true
          maxLength: 500
          description: Why the suggestion failed, set only when the status is `failed`.
        requested_by:
          $ref: "#/components/schemas/Author"
        origin:
          type: string
          enum: [web, cli, mcp, api]
          nullable: true
          description: Where the request came from. A label only, never used for access decisions.
        origin_client:
          type: string
          nullable: true
          maxLength: 64
          description: The MCP client's self-reported `clientInfo.name`, only when `origin` is `mcp`; unverified.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
    AgentInfo:
      type: object
      additionalProperties: false
      required: [available, provider, model, effort]
      properties:
        available:
          type: boolean
        provider:
          type: string
          nullable: true
          description: The configured LLM provider, null when no agent is configured.
        model:
          type: string
          nullable: true
          description: The model the agent uses, null when no agent is configured.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          nullable: true
          description: Reasoning effort of the Anthropic provider; null otherwise.
    AgentStep:
      type: object
      additionalProperties: false
      required: [at, attempt, phase, tool, status, message, duration_ms]
      properties:
        at:
          type: string
          format: date-time
        attempt:
          type: integer
          minimum: 0
          description: >-
            The attempt that ran the step.
            A shutdown release gives the attempt back and deletes its steps, so the re-claimed run reuses the same attempt number with a fresh step list.
            Clients detect a restarted list by each step's `at`, not by `attempt` alone.
        phase:
          type: string
          enum: [discover, lint, query, save, repair]
        tool:
          type: string
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
          description: The tool's fixed progress text, for example `Listed 37 metrics on prom`.
        duration_ms:
          type: integer
          minimum: 0
    AgentUsage:
      type: object
      additionalProperties: false
      required:
        - provider
