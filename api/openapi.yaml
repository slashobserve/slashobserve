          default: now
        folder_id:
          type: string
          format: uuid
          description: The folder to save in, which needs Create. Default the caller's My Dashboards, else General.
    UpdateSavedSearchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
        folder_id:
          type: string
          format: uuid
    FindingList:
      type: object
      additionalProperties: false
      required: [findings, next_cursor]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        next_cursor:
          type: string
          nullable: true
    ImportRequest:
      type: object
      additionalProperties: false
      required: [json]
      properties:
        json:
          type: string
          minLength: 1
          description: The Grafana dashboard JSON text, exactly as pasted or uploaded.
        mapping:
          type: object
          nullable: true
          maxProperties: 50
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
          description: Source datasource key to our datasource uid; keys and values are 1 to 200 bytes.
        folder:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The title of the folder for the new dashboard, trimmed and checked like a folder title; 400 `invalid_request` otherwise.
            Only the import uses it; the preview checks it and ignores it.
    ImportSummary:
      type: object
      additionalProperties: false
      required: [format, title, uid, schema_version, bytes, panels, rows, variables]
      properties:
        format:
          type: string
          enum: [classic, export, api]
        title:
          type: string
        uid:
          type: string
        schema_version:
          type: integer
          minimum: 0
        bytes:
          type: integer
          minimum: 0
        panels:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        variables:
          type: integer
          minimum: 0
    ImportSourceDatasource:
      type: object
      additionalProperties: false
      required: [key, name, type, kind, panels, match, matched_by, candidates]
      properties:
        key:
          type: string
          description: How the dashboard refers to the datasource (a uid, a name or an `${DS_...}` input).
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          description: The Grafana datasource type.
        kind:
          type: string
          nullable: true
          description: Our datasource type it needs (`prometheus`, `clickhouse`, `loki` or `tempo`); null for a built-in datasource. A kind with no configured datasource has no candidates, does not block the import, and its panels import as placeholders.
        panels:
          type: integer
          minimum: 0
        match:
          type: string
          nullable: true
          description: The uid of our datasource it will use; null while unmatched.
        matched_by:
          type: string
          enum: [mapping, uid, alias, only]
          nullable: true
        candidates:
          type: array
          items:
            type: string
          description: The uids of ours of the same kind.
    ImportQueryLine:
      type: object
      additionalProperties: false
      required: [ref_id, ref, datasource, rewrites, dropped]
      properties:
        ref_id:
          type: string
        ref:
          type: string
          nullable: true
        datasource:
          type: string
          nullable: true
        rewrites:
          type: array
          items:
            type: string
        dropped:
          type: string
          nullable: true
    ImportPanelLine:
      type: object
      additionalProperties: false
      required: [panel_id, grafana_id, grafana_path, title, type, source_type, row, status, reasons, paths, queries]
      properties:
        panel_id:
          type: string
        grafana_id:
          type: integer
          nullable: true
        grafana_path:
          type: string
        title:
          type: string
        type:
          type: string
        source_type:
          type: string
        row:
          type: string
          nullable: true
        status:
          type: string
          enum: [imported, partial, placeholder, unverified]
        reasons:
          type: array
          items:
            type: string
        paths:
          type: array
          items:
            type: string
        queries:
          type: array
          items:
            $ref: "#/components/schemas/ImportQueryLine"
    ImportNote:
      type: object
      additionalProperties: false
      required: [subject, status, reason, paths]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [imported, partial, placeholder, unverified]
        reason:
          type: string
        paths:
          type: array
          items:
            type: string
    ImportCounts:
      type: object
      additionalProperties: false
      required: [total, imported, partial, placeholder, unverified]
      properties:
        total:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        partial:
          type: integer
          minimum: 0
        placeholder:
          type: integer
          minimum: 0
        unverified:
          type: integer
          minimum: 0
    ImportOptionLine:
      type: object
      additionalProperties: false
      required: [path, outcome, spec, reason]
      properties:
        path:
          type: string
          description: The Grafana option path relative to its block, in report syntax.
        outcome:
          type: string
          enum: [mapped, excluded, reported, default, no_effect, bookkeeping]
          description: "`default`, `no_effect` and `bookkeeping` are implicit options: a Grafana default value, an option with no visible effect, and editor bookkeeping; they need no Spec setting."
        spec:
          type: array
          items:
            type: string
          description: The ObserveSpec fields the option became, relative to the block's Spec object, array indexes written `[]`; empty when the option was not imported, is implicit, or no catalog names its field.
        reason:
          type: string
          nullable: true
          description: Why the option was excluded or not imported; null for every other outcome.
    ImportBlock:
      type: object
      additionalProperties: false
      required: [kind, path, title, source_type, panel_id, outcome, reason, options, implicit, omitted, blocks]
      properties:
        kind:
          type: string
          enum: [dashboard, variable, row, panel, query, transformation, field_config, override]
        path:
          type: string
          description: The Grafana path of the block from the dashboard root; empty for the dashboard.
        title:
          type: string
          description: The panel or row title, variable name, query ref id, transformation id or override matcher id; empty for the dashboard and field config.
        source_type:
          type: string
          description: The Grafana panel or variable type, or the query kind; empty otherwise.
        panel_id:
          type: string
          nullable: true
          description: The id of the Spec panel, for panel and row blocks; it matches `panels[].panel_id`.
        outcome:
          type: string
          enum: [excluded, reported]
          nullable: true
          description: Set when the whole block was not imported.
        reason:
          type: string
          nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/ImportOptionLine"
        implicit:
          type: integer
          minimum: 0
          description: How many implicit options the block carried (outcomes `default`, `no_effect` and `bookkeeping`), including any the size limits left out of `options`.
        omitted:
          type: integer
          minimum: 0
          description: Options of any outcome not listed because of the report's size limits.
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ImportBlock"
          description: Child blocks.
    ImportReport:
      type: object
      additionalProperties: false
      required: [importer_version, verified, counts, panels, notes]
      properties:
        importer_version:
          type: integer
          minimum: 1
        verified:
          type: boolean
          description: True once every query ran at save time; always false in a preview.
        counts:
          $ref: "#/components/schemas/ImportCounts"
        panels:
          type: array
          items:
            $ref: "#/components/schemas/ImportPanelLine"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ImportNote"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ImportBlock"
          description: The report grouped by dashboard block. Absent in reports stored before importer version 2.
    ImportPreview:
      type: object
      additionalProperties: false
      required: [summary, datasources, ready, report, spec]
      properties:
        summary:
          $ref: "#/components/schemas/ImportSummary"
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceDatasource"
        ready:
          type: boolean
          description: True when every source datasource has a match, so the import can be saved.
        report:
          $ref: "#/components/schemas/ImportReport"
        spec:
          type: object
          additionalProperties: true
          nullable: true
          description: The converted ObserveSpec document; null when `ready` is false.
    ImportRecord:
      type: object
      additionalProperties: false
      required: [id, dashboard_id, version, source, importer_version, title, mapping, summary, datasources, report, created_by, actor, created_at]
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: The dashboard version the import produced.
        source:
          type: string
          enum: [grafana]
        importer_version:
          type: integer
          minimum: 1
        title:
          type: string
        mapping:
          type: object
          additionalProperties:
            type: string
        summary:
          $ref: "#/components/schemas/ImportSummary"
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceDatasource"
        report:
          $ref: "#/components/schemas/ImportReport"
        grafana_uid:
          type: string
          description: >-
            The Grafana dashboard uid this import answers for, or empty.
            Only the first import of a uid holds it, and only a uid of 1 to 40 letters, digits, `-` or `_`;
            a later import of the same uid, from a file or a connection, gets an empty value.
        created_by:
          $ref: "#/components/schemas/Author"
        actor:
          $ref: "#/components/schemas/Actor"
        created_at:
          type: string
          format: date-time
    ImportMeta:
      type: object
      additionalProperties: false
      required: [id, dashboard_id, version, importer_version, title, counts, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        importer_version:
          type: integer
          minimum: 1
        title:
          type: string
        counts:
          $ref: "#/components/schemas/ImportCounts"
        created_by:
          $ref: "#/components/schemas/Author"
        created_at:
          type: string
          format: date-time
    ImportList:
      type: object
      additionalProperties: false
      required: [imports, next_cursor]
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/ImportMeta"
        next_cursor:
          type: string
          nullable: true
    ImportedDashboard:
      type: object
      additionalProperties: false
      required: [dashboard, version, import, folder_note]
      properties:
        dashboard:
          $ref: "#/components/schemas/DashboardSummary"
        version:
          $ref: "#/components/schemas/Version"
        import:
          $ref: "#/components/schemas/ImportRecord"
        folder_note:
          type: string
          nullable: true
          description: Why the dashboard is not in the requested folder, or null when it is where the request or the source asked.
    DatasourcesUnresolved:
      type: object
      additionalProperties: false
      required: [error, code, datasources]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [datasources_unresolved]
        datasources:
          type: array
          items:
            $ref: "#/components/schemas/ImportSourceDatasource"
    ProvisionStatus:
      type: object
      additionalProperties: false
      required: [dir, dashboards, errors]
      properties:
        dir:
          type: string
          nullable: true
          description: The value of `SLASHOBSERVE_PROVISION_DIR`, or null when provisioning is off.
        dashboards:
          type: array
          description: Files that became a dashboard, including files that have since left the directory, because their dashboards stay.
          items:
            type: object
            additionalProperties: false
            required: [path, dashboard_id, folder, updated_at, last_error]
            properties:
              path:
                type: string
              dashboard_id:
                type: string
                format: uuid
              folder:
                type: string
                description: The title of the folder the file was first provisioned into.
              updated_at:
                type: string
                format: date-time
                description: When the file's content was last saved as a version.
              last_error:
                type: string
                nullable: true
                description: Why the file's current content could not be saved; the dashboard keeps its last saved version. Null when the last save of the file worked.
        errors:
          type: array
          description: Files in the directory that never became a dashboard.
          items:
            type: object
            additionalProperties: false
            required: [path, message, seen_at]
            properties:
              path:
                type: string
              message:
                type: string
              seen_at:
                type: string
                format: date-time
    GrafanaConnectionTest:
      type: object
      additionalProperties: false
      required: [at, ok, message]
      properties:
        at:
          type: string
          format: date-time
        ok:
          type: boolean
        message:
          type: string
          description: A fixed sentence chosen by the outcome, such as the folder and dashboard counts or why Grafana could not be read.
    GrafanaImportSummary:
      type: object
      additionalProperties: false
      required: [id, status, total, done, failed, skipped, error, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, finished, failed, canceled]
          description: "`failed` means the run could not list Grafana's dashboards; one failing dashboard only counts in `failed`."
        total:
          type: integer
          description: The dashboards chosen, known once the dashboards are listed; 0 until then.
        done:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
          description: Dashboards imported before whose Grafana version is not newer.
        error:
          type: string
          nullable: true
          description: Why the run failed; null unless `status` is `failed`.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    GrafanaImportResult:
      type: object
      additionalProperties: false
      required: [uid, title, outcome, dashboard_id, unverified_panels, placeholder_panels, error]
      properties:
        uid:
          type: string
          description: The Grafana dashboard uid.
        title:
          type: string
        outcome:
          type: string
          enum: [imported, updated, skipped, failed]
        dashboard_id:
          type: string
          format: uuid
          nullable: true
        unverified_panels:
          type: integer
        placeholder_panels:
          type: integer
        error:
          type: string
          nullable: true
          description: A fixed sentence chosen by the kind of failure; null unless `outcome` is `failed`.
    GrafanaImport:
      type: object
      additionalProperties: false
      required: [id, connection_id, status, total, done, failed, skipped, error, started_at, finished_at, results]
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, finished, failed, canceled]
        total:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        error:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        results:
          type: array
          description: One entry per dashboard handled so far, in the order they finished.
          items:
            $ref: "#/components/schemas/GrafanaImportResult"
    GrafanaConnection:
      type: object
      additionalProperties: false
      required: [id, name, url, created_by, created_at, updated_at, last_test, last_sync]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          description: The Grafana base URL as stored, without a trailing slash.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The id of the person or service account that stored the connection.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_test:
          nullable: true
          description: Null until the connection is tested, and again after its URL or token changes.
          allOf:
            - $ref: "#/components/schemas/GrafanaConnectionTest"
        last_sync:
          nullable: true
          description: The summary of the last finished import, or null before the first one.
          allOf:
            - $ref: "#/components/schemas/GrafanaImportSummary"
    Webhook:
      type: object
      additionalProperties: false
      required: [id, name, url, event_types, owner, enabled, disabled_reason, disabled_at, consecutive_failures, next_attempt_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 2048
          description: The https address events are posted to.
        event_types:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/ActivityType"
        owner:
          $ref: "#/components/schemas/Actor"
        enabled:
          type: boolean
        disabled_reason:
          type: string
          nullable: true
          enum: [manual, gone, failing, owner, secret_unreadable]
          description: "`manual` an Admin disabled it; `gone` the receiver answered 410; `failing` 50 attempts in a row failed; `owner` the owner is gone or no longer an Admin; `secret_unreadable` `SLASHOBSERVE_SECRET_KEY` is unset or changed."
        disabled_at:
          type: string
          format: date-time
          nullable: true
        consecutive_failures:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
          description: The earliest time of the next attempt; in the past while the webhook has nothing to send.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookList:
      type: object
      additionalProperties: false
      required: [webhooks]
      properties:
        webhooks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Webhook"
    WebhookWithSecret:
      type: object
      additionalProperties: false
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: The signing secret, `whsec_` and 43 characters. It is shown only in this response.
    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [name, url, event_types]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: An https address on port 443 with a domain name, no user info and no fragment.
        event_types:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ActivityType"
    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ActivityType"
        enabled:
          type: boolean
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, delivery_id, event_type, activity_seq, attempted_at, duration_ms, status_code, outcome, error_code]
      properties:
        id:
          type: string
          description: The attempt's id, ordered by time.
        delivery_id:
          type: string
          description: The `X-SlashObserve-Delivery` header of the attempt; the same for every attempt at one event.
        event_type:
          type: string
          description: The event's activity type, or `webhook.test`.
        activity_seq:
          type: integer
          format: int64
          nullable: true
          description: The `seq` of the activity event; null for a test.
        attempted_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        status_code:
          type: integer
          nullable: true
          description: The receiver's HTTP status; null when it was not reached.
        outcome:
          type: string
          enum: [delivered, failed, skipped]
        error_code:
          type: string
          nullable: true
          enum: [status, unreachable, blocked_address, domain_not_allowed, too_large]
          description: Null when delivered. `too_large` is `skipped`, because the event can never fit the 64 KiB request limit.
    WebhookTestResult:
      type: object
      additionalProperties: false
      required: [delivery]
      properties:
        delivery:
          $ref: "#/components/schemas/WebhookDelivery"
    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [deliveries, next_cursor]
      properties:
        deliveries:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string
          nullable: true
    GrafanaConnectionList:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/GrafanaConnection"
    CreateGrafanaConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, url, token]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: The Grafana base URL, http or https, with a domain name and no user info, query or fragment.
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: A Grafana service-account token with Viewer access to the folders to import.
    UpdateGrafanaConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: A new URL needs `token` in the same request.
        token:
          type: string
          minLength: 1
          maxLength: 4096
    StartGrafanaImportRequest:
      type: object
      additionalProperties: false
      required: [folders]
      properties:
        folders:
          description: '"all", or the Grafana folder uids to import, each with its subfolders; `general` names the dashboards outside any folder.'
          oneOf:
            - type: string
              enum: [all]
            - type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
                maxLength: 64
        mapping:
          type: object
          maxProperties: 200
          description: Grafana datasource uid or name to the uid of a datasource here, for the datasources the automatic match leaves open.
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
    GrafanaFolder:
      type: object
      additionalProperties: false
      required: [uid, title, dashboards]
      properties:
        uid:
          type: string
        title:
          type: string
        dashboards:
          type: integer
    GrafanaDatasource:
      type: object
      additionalProperties: false
      required: [uid, name, type, kind, candidates, matched_uid]
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
          description: The Grafana plugin id, such as `prometheus`.
        kind:
          type: string
          nullable: true
          description: Our datasource type the importer maps it to (`prometheus`, `clickhouse`, `loki` or `tempo`); null when SlashObserve does not query this type, and its panels import as placeholders. A kind with no configured datasource has no candidates, and its panels also import as placeholders.
        candidates:
          type: array
          items:
            type: string
          description: The uids of our datasources of that kind, the only valid mapping targets.
        matched_uid:
          type: string
          nullable: true
    RepairList:
      type: object
      additionalProperties: false
      required: [dashboards, next_cursor]
      properties:
        dashboards:
          type: array
          items:
            $ref: "#/components/schemas/RepairItem"
        next_cursor:
          type: string
          nullable: true
    RepairItem:
      type: object
      additionalProperties: false
      required: [id, title, url, folder, unverified_panels, unverified_variables, placeholder_panels, last_import_at, repair]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          description: The dashboard's address in the web app.
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        unverified_panels:
          type: integer
          minimum: 0
        unverified_variables:
          type: integer
          minimum: 0
        placeholder_panels:
          type: integer
          minimum: 0
          description: Placeholder panels, top level or inside rows; people replace them, the agent does not.
        last_import_at:
          type: string
          format: date-time
          nullable: true
          description: When the version the dashboard's import record points at was saved; null for a dashboard that was not imported, such as a duplicate of one.
        repair:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RepairStatus"
    RepairStatus:
      type: object
      additionalProperties: false
      required: [id, status, finished_at]
      properties:
        id:
          type: string
          format: uuid
          description: The agent request id.
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        finished_at:
          type: string
          format: date-time
          nullable: true
    RequestRepairsRequest:
      type: object
      additionalProperties: false
      properties:
        dashboard_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        all:
          type: boolean
          enum: [true]
        folder_id:
          type: string
          format: uuid
          description: Only with `all`.
    RepairsQueued:
      type: object
      additionalProperties: false
      required: [queued, skipped]
      properties:
        queued:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dashboard_id, request_id]
            properties:
              dashboard_id:
                type: string
                format: uuid
              request_id:
                type: string
                format: uuid
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dashboard_id, reason]
            properties:
              dashboard_id:
                type: string
                format: uuid
              reason:
                type: string
                enum: [active, nothing_to_repair, not_found, forbidden_role, queue_full]
    GrafanaResolved:
      type: object
      additionalProperties: false
      required: [dashboard_id, url]
      properties:
        dashboard_id:
          type: string
          format: uuid
        url:
          type: string
          description: The web app path of the dashboard.
    PublicLinkSelections:
      type: object
      description: Variable selections by variable name; `$__all` selects All.
      additionalProperties:
        type: array
        maxItems: 100
        items:
          type: string
    PublicLink:
      type: object
      additionalProperties: false
      required: [id, prefix, variables, selections, expires_at, created_by, created_at, last_viewed_at, expired, usable]
      properties:
        id:
          type: string
          format: uuid
        prefix:
          type: string
          description: The first 12 characters of the token, to tell links apart; the token itself is never shown again.
        variables:
          type: string
          enum: [frozen, free]
        selections:
          $ref: "#/components/schemas/PublicLinkSelections"
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: object
          additionalProperties: false
          required: [kind, id, name]
          properties:
            kind:
              type: string
              enum: [user, service_account]
            id:
              type: string
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time
        last_viewed_at:
          type: string
          format: date-time
          nullable: true
          description: When the link was last opened, recorded at most once a minute.
        expired:
          type: boolean
        usable:
          type: boolean
          description: False when the link is expired or the dashboard's latest version reads the viewer's identity.
    CreatePublicLinkRequest:
      type: object
      additionalProperties: false
      required: [variables]
      properties:
        variables:
          type: string
          enum: [frozen, free]
        selections:
          $ref: "#/components/schemas/PublicLinkSelections"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the link stops working; null or absent for no expiry.
    CreatedPublicLink:
      type: object
      additionalProperties: false
      required: [link, token, url]
      properties:
        link:
          $ref: "#/components/schemas/PublicLink"
        token:
          type: string
          description: "`pub_` plus 43 base64url characters, returned only in this response."
        url:
          type: string
          description: The address that opens the link, `<SLASHOBSERVE_PUBLIC_URL>/p/<token>`.
    PublicDashboard:
      type: object
      additionalProperties: false
      required: [dashboard_id, title, version, spec, variables, selections, expires_at, datasources]
      properties:
        dashboard_id:
          type: string
          format: uuid
        title:
          type: string
        version:
          type: integer
          minimum: 1
        spec:
          type: object
          additionalProperties: true
          description: The latest version's ObserveSpec without query text.
        variables:
          type: string
          enum: [frozen, free]
        selections:
          $ref: "#/components/schemas/PublicLinkSelections"
        expires_at:
          type: string
          format: date-time
          nullable: true
        datasources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [uid, type]
            properties:
              uid:
                type: string
              type:
                type: string
    HealthProblemKind:
      type: string
      enum: [no_data, query_failed, variable_failed, duplicate_title, unopened]
    HealthProblem:
      type: object
      additionalProperties: false
      required: [kind, panel_id, panel_title, variable, code, message]
      properties:
        kind:
          $ref: "#/components/schemas/HealthProblemKind"
        panel_id:
          type: string
          nullable: true
          description: The panel the problem is in, or null for a variable or a dashboard-wide problem.
        panel_title:
          type: string
          nullable: true
        variable:
          type: string
          nullable: true
          description: The variable that resolves to nothing, for `variable_failed`.
        code:
          type: string
          nullable: true
          description: The check's issue code, such as `query_empty`, or `check_failed` when the check itself could not run; null for `duplicate_title` and `unopened`.
        message:
          type: string
          nullable: true
    HealthItem:
      type: object
      additionalProperties: false
      required: [id, title, url, folder, can_edit, checked_version, checked_at, last_viewed_at, skipped, problems, repair]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          description: The dashboard's address in the web app.
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        can_edit:
          type: boolean
          description: Whether the caller may edit the dashboard, and so ask for a repair.
        checked_version:
          type: integer
          nullable: true
          description: The version the last health check ran on; null before the first check.
        checked_at:
          type: string
          format: date-time
          nullable: true
        last_viewed_at:
          type: string
          format: date-time
          nullable: true
          description: The latest time anyone opened the dashboard; null when nobody did since opens are recorded.
        skipped:
          type: string
          nullable: true
          enum: [depends_on_viewer]
          description: Why the last check ran no query.
        problems:
          type: array
          items:
            $ref: "#/components/schemas/HealthProblem"
        repair:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthRepair"
          description: The dashboard's latest health repair, whatever its age; null when it never had one.
    HealthRepair:
      type: object
      additionalProperties: false
      required: [state, request_id, version, error, updated_at]
      properties:
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        request_id:
          type: string
          format: uuid
          description: The revision request of the repair.
        version:
          type: integer
          nullable: true
          description: The version a succeeded repair saved; null in any other state.
        error:
          type: string
          nullable: true
          description: The failure sentence of a failed repair; null in any other state.
        updated_at:
          type: string
          format: date-time
          description: When the repair finished, else when it started, else when it was queued.
    HealthJob:
      type: object
      additionalProperties: false
      required: [last_started_at, last_finished_at, last_outcome, running]
      properties:
        last_started_at:
          type: string
          format: date-time
          nullable: true
        last_finished_at:
          type: string
          format: date-time
          nullable: true
        last_outcome:
          type: string
          nullable: true
          enum: [succeeded, failed, interrupted]
        running:
          type: boolean
    HealthList:
      type: object
      additionalProperties: false
      required: [dashboards, next_cursor, summary, job]
      properties:
        dashboards:
          type: array
          items:
            $ref: "#/components/schemas/HealthItem"
        next_cursor:
          type: string
          nullable: true
        summary:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HealthSummary"
          description: Counts over every dashboard in the visible folders, narrowed by `folder_id` and never by `kind`; set on the first page and null when `cursor` is sent.
        job:
          $ref: "#/components/schemas/HealthJob"
    HealthSummary:
      type: object
      additionalProperties: false
      required: [dashboards, failing, query_failed, variable_failed, no_data, duplicate_titles, unopened]
      description: Each count is of dashboards, not problems.
      properties:
        dashboards:
          type: integer
          description: Dashboards with any problem.
        failing:
          type: integer
          description: Dashboards with a `query_failed` or `variable_failed` problem.
        query_failed:
          type: integer
        variable_failed:
          type: integer
        no_data:
          type: integer
        duplicate_titles:
          type: integer
          description: Dashboards with a `duplicate_title` problem.
        unopened:
          type: integer
    ApplyResult:
      type: object
      additionalProperties: false
      required: [path, outcome, dashboard_id, version]
      properties:
        path:
          type: string
        outcome:
          type: string
          enum: [created, updated, unchanged]
        dashboard_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: The version saved, or the latest version when nothing changed.
    AppliedList:
      type: object
      additionalProperties: false
      required: [applied]
      properties:
        applied:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, dashboard_id]
            properties:
              path:
                type: string
              dashboard_id:
                type: string
                format: uuid
    DraftQueryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        from:
          type: string
          maxLength: 128
        to:
          type: string
          maxLength: 128
        signal:
          type: string
          enum: [logs, traces]
    DraftQuery:
      type: object
      additionalProperties: false
      required: [query, language, trace_filters, explanation, warnings]
      properties:
        query:
          type: string
          description: LogQL, ClickHouse SQL, TraceQL or KQL (or a `lucene:` or Query DSL body); empty when `language` is `filters`.
        language:
          type: string
          enum: [logql, clickhouse_sql, traceql, kql, filters]
        trace_filters:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TraceFilters"
          description: The Traces form's fields; null unless `language` is `filters`.
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
    TraceFilters:
      type: object
      additionalProperties: false
      description: Each field is present only when set.
      properties:
        service:
          type: string
          maxLength: 200
        span:
          type: string
          maxLength: 200
        min:
          type: string
          description: A duration such as `250ms`.
        max:
          type: string
          description: A duration such as `2s`.
        errors:
          type: boolean
    CannotTranslate:
      type: object
      additionalProperties: false
      required: [error, code, reason]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [cannot_translate]
        reason:
          type: string
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is not allowed to perform the request; a role that is too low is code `forbidden_role`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ThreadRefused:
      description: >-
        The request is well formed but refused: `invalid_target`, `invalid_body` (empty, too long or with refused characters), `too_many_mentions`, `invalid_panel_id`, `invalid_version` (`version` is out of range or below the version the thread is on), `unknown_panel` (the panel is not in that version's Spec) or `unknown_version` (the version does not exist on the dashboard).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The server failed to handle the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidSpec:
      description: The Spec fails validation or one of its queries fails; every problem is listed in `issues`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    VersionConflict:
      description: The parent version is no longer the latest; `latest_version` names the current one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionConflict"
    TooManyRequests:
      description: The caller already has the maximum number of query requests in flight, or the server's shared upstream call slots stayed busy for 5 seconds.
      headers:
        Retry-After:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryUnprocessable:
      description: The query or its variables cannot run, or its result exceeds a limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryBadGateway:
      description: The datasource is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueryTimeout:
      description: The datasource did not answer within the query timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
