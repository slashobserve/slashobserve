          maxLength: 200
        span:
          type: string
          maxLength: 200
        min:
          type: string
          description: The shortest duration, such as `250ms` or `2s`.
        max:
          type: string
          description: The longest duration, such as `250ms` or `2s`.
        errors:
          type: boolean
          description: Only traces with an error.
    SavedSearch:
      type: object
      additionalProperties: false
      required: [id, kind, title, datasource_uid, query, filters, from, to, folder, permissions, actor, created_at, updated_at, url]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [logs, traces]
        title:
          type: string
          minLength: 1
          maxLength: 120
        datasource_uid:
          type: string
        query:
          type: string
          nullable: true
          minLength: 1
          maxLength: 8000
          description: The query as it runs, with the filter pills folded in; null for a trace search made of filters only.
        filters:
          $ref: "#/components/schemas/SavedSearchFilters"
        from:
          type: string
          description: The start of the range as written, such as `now-1h`.
        to:
          type: string
          description: The end of the range as written, such as `now`.
        folder:
          $ref: "#/components/schemas/DashboardFolder"
        permissions:
          $ref: "#/components/schemas/Permissions"
        actor:
          $ref: "#/components/schemas/Actor"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the search was saved, renamed or moved last.
        url:
          type: string
          description: The address of the logs or traces page that reopens the search, relative when the server has no public URL configured.
    SavedSearchList:
