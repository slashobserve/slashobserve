datasources-uid-trace-compare:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: compareTraces
    summary: Rank the attribute values that set a set of traces apart from a baseline.
    description: >-
      Reads every span of the `selected` traces and of the `baseline` traces from a Tempo or ClickHouse datasource and counts, once per trace, each attribute value any of its spans carries:
      `name` (the span name), `kind` (`Server`, `Client`, `Producer`, `Consumer`, `Internal` or `Unspecified`), `status` (`Ok`, `Error` or `Unset`), `resource.<key>` and `span.<key>`.
      Only scalar values count, as their text; arrays and maps are skipped, and a value is cut to 256 bytes.
      Each trace contributes its earliest 2,000 spans.
      `differences` lists the pairs whose share of selected traces and share of baseline traces differ by at least 0.1, ranked by that gap, then attribute, then value, the first `limit` of them; `truncated` says more passed the threshold.
      A pair carried by every trace of both sets never appears.
      `selected.read` and `baseline.read` count the traces whose spans were read; a trace not found in the range, or not reached before the deadline, is left out and is not an error, and `partial` is true when any read count is below its requested count.
      `attributes` is the number of distinct attribute names seen across both sets.
      Trace ids are 16 or 32 hex characters in either case, lowercased and de-duplicated by the server; an id in both lists is refused.
      `from` and `to` are the range the traces were found in and take relative expressions such as `now-1h`, epoch milliseconds or RFC 3339 times.
      The call runs with the agent tools' 15 second timeout, is never cached, and counts against the caller's 8 in-flight query requests.
      Viewers and above may call it, service-account keys included.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [selected, baseline, from, to]
            properties:
              selected:
                type: array
                minItems: 1
                maxItems: 50
                description: The trace ids to explain.
                items:
                  type: string
                  pattern: "^[0-9a-fA-F]{16}$|^[0-9a-fA-F]{32}$"
              baseline:
                type: array
                minItems: 1
                maxItems: 150
                description: The trace ids to compare against, such as the other traces the search returned.
                items:
                  type: string
                  pattern: "^[0-9a-fA-F]{16}$|^[0-9a-fA-F]{32}$"
              from:
                type: string
                minLength: 1
                maxLength: 128
              to:
                type: string
                minLength: 1
                maxLength: 128
              timezone:
                type: string
                minLength: 1
                maxLength: 64
                description: The browser's IANA time zone, used to resolve relative times such as `now/d`.
              limit:
                type: integer
                minimum: 1
                maximum: 100
                default: 20
                description: The most differences wanted.
    responses:
      "200":
        description: The ranked differences and how many traces of each set were read.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/TraceCompare"
      "400":
        description: >-
          The request is malformed or fails validation: a list is empty or over its cap, an id is not 16 or 32 hex characters, an id is in both lists, `limit` is out of range, `from` or `to` is not a valid time, or the datasource is not Tempo or ClickHouse (`invalid_request`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        description: The datasource does not exist (`not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request, including a datasource call that failed without a classified cause.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: The datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: The datasource did not answer within the 15 second query timeout before any trace was read, or the request did not finish within 20 seconds.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
