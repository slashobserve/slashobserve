agent:
  get:
    operationId: getAgent
    summary: Tell whether an agent is configured and which provider and model it uses.
    description: >-
      Clients check this before offering the chat composer.
      Without a configured LLM provider `available` is false and `provider` and `model` are null.
    responses:
      "200":
        description: The agent configuration.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentInfo"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe:
  get:
    operationId: listObserveRequests
    summary: List the caller's own agent requests, newest first.
    description: >-
      Only requests the caller made are listed; a user sees their own and a service account its own.
      `source` narrows the list to new-dashboard requests (`observe`), follow-up prompts (`prompt`) or comment revisions (`comment`).
      A new-dashboard request that failed has no dashboard and lives only in this list.
      Progress steps are not included; read `GET /observe/{id}` for them.
    parameters:
      - name: source
        in: query
        schema:
          type: string
          enum: [observe, prompt, comment]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of the caller's requests.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requests, next_cursor]
              properties:
                requests:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/RequestSummary"
                next_cursor:
                  type: string
                  nullable: true
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: createObserveRequest
    summary: Ask the agent to build a new dashboard, or to revise an existing one with a follow-up prompt.
    description: >-
      The request is queued and answers 202 at once; poll `GET /observe/{id}` until the status is `succeeded` or `failed`.
      Without `dashboard_id` the agent builds a new dashboard (`source` is `observe`); the finished request carries the new `dashboard_id` and `url`.
      With `dashboard_id` the agent revises that dashboard (`source` is `prompt`), exactly like `POST /dashboards/{id}/revisions`; `base_version` defaults to the dashboard's latest version.
      The prompt is trimmed first, and the limit of 1 to 4000 characters applies to the trimmed text.
      Control characters other than newline, carriage return and tab, and the bidirectional override and isolate characters (U+202A to U+202E and U+2066 to U+2069), are refused.
      A caller may have at most 3 new-dashboard requests queued or running (429 `too_many_requests`), the instance at most 20 (429 `agent_busy`), and a dashboard at most 5 revisions (429 `too_many_revisions`).
      Without a configured LLM provider the endpoint answers 503 `agent_unavailable`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt:
                type: string
              dashboard_id:
                type: string
                format: uuid
                description: The dashboard to revise; omit to build a new dashboard.
              base_version:
                type: integer
                minimum: 1
                maximum: 2147483647
                description: A version that exists on the dashboard; only allowed together with `dashboard_id`.
    responses:
      "202":
        description: The queued agent request.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "429":
        description: Too many agent requests are queued or running (`too_many_requests` for the caller, `agent_busy` for the instance, `too_many_revisions` for the dashboard).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: No LLM provider is configured (`agent_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
observe-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getObserveRequest
    summary: Read one agent request with its progress steps and usage.
    description: >-
      Works for any agent request, including comment and prompt revisions.
      A request that has no dashboard yet, or never got one, is readable only by the principal that made it; anyone else gets 404.
      Clients poll it once a second until the status is `succeeded` or `failed`.
      After a shutdown release the re-claimed run reuses its attempt number with a fresh step list, so a client detects a restarted list by each step's `at`, not by `attempt` alone.
    responses:
      "200":
        description: The agent request with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
