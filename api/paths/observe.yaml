agent:
  get:
    operationId: getAgent
    x-audit: { none: "read; only dashboard, observation and public link views are recorded" }
    x-surfaces:
      cli: [observe doctor]
    summary: Tell whether an agent is configured and which provider and model it uses.
    description: >-
      Clients check this before offering the chat composer.
      Without a configured LLM provider `available` is false and `provider` and `model` are null.
    responses:
      "200":
        description: The agent configuration.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentInfo"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe:
  get:
    operationId: listObserveRequests
    x-audit: { none: "list read; recorded as run.list with its scope by the service, once per caller and scope in 10 minutes" }
    x-surfaces:
      mcp: [list_runs]
      cli: [observe requests list]
    summary: "List agent requests, newest first: the caller's own, or everyone's for an Admin."
    description: >-
      With `scope=mine`, the default, only requests the caller made are listed; a user sees their own and a service account its own.
      `scope=all` lists every principal's requests and needs the Admin role; anyone else gets 403.
      `q` matches the title and the prompt case-insensitively, `pinned` keeps only pinned or only unpinned requests, `dashboard_id` keeps the requests about one dashboard, `observation_id` keeps the requests asked about one observation and the ones that wrote into it, and `chat_id` keeps the turns of one chat, the first request included.
      `anchored=true` keeps only the requests that point at a spot, as the `anchor` of each shows, and only works with `scope=mine`: with `scope=all` it answers 400 `invalid_request`, so no one lists other people's anchored questions.
      `anchor` and `block_id` are filled only for the person who asked the question and are null for everyone else, an Admin included.
      `state` keeps the requests in any of the given states and may repeat.
      Archived requests are left out; with `scope=mine` pinned requests come first, most recently pinned first, and with `scope=all` the order is newest first only.
      `dashboard_title` is null when the caller cannot see the dashboard, and an Admin's `allowed_actions` is empty on a request it sees only as an Admin.
      A new-dashboard request that failed has no dashboard and lives only in this list.
      Progress steps are not included; read `GET /observe/{id}` for them.
      Every list is recorded in the audit trail as one `run.list` with `scope` (`mine` or `all`) in its data, never one event per request, once per caller and scope in 10 minutes.
    parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum: [mine, all]
          default: mine
      - name: state
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum: [queued, running, canceling, succeeded, failed, canceled]
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: pinned
        in: query
        schema:
          type: boolean
      - name: dashboard_id
        in: query
        schema:
          type: string
          format: uuid
      - name: observation_id
        in: query
        schema:
          type: string
          format: uuid
      - name: anchored
        in: query
        schema:
          type: boolean
      - name: chat_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of the caller's requests.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requests, next_cursor, summary]
              properties:
                requests:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/RequestSummary"
                next_cursor:
                  type: string
                  nullable: true
                summary:
                  type: object
                  nullable: true
                  additionalProperties: false
                  required: [total, people]
                  description: How many requests match the filters across every page, and how many people started them. Present on the first page only; null when a cursor is given.
                  properties:
                    total:
                      type: integer
                      minimum: 0
                    people:
                      type: integer
                      minimum: 0
                      nullable: true
                      description: The distinct requesters among the matches; null unless scope is all.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: createObserveRequest
    x-audit: { action: run.queue, target: { kind: run } }
    x-surfaces:
      mcp: [start_run]
      cli: [observe, observe investigate, observe run]
    summary: Ask the agent a question, have it build a new dashboard, revise an existing one, or investigate.
    description: >-
      The request is queued and answers 202 at once; poll `GET /observe/{id}` until the status is `succeeded` or `failed`.
      `kind` says what the request may do: `ask`, the default, reads and answers; `revise` changes the dashboard named by `dashboard_id`; `investigate` reads data into an observation.
      An `ask` without `dashboard_id` and `observation_id` builds a new dashboard (`intent` is `ask` until it saves one, then `apply`); the finished request carries the new `dashboard_id` and `url`.
      When the prompt only asks a question, such as which logs exist, the agent may answer with a finding instead: the request succeeds with `finding` set and `dashboard_id`, `result_version` and `observation_id` null, and `kind` stays `build`.
      That answer makes no observation: it stays on the request, read by the requester and Admins, until the requester saves it with `POST /observe/{id}/observation`.
      With `kind` `revise` and `dashboard_id` the agent revises that dashboard (`intent` is `apply`), exactly like `POST /dashboards/{id}/revisions`; `base_version` defaults to the dashboard's latest version.
      With `kind` `revise`, `applies_finding_id` in place of `prompt` applies an answer's suggested change: the finding must be the answer of a request you can read about `dashboard_id` (404 `not_found` otherwise, 400 `invalid_request` when it is about another dashboard, was answered in another chat than `chat_id` or suggests no change), and its `suggested_change` becomes the prompt, so sending both answers 400 `invalid_request`.
      While a request applying that finding is queued or running, or after it succeeded, another one answers 200 with `replayed` true and that request when it is yours, and 409 `already_applied` when it is someone else's.
      A revision whose prompt only asks a question may also end with a finding: the request succeeds with `finding` set, keeps its `dashboard_id`, and `result_version` stays null; it too makes no observation until its requester saves it.
      Every request you start here is a turn of a chat, which you and Admins can read and nobody else sees.
      With `chat_id` the request is the next turn of that chat of yours (404 `not_found` when it is someone else's, archived or unknown, and 403 `chat_read_only` for an Admin who can read it, because only its owner asks in it), and the chat must be about the same dashboard or observation as the request, or about none on both sides (400 `invalid_request`).
      Without `chat_id` a new chat starts under the request's own id, except a `revise`, which joins your most recent live chat on that dashboard when there is one; `new_chat` true always starts a new chat and excludes `chat_id` (400 `invalid_request`).
      The agent is given the earlier questions and answers of the chat (the last six turns, at most 8000 characters), read when the turn starts running, and the turns of one chat run one at a time in the order they were sent; a queued turn with a stop requested does not hold the next one back.
      `client_id` is a UUID the client picks once per message so a resend starts nothing new: a second request of yours with the same `client_id` answers 200 with `replayed` true and the request the first one started, and one with another prompt or another `chat_id` answers 422 `client_id_reused`.
      `anchor` points the turn at one spot on the dashboard or observation it is about, and needs `dashboard_id` or `observation_id`; `block_id` names a block of `observation_id` the turn is about, needs `observation_id`, and must be a block of that observation (404 `not_found`); with `anchor` it is the block the anchor sits on, under an anchor of a kind that can sit on a block, which `variable` cannot (400 `invalid_request`), and without it the turn is about the whole block.
      When a build in a chat about nothing saves a new dashboard, the chat becomes about that dashboard.
      With `kind` `investigate` the agent reads data and ends by saving a finding (`kind` is `investigate` on the request), optionally about `dashboard_id`, one of its panels (`panel_id`) and a window (`from` and `to`); starting one needs the Editor role or above and view access on the dashboard (403 `forbidden_role`).
      A caller may have at most 3 investigations queued or running (429 `too_many_requests`), and the instance at most 10 (429 `agent_busy`).
      Every investigation gets an observation when it is queued, the one named by `observation_id` or a new one, and the request carries its id as `observation_id`, which is null for a reader who cannot open that observation; a new observation goes in the dashboard's folder when you can edit it, else in your own folder, and without any folder to write in the run has no observation and `observation_id` is null. An investigation with no observation to write into, because no folder could take a new one or the named one is full, says so in its first step, and its answer stays on the request.
      A named `observation_id` must be visible to you (404 `not_found`) and allow at least commenting on it (403 `forbidden_role`).
      An `ask` with `dashboard_id` or `observation_id`, one of them, is a private ask about it: the agent reads data and answers with a finding, but writes nothing shared, so no observation is opened or written, no version is saved and the investigation caps do not apply.
      A private ask needs Comment on what it is about (403 `forbidden_role`), and its request and answer are read only by you and, read only, by Admins, until you share the answer into a comment thread, whose readers then read both, read only.
      `kind` must be `ask`, `revise` or `investigate`, `revise` needs `dashboard_id` and takes no `panel_id`, `from`, `to` or `observation_id`, `base_version` needs `revise`, `from` and `to` on an `ask` need `dashboard_id` or `observation_id`, `panel_id` needs `dashboard_id`, and `from` and `to` go together, must be relative times or epoch milliseconds, `from` must be before `to`, and the range may be at most 400 days; each broken rule answers 400 `invalid_request`.
      `time_zone` names the IANA time zone the person reads times in, such as `Asia/Kolkata`: the agent writes every time in its answer in that zone with the zone's label, a retry or continue keeps it, and without it, or with `UTC`, times are written in UTC; an unknown zone answers 400 `invalid_request`.
      `as_of` sets the run's now, as epoch milliseconds or an RFC 3339 time, for replaying an incident that is over: every relative time the run resolves, such as `now-1h` in `from`, `to` or a query the agent runs, resolves to it, the agent is told that time, and the request and its finding carry it as `as_of`; it needs the Admin role (403 `forbidden_role`), a relative time, a time in the future, a `to` later than it, or a `kind` that builds or revises a dashboard answers 400 `invalid_request`, it is for `investigate` and for an `ask` with `dashboard_id` or `observation_id`, and a retry or continue keeps it, for an Admin only (403 `forbidden_role`), while a later turn of a chat passes `as_of` again.
      The prompt is trimmed first, and the limit of 1 to 4000 characters applies to the trimmed text.
      Control characters other than newline, carriage return and tab, and the bidirectional override and isolate characters (U+202A to U+202E and U+2066 to U+2069), are refused, and so is text with no visible character, such as only zero-width characters (400 or 422 with a `reason`, see `docs/reference/text-rules.md`).
      A caller may have at most 3 new-dashboard requests queued or running (429 `too_many_requests`), the instance at most 20 (429 `agent_busy`), and a dashboard at most 5 revisions (429 `too_many_revisions`).
      Without a configured LLM provider the endpoint answers 503 `agent_unavailable` for a request the built-in agent took.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              prompt:
                type: string
                description: What to ask or change; required unless `applies_finding_id` is set.
              dashboard_id:
                type: string
                format: uuid
                description: The dashboard to revise with `kind` `revise`, or to ask or investigate about.
              applies_finding_id:
                type: string
                format: uuid
                description: With `kind` `revise`, the answer whose `suggested_change` is the prompt; excludes `prompt`.
              base_version:
                type: integer
                minimum: 1
                maximum: 2147483647
                description: A version that exists on the dashboard; only allowed with `kind` `revise`.
              kind:
                type: string
                enum: [ask, revise, investigate]
                default: ask
              panel_id:
                type: string
                minLength: 1
                maxLength: 64
                description: The panel an investigation is about; needs `dashboard_id`.
              from:
                type: string
                description: The start of the window an investigation looks at, a relative time like `now-1h` or epoch milliseconds.
              to:
                type: string
                description: The end of the window an investigation looks at, a relative time like `now` or epoch milliseconds.
              chat_id:
                type: string
                format: uuid
                description: The chat of yours this request is the next turn of; without it a new chat starts, or a `revise` joins your latest chat on that dashboard.
              new_chat:
                type: boolean
                description: Start a new chat even when a `revise` would join your latest chat on that dashboard; not with `chat_id`.
              observation_id:
                type: string
                format: uuid
                description: The observation a private ask is about, or the one an investigation writes into; without it an investigation makes a new observation in the dashboard's folder, or in your own folder when you cannot edit that one.
              time_zone:
                type: string
                maxLength: 64
                description: The IANA time zone the person reads times in, such as `Asia/Kolkata`; the answer gives times in it, labelled. Without it times are UTC.
              as_of:
                type: string
                maxLength: 64
                description: The run's now, as epoch milliseconds or an RFC 3339 time in the past; relative times in the run resolve to it. Admin only; for an investigation or an ask about a dashboard or observation, not a build or a revise.
              client_id:
                type: string
                format: uuid
                description: A UUID the client picks once per message; resending it returns the request it started instead of queueing another.
              anchor:
                $ref: "../openapi.yaml#/components/schemas/Anchor"
              block_id:
                type: string
                format: uuid
                description: The block of `observation_id` the turn is about; with `anchor`, the block the anchor sits on, without it the whole block.
    responses:
      "200":
        description: The `client_id` was already sent with this prompt, or a request of yours already applies `applies_finding_id`; that request, with `replayed` true.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "202":
        description: The queued agent request.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          Someone else's request already applies `applies_finding_id` (`already_applied`).
          Or the request that wrote that answer read data only Admins can query, such as the audit trail, and `dashboard_id` is not in a folder only Admins can read (`restricted_answer`, saying why).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: The prompt breaks a text rule (with a `reason`), or the `client_id` was already sent with another prompt or chat (`client_id_reused`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "429":
        description: Too many agent requests are queued or running (`too_many_requests` for the caller, `agent_busy` for the instance, `too_many_revisions` for the dashboard).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: No LLM provider is configured (`agent_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
observe-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getObserveRequest
    x-audit: { action: run.view, target: { kind: run, id: path.id } }
    x-surfaces:
      cli: [observe status]
      mcp: [get_run]
    summary: Read one agent request with its progress steps and usage.
    description: >-
      Works for any agent request, including comment and prompt revisions.
      A request with no shared product, neither a dashboard nor an observation, is readable only by the principal that made it and by Admins; anyone else gets 404.
      So is a request that read data only Admins can query (`restricted`), wherever it writes.
      A request on a dashboard, an investigation included, is readable by anyone who can see that dashboard, and a request on an observation with no dashboard, a thread ask included, by anyone who can read that observation.
      A private ask is readable only by its requester and Admins, and while its answer is shared into a comment thread also by everyone who can read that thread.
      An Admin also reads a request on a dashboard it cannot see.
      `read_only` is true when the caller reads the request only as an Admin or as a reader of the thread its answer is shared in: `allowed_actions` is then empty and every write route answers as it does today.
      Clients poll it once a second until the status is `succeeded` or `failed`.
      Every read of a request, its requester's included, is recorded as `run.view` with the owner's id as `owner_id`, once per reader and request in 10 minutes across this route, its build, `get_run`, a dashboard revision, a suggestion and an unsaved answer under `GET /findings/{id}`; a refused read is recorded every time.
      After a shutdown release the re-claimed run reuses its attempt number and keeps the steps already recorded, so a client detects a restarted run by each step's `at`, not by `attempt` alone.
      `build` reports the progress of the dashboard the agent is assembling for the request, without its Spec, to everyone who can see the request; it is null when there is no build.
      A `failed` request keeps its build for 7 days after it finished; `build_saved_at` is set once the requester saved it as a version.
      `state` and `result_kind` say where the request is and what it left behind, and `allowed_actions` lists what the caller may do with it now; the tables are in `docs/reference/states.md`.
    responses:
      "200":
        description: The agent request with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  patch:
    operationId: updateObserveRequest
    x-audit: { action: run.update, target: { kind: run, id: path.id } }
    x-surfaces:
      mcp: [pin_run, unpin_run, rename_run]
      cli: [observe requests pin, observe requests unpin, observe requests rename, observe chats pin, observe chats unpin]
    summary: Rename or pin one of your agent requests.
    description: >-
      Only the principal that made the request may change it (403 `forbidden`); a request hidden from the caller answers 404.
      A `title` string is trimmed and must be 1 to 120 characters on one line; `null` clears it back to the default taken from the prompt.
      `pinned` true pins the request to the top of `GET /observe`, false unpins it.
      Renaming the first request of a chat with no dashboard also renames the one observation made from that chat when the caller may edit it, and `observation_rename` says which happened.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              title:
                type: string
                nullable: true
                minLength: 1
                maxLength: 120
              pinned:
                type: boolean
    responses:
      "200":
        description: The agent request as changed.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: archiveObserveRequest
    x-audit: { action: run.archive, target: { kind: run, id: path.id } }
    x-surfaces:
      mcp: [archive_run]
      cli: [observe requests archive]
    summary: Archive one of your agent requests so it leaves your list.
    description: >-
      Only the principal that made the request may archive it (403 `forbidden`); a request hidden from the caller answers 404.
      The request stays readable through `GET /observe/{id}`, and archiving it again changes nothing.
    responses:
      "204":
        description: The request is archived; nothing is returned.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe-id-build:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getObserveRequestBuild
    x-audit: { action: run.view, target: { kind: run, id: path.id } }
    x-surfaces:
      mcp: [get_run_build]
      cli: [observe]
    summary: Read the dashboard an agent request has built so far, with its ObserveSpec.
    description: >-
      Only the principal that made the request and Admins can read its build, and for a revision only while the reader can still view the dashboard; everyone else gets 404, as does a request without a build.
      Saving a build stays with the requester.
      A new-dashboard request builds a dashboard that is not in any folder or list until it finishes.
      Clients read `build` of `GET /observe/{id}` once a second and fetch this operation when its `saves` changes.
    responses:
      "200":
        description: The build.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [build]
              properties:
                build:
                  $ref: "../openapi.yaml#/components/schemas/AgentBuild"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe-id-build-save:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: saveObserveRequestBuild
    x-audit: { action: run.keep, target: { kind: run, id: path.id } }
    summary: Save the build of a failed agent request as one version.
    description: >-
      Only the principal that made the request may call it; a revision also needs edit access on its dashboard; anyone else gets 404.
      A new-dashboard request becomes version 1 of a new dashboard in the requester's default folder (a person's My Dashboards, a key's General); a revision becomes the next version of its dashboard and fails with 409 `version_conflict` when someone saved a version after the build started, leaving the build in place.
      No query runs: every build save was checked when the agent made it, and panels that were unverified then stay unverified.
      The request stays `failed` with its `failure_code`; it gains `result_version`, `dashboard_id` and `build_saved_at`, and the build is deleted.
      A repeat call answers 200 with `replayed` true and the version already saved.
      A `queued` or `running` request answers 409 `build_running`, a build without panels 409 `build_empty`, and a request that is no longer failed with an unsaved build 409 `build_not_savable`.
      A request without a build, an expired build, or a request of someone else answers 404.
    responses:
      "200":
        description: The request had already saved a version; nothing changed.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentBuildSaved"
      "201":
        description: The build became a version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentBuildSaved"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The build cannot be saved now: `build_running`, `build_empty` or `build_not_savable`, or `version_conflict` with `latest_version` when a revision's dashboard has a newer version than the build's base.
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the request read data only Admins can query, such as the audit trail, and the build's folder is not one only Admins can read (`restricted_answer`, saying why).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/VersionConflict"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe-id-observation:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: saveObserveRequestAnswer
    x-audit: { action: finding.save_as_observation, target: { kind: run, id: path.id } }
    x-surfaces:
      cli: [observe save-answer]
      mcp: [save_run_answer]
    summary: Save the answer of an agent request as an observation.
    description: >-
      A plain question asked in chat or in a comment is answered on the request alone, in `finding` with `observation_id` null, and makes no observation; an investigation already has its own.
      This files that answer as an observation with its text and evidence: in the folder of the dashboard the question was about, else in the requester's default folder (a person's My Dashboards, a key's General).
      An answer whose request read data only Admins can query, such as the audit trail, is filed in the folder of the dashboard or observation it was about when only Admins can read that folder, else in the built-in Audit folder instead.
      Only the principal that made the request may call it; anyone else, an Admin included, gets 404 or 403 and nothing changes.
      The request gains `observation_id` and `url`, and `finding.observation_id` is set.
      A repeat call answers 200 with `replayed` true and the same observation.
      A request without an answer answers 409 `no_answer`.
    responses:
      "200":
        description: The answer was already an observation; nothing changed.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AnswerSaved"
      "201":
        description: The answer became an observation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AnswerSaved"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The request has no answer to save (`no_answer`).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the request read data only Admins can query, such as the audit trail, and neither the folder of what it was about nor the built-in Audit folder is one only Admins can read (`restricted_answer`, saying why).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe-id-share:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: shareObserveRequestAnswer
    x-audit: { action: run.share, target: { kind: run, id: path.id } }
    x-surfaces:
      cli: [observe share-answer]
      mcp: [share_answer]
    summary: Share the answer of a private question in a comment thread.
    description: >-
      A private question (`kind` `ask` with a `chat_id`, about a dashboard or an observation) is read only by its requester and Admins and writes nothing shared.
      This shows its answer to everyone who can read what it was about: it opens a comment thread there at the question's panel, block or anchor, with the prompt as the caller's message and the agent's answer as the reply, and on an observation it also writes the answer onto the page.
      With `thread_id` the two are added to that thread instead, which must be on the same dashboard or observation.
      Both are written in one transaction and the run is shared once; a repeat call answers 200 with `replayed` true and the first thread.
      Only the requester may call it, with Comment there; anyone else, an Admin included, gets 404.
      The request itself and the rest of its chat stay readable only by the requester and Admins, and the answer is then read through the thread.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              thread_id:
                type: string
                format: uuid
                description: A thread on the same dashboard or observation to add the question and answer to; omit to open a new one.
    responses:
      "200":
        description: The run was already shared; nothing changed.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AnswerShared"
      "201":
        description: The question and its answer were posted.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AnswerShared"
      "400":
        description: >-
          The body is not valid, or `thread_id` is not a thread you can comment in on the dashboard or observation the question was about (`invalid_thread`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The request is not a private question (`not_shareable`) or has not finished with an answer (`no_answer`).
          Or the answer's evidence reads a datasource only Admins can query and the dashboard or observation is not in a folder only Admins can read (`restricted_content`, naming the `datasource`).
          Or the request read data only Admins can query, such as the audit trail, and the dashboard or observation is not in a folder only Admins can read (`restricted_answer`, saying why); keep such an answer in the chat, or share it where only Admins read.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe-id-cancel:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: cancelObserveRequest
    x-audit: { action: run.cancel, target: { kind: run, id: path.id } }
    x-surfaces:
      mcp: [cancel_run]
      cli: [observe cancel]
    summary: Cancel a queued or running agent request.
    description: >-
      Only the principal that made the request may call it; no editor and no administrator may cancel another principal's request.
      Someone else gets 403 `forbidden` on a revision they can see, and 404 on a new-dashboard request or a suggestion request.
      A queued request becomes `canceled` at once: `status` `failed` with the failure code `canceled`.
      A running request with a live worker is `canceling` (`status` stays `running`) until its worker sees the cancel flag, within about 5 seconds plus the time the in-flight model or tool call takes to return; it then ends `canceled`.
      A running request whose worker is gone, because its lease expired, ends `canceled` at once, and no worker picks a canceling request up again.
      The build is kept, so the requester can still save it or continue it.
      A run that saved its version before the cancel took effect ends `succeeded`, because a saved version always wins.
      Canceling a request that is already canceled answers 200 with the request; any other finished request answers 409 `request_finished`.
    responses:
      "200":
        description: The request, with `cancel_requested_at` set.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The request already finished and was not canceled (`request_finished`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observe-id-continue:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: continueObserveRequest
    x-audit: { action: run.continue, target: { kind: run, id: path.id } }
    x-surfaces:
      cli: [observe continue]
    summary: Continue a stopped agent request in a new request that takes over its build.
    description: >-
      The new request copies the stopped request's intent, dashboard, comment, panel, prompt and base version, records `continues_id`, and takes the build, so the agent continues from the panels already built with its own model-call budget.
      The stopped request gains `continued_by` and can no longer be saved or continued.
      A request is continuable when it is `failed`, its build was not saved, it still has its build, and nothing continues it yet; otherwise the call answers 409 `not_continuable`.
      Continue and `POST /observe/{id}/build/save` on the same request are exclusive: Continue after a save answers 409 `not_continuable`, and a save after Continue answers 404 `not_found` because the build moved to the new request.
      Only the principal that made the request may call it, with the same access as starting a run; someone else gets 403 `forbidden` on a revision they can see and 404 on a new-dashboard request.
      A revision whose dashboard has a newer version than the build's base answers 409 `version_conflict` with `latest_version`.
      The new request counts against the same caps as `POST /observe`, and is assigned to the same agent as the stopped one.
      The optional `note` is stored on the new request as `continue_note` and given to the agent in every seed of that run, including its restarts.
      Without a configured LLM provider the endpoint answers 503 `agent_unavailable`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ContinueObserveRequest"
    responses:
      "201":
        description: The queued request that continues the stopped one.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "400":
        description: The note breaks the prompt rule (`invalid_request`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The request cannot be continued: `not_continuable`, `assignee_unavailable` when the agent it was assigned to is a revoked, expired or foreign grant or a service account that no longer takes runs, or `version_conflict` with `latest_version` when a revision's dashboard has a newer version than the build's base.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/VersionConflict"
      "429":
        description: Too many agent requests are queued or running (`too_many_requests` for the caller, `agent_busy` for the instance, `too_many_revisions` for the dashboard).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: No LLM provider is configured (`agent_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
observe-id-retry:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: retryObserveRequest
    x-audit: { action: run.retry, target: { kind: run, id: path.id } }
    x-surfaces:
      mcp: [retry_run]
      cli: [observe retry]
    summary: Start a finished agent request again as a new request.
    description: >-
      Anyone who can see the request and may start that kind of request can call it, not only the requester; being someone else is never a reason to refuse, except that a caller who reads the request `redacted` may not start its words again.
      The new request is the caller's: its `requested_by` is the caller, not the original requester, and it counts against the caller's caps like `POST /observe`.
      The original request is left as it was.
      An observe request starts a new build with the same prompt, an investigation starts again on the same dashboard, panel and window, and a prompt revision starts a revision of the same dashboard on its latest version.
      A comment or suggestion request cannot be retried, and neither can a request that something continues.
      An ask from an observation thread whose answer was saved as an observation starts again in that thread for a caller who can comment on the thread's observation; anyone else gets a private ask of their own about the saved observation, with no thread and nothing posted in it.
      A failed or stopped request can be retried once by its requester: the new request is its `retried_by`, and a second call, including one racing the first or a continue, is refused instead of queuing a duplicate. Anyone else's retry is a request of their own and leaves the original retryable.
      A request that is not finished, one of those, or one the caller reads `redacted`, answers 409 `invalid_transition` with its `state` and the `allowed_actions` the caller has.
      A request hidden from the caller, including any request without a dashboard that is not the caller's, answers 404 `not_found`.
      A caller who can see the request but lacks the role or folder level to start that kind of request answers 403 `forbidden_role`, the same answer as `POST /observe`.
      The new request is assigned to the same agent as the original; when that is a revoked, expired or foreign grant, or a service account that no longer takes runs, the call answers 409 `assignee_unavailable` and queues nothing.
      Retrying a request that succeeded queues a new request on every call.
      Without a configured LLM provider the endpoint answers 503 `agent_unavailable` for a request the built-in agent took.
    responses:
      "202":
        description: The queued request.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AgentRequestEnvelope"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The request cannot be retried now (`invalid_transition`), or the agent it was assigned to cannot take it again (`assignee_unavailable`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/InvalidTransition"
                - $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: The panel an investigation was about no longer exists (`unknown_panel`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "429":
        description: Too many agent requests are queued or running (`too_many_requests` for the caller, `agent_busy` for the instance, `too_many_revisions` for the dashboard).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: No LLM provider is configured (`agent_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
observe-id-build-panels-panel-id-data:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: panel_id
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: getBuildPanelData
    x-audit: { none: "panel data of a build the agent saved; the run is recorded", target: { kind: run, id: path.id } }
    summary: Run the queries of one panel of an agent request's build and return their frames.
    description: >-
      The queries come from the stored build, so the request names a panel and never carries query text, as for saved versions.
      This is the second exception to the rule that the proxy runs only saved panel queries: the build is not a version yet.
      Only signed-in users who made the request, and signed-in Admins, may call it, and a service-account key gets 403 `user_session_required`; anyone else gets 404.
      The queries run with the agent tools' limits (15 seconds, 200 series, 100,000 points, 1,000 rows), nothing is cached, and the call counts against the caller's 8 in-flight query requests.
      `from`, `to`, `tz`, `max_data_points` and the `var-<name>` selections behave as for panel data of a saved version, and `from` and `to` default to the build's `time`.
      The response has the shape of panel data, with `meta.cached` always false.
    parameters:
      - name: from
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: to
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: tz
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: max_data_points
        in: query
        schema:
          type: integer
          minimum: 10
          maximum: 11000
          default: 1000
    responses:
      "200":
        description: The frames the build's queries returned.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelData"
      "400":
        description: The request is malformed or fails validation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The request carried query text (`query_not_in_spec`), or the caller is not a signed-in user (`user_session_required`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: There is no such build for the caller (`not_found`), or the build has no such panel (`panel_not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "422":
        description: A query or a variable cannot run, with the codes of panel data.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: A datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the query timeout.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
observe-id-build-variables-name-values:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: name
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: getBuildVariableValues
    x-audit: { none: "variable values of a build the agent saved; the run is recorded", target: { kind: run, id: path.id } }
    summary: List the values of one variable of an agent request's build.
    description: >-
      Behaves as the values of a saved version's variable, over the stored build, with the same access rule as the build's panel data: signed-in users who made the request and signed-in Admins only, 403 `user_session_required` for a key, 404 for anyone else.
      Nothing is cached, and the call counts against the caller's 8 in-flight query requests.
    parameters:
      - name: from
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: to
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: tz
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 64
    responses:
      "200":
        description: Up to 1000 values; `truncated` is true when there were more.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/VariableValues"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The request carried query text (`query_not_in_spec`), or the caller is not a signed-in user (`user_session_required`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: There is no such build for the caller (`not_found`), or it has no such variable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: The variable's query cannot run, with the codes of variable values of a saved version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        description: A datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the query timeout.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
