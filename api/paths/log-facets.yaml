datasources-uid-log-facets:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: logFacets
    summary: Count the top values of each label, field or column a logs query matches over a range.
    description: >-
      Each field answers with its most frequent values and their counts, exact where the datasource can count and from a sample of the newest lines where it cannot; every field says which with `exact`.
      On Loki the index labels of the matched streams (`kind` `label`) are counted exactly from the index volume API, whose counts are bytes, so those fields carry `unit` `bytes`; parsed and structured-metadata fields (`kind` `field`) are counted from the newest `sample` lines of the full query, and the response says so with `sampled` and `lines_sampled`.
      The Loki query must be a log query that starts with a stream selector; the selector before the first `|` picks the streams.
      On ClickHouse every field (`kind` `column`) is counted exactly with one `GROUP BY` per field over the query with its top-level `ORDER BY` and `LIMIT` dropped; the query must be one SELECT without UNION, INTERSECT, EXCEPT or LIMIT BY.
      Without `fields`, Loki counts every index label of the matched streams plus every detected field, and ClickHouse every result column except `Timestamp`, `Body`, `TraceId` and `SpanId`, plus the top 20 keys of `LogAttributes` as `LogAttributes.<key>` when it is a result column.
      Fields come exact first, then by cardinality ascending, then by name; values by count descending, then by value.
      The query runs with the agent tools' limits, nothing is cached, and the call counts against the caller's 8 in-flight query requests.
      Viewers and above may call it, service-account keys included.
      `from` and `to` take relative expressions such as `now-1h`, epoch milliseconds or RFC 3339 times.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [query, from, to]
            properties:
              query:
                type: string
                minLength: 1
                maxLength: 65536
                description: The logs query the page runs.
              from:
                type: string
                minLength: 1
                maxLength: 128
              to:
                type: string
                minLength: 1
                maxLength: 128
              timezone:
                type: string
                minLength: 1
                maxLength: 64
                description: The browser's IANA time zone, used to resolve relative times such as `now/d`.
              fields:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
                  minLength: 1
                  maxLength: 200
                description: Count only these fields; on ClickHouse a name that is neither a result column nor `LogAttributes.<key>` answers `query_invalid`.
              limit:
                type: integer
                minimum: 1
                maximum: 50
                default: 10
                description: Values per field.
              sample:
                type: integer
                minimum: 100
                maximum: 5000
                default: 1000
                description: The newest lines to sample for fields the datasource cannot count exactly.
    responses:
      "200":
        description: The top values of each field.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/LogFacets"
      "400":
        description: >-
          The request is malformed or fails validation, `fields`, `limit` or `sample` is out of range, or the datasource is not Loki or ClickHouse (`invalid_request`), or the query is longer than 64 KiB (`query_too_long`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        description: The datasource does not exist (`not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: >-
          The query cannot run: `query_invalid` for a Loki metric query, a ClickHouse query with a top-level UNION, INTERSECT, EXCEPT or LIMIT BY, a requested field that is not a column of the query, or an upstream rejection; `query_forbidden`, `limit_exceeded` or `unknown_macro` as for the explore query; the body carries no `ref`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request, including a datasource call that failed without a classified cause.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: The datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: The datasource did not answer within the 15 second query timeout, or the request did not finish within 20 seconds.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
