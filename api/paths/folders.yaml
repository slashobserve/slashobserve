folders:
  get:
    operationId: listFolders
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_folders]
      cli: [observe folders list]
    summary: List the folders the caller can see.
    description: >-
      A folder with listed people or groups is visible only to them, to its creator and to Admins; every other folder is visible to everyone.
      Folders are sorted by title without regard to case, with General last.
      Each folder carries the caller's own `permissions` on it, and `audit` is true on the Audit folder.
      The response is `private, no-cache` with a weak `ETag` and `Vary: Authorization, Cookie`, so a client that sends `If-None-Match` gets 304 while nothing changed.
    responses:
      "200":
        description: The visible folders.
        headers:
          ETag:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [folders]
              properties:
                folders:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/Folder"
      "304":
        $ref: "../openapi.yaml#/components/responses/NotModified"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: createFolder
    x-audit: { action: folder.create, target: { kind: folder } }
    x-surfaces:
      mcp: [create_folder]
      cli: [observe folders create]
    summary: Create a folder.
    description: >-
      Needs the Editor role.
      The title is trimmed (spaces and zero-width characters at the ends), 1 to 100 characters on one line with no control, bidirectional override or zero-width characters and at least one visible character, and unique without regard to case; the 400 `invalid_request` carries a `reason` from `docs/reference/text-rules.md`.
      The caller becomes the folder's creator and manages it, whatever its permissions list.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title:
                type: string
                description: Trimmed before it is stored; 1 to 100 characters with no control characters.
    responses:
      "201":
        description: The folder was created.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Folder"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "409":
        description: A folder with that title already exists (`folder_exists`), ignoring case, or the title is `My Dashboards`, which every person's personal folder uses.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
folders-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getFolder
    x-audit: { none: "read; only dashboard, observation and public link views are recorded", target: { kind: folder, id: path.id } }
    summary: Get a folder.
    description: A folder the caller cannot see answers 404, as if it did not exist.
    responses:
      "200":
        description: The folder.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Folder"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  patch:
    operationId: renameFolder
    x-audit: { action: folder.rename, target: { kind: folder, id: path.id } }
    x-surfaces:
      mcp: [rename_folder]
      cli: [observe folders rename]
    summary: Rename a folder.
    description: Needs the Manage permission on the folder. The General folder cannot be renamed.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title:
                type: string
                description: Trimmed before it is stored; 1 to 100 characters with no control characters.
    responses:
      "200":
        description: The renamed folder.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Folder"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: Another folder has that title (`folder_exists`), or the folder is General (`general_folder`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: deleteFolder
    x-audit: { action: folder.delete, target: { kind: folder, id: path.id } }
    x-surfaces:
      cli: [observe folders delete]
    summary: Delete an empty folder.
    description: Needs the Manage permission on the folder. The General folder cannot be deleted, and a folder that holds dashboards must be emptied first.
    responses:
      "204":
        description: The folder and its permissions are deleted.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The folder still holds dashboards, findings or saved searches (`folder_not_empty`), or it is General (`general_folder`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
folders-id-permissions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getFolderPermissions
    x-audit: { none: "read; only dashboard, observation and public link views are recorded", target: { kind: folder, id: path.id } }
    x-surfaces:
      cli: [observe folders permissions show]
    summary: List who a folder is restricted to.
    description: >-
      An empty list means the folder is open to everyone by instance role.
      Users come first by name, then groups by name.
    responses:
      "200":
        description: The folder's permission entries.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/FolderPermissions"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  put:
    operationId: setFolderPermissions
    x-audit: { action: folder.permissions_change, target: { kind: folder, id: path.id } }
    x-surfaces:
      cli: [observe folders permissions grant, observe folders permissions revoke, observe folders permissions open, observe folders permissions admins-only]
    summary: Replace the people and groups a folder is restricted to.
    description: >-
      Needs the Manage permission on the folder.
      The entries replace every existing row in one transaction.
      An empty `entries` list makes the folder open to everyone by instance role again.
      Each entry names exactly one of `user_id`, `email` (matched without regard to case against people who have signed in) and `group` (an OIDC group name, matched exactly), at most 50 entries and no repeated person or group.
      A person whose entries match the folder gets the higher of their instance role's level and the highest of those entries on the folder and its dashboards: an entry can lift a Viewer or Commenter (Edit lets them change and create dashboards there, Admin lets them manage the folder) and never lowers anyone.
      The General folder is never restricted.
      `admins_only: true` with an empty `entries` list makes the folder one only Admins can read, its creator included; only an Admin can set it, never on a personal folder, and any other change clears it.
      A folder that holds content reading an Admins-only datasource cannot be opened or given entries (409 `restricted_content`, with that content in `items`).
      Nor can a folder that holds a dashboard or observation with an answer that read Admin-only data (409 `restricted_answer`, naming that content).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [entries]
            properties:
              admins_only:
                type: boolean
                description: True to make the folder one only Admins can read; `entries` must then be empty.
              entries:
                type: array
                maxItems: 50
                items:
                  type: object
                  additionalProperties: false
                  required: [level]
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    email:
                      type: string
                    group:
                      type: string
                    level:
                      $ref: "../openapi.yaml#/components/schemas/FolderLevel"
    responses:
      "200":
        description: The folder's permission entries after the change.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/FolderPermissions"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The folder is General (`general_folder`), or the folder holds content that reads an Admins-only datasource and the change would let others read it (`restricted_content`, with `items` listing up to 20 of it and `unlisted` counting the rest), or the folder holds a dashboard or an observation with an answer that read Admin-only data and the change would let others read it (`restricted_answer`, naming that content, with `reason` `permanent`, or `run_in_flight` while an agent run about that content has not ended), or `admins_only` would close a folder holding a dashboard or an observation with an unexpired public link (`admins_only_folder`).
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: >-
          No signed-in person matches an entry (`unknown_user`), an email belongs to more than one person, or `admins_only` came with entries (`invalid_request`).
          `email` is set when the entry was an email.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [error, code]
              properties:
                error:
                  type: string
                code:
                  type: string
                email:
                  type: string
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
