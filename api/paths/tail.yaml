datasources-uid-tail:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: tailLogs
    summary: Stream new log lines of a logs query as Server-Sent Events.
    description: >-
      The server polls the datasource every second for lines newer than the last line it sent and streams them as they arrive, so the browser holds no credential and runs no query of its own.
      The stream starts with `retry: 3000` and an `event: ready` whose data is `{"datasource_uid","from"}`.
      Each poll that found lines sends an `event: lines` whose data is `{"frames","newest","truncated"}`: `frames` holds the lines in the `Frame` shape of a panel data response, every frame with `ref` `A`, oldest first, with a `TimeNs` string field beside `Time`; `newest` is the RFC 3339 time of the newest line; `truncated` is true when the poll hit `limit`, and the next poll then runs at once instead of a second later.
      The next poll starts one nanosecond after `newest`, so a line is sent once.
      A datasource failure sends an `event: error` whose data is `{"error","code"}` with the code the explore query would answer, and the stream ends; a datasource that is unavailable or slow is retried and reported only after five failed polls in a row.
      The first poll runs before any stream byte, so a query that cannot run answers JSON with the explore query's status instead of a stream.
      For Loki the query must be a log query that starts with a stream selector; for ClickHouse one SELECT that selects `Timestamp`, whose top-level `ORDER BY` and `LIMIT` the server replaces.
      A `: ping` comment arrives every 15 seconds and re-checks the caller's credential, and the server ends the stream after 30 minutes.
      Polls run with the agent tools' limits and share the server's upstream call slots, but a tail holds no in-flight query slot.
      A caller may hold 5 tails and the process 200.
      Viewers and above may call it, service-account keys included.
    parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 65536
        description: The query the logs page runs.
      - name: from
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: >-
          Where the first poll starts: a relative expression such as `now-30s`, epoch milliseconds or an RFC 3339 time, in the past.
          Defaults to 10 seconds ago.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
        description: The most lines one poll returns.
      - name: timezone
        in: query
        required: false
        schema:
          type: string
        description: The IANA zone a relative `from` resolves in; defaults to UTC.
    responses:
      "200":
        description: An open `text/event-stream`.
        content:
          text/event-stream:
            schema:
              type: string
      "400":
        description: >-
          A parameter is missing, repeated, unknown or out of range, `from` is not a time or lies in the future, or the datasource is not Loki or ClickHouse (`invalid_request`), or the query is longer than 64 KiB (`query_too_long`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        description: The datasource does not exist (`not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: >-
          The first poll cannot run: `query_invalid` for a Loki metric query, a ClickHouse query without `Timestamp` or with a top-level set operator, or an upstream rejection; `query_forbidden`, `limit_exceeded` or `unknown_macro` as for the explore query.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "429":
        description: The caller already holds 5 tails (`too_many_streams`), or the server's shared upstream call slots stayed busy for the first poll (`too_many_requests`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        description: The server failed to handle the request, including a first poll that failed without a classified cause.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "502":
        description: The datasource is unavailable for the first poll.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "503":
        description: The process holds 200 tails (`too_many_streams`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "504":
        description: The datasource did not answer the first poll within the 15 second query timeout.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
