dashboards:
  post:
    operationId: createDashboard
    summary: Create a dashboard from a Spec, validating it and running every panel query.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [spec]
            properties:
              spec:
                type: object
                additionalProperties: true
                description: The ObserveSpec document.
              summary:
                type: string
                maxLength: 500
                description: A blank or missing summary uses the default `Create dashboard`.
              folder_id:
                type: string
                format: uuid
                description: >-
                  The folder to create the dashboard in.
                  Missing means the caller's last used folder they can still create in, else General.
                  404 when the folder does not exist or the caller cannot see it, 403 when they cannot create there.
    responses:
      "201":
        description: The dashboard and its first version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  get:
    operationId: listDashboards
    summary: List the dashboards the caller can see, most recently updated first or grouped by folder.
    description: >-
      Filters combine with AND; `total_count` counts all matches regardless of the cursor.
      Dashboards in folders the caller cannot see are never listed or counted.
      A `cursor` only works with the `order` it came from; a cursor from the other order is a 400.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      - name: made_by
        in: query
        description: "Who made the dashboard: `me` (the caller), `user:<uuid>`, `service_account:<uuid>`, `agent` (saved by the agent), `mcp` (any MCP client) or `mcp:<client>` (one MCP client by name)."
        schema:
          type: string
      - name: datasource
        in: query
        description: A datasource uid; only dashboards whose latest version uses it.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: q
        in: query
        description: Case-insensitive text found in the title or the description; leading and trailing whitespace is ignored and a value of only whitespace is rejected.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: folder
        in: query
        description: Only dashboards in this folder; a folder that does not exist or that the caller cannot see gives an empty page, not an error.
        schema:
          type: string
          format: uuid
      - name: order
        in: query
        description: >-
          `updated` (default) sorts by most recent update.
          `folder` sorts General last and the other folders by lower-case title, then folder id, and by most recent update inside a folder.
        schema:
          type: string
          enum: [updated, folder]
          default: updated
      - name: tag
        in: query
        description: Only dashboards with every given tag.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9_.-]{0,39}$"
    responses:
      "200":
        description: One page of dashboards.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dashboards, next_cursor, total_count]
              properties:
                dashboards:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/DashboardListItem"
                next_cursor:
                  type: string
                  nullable: true
                total_count:
                  type: integer
                  minimum: 0
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-tags:
  get:
    operationId: listDashboardTags
    summary: List every dashboard tag with its dashboard count, by tag name.
    responses:
      "200":
        description: Every tag in use, at most 500, ordered by name.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [tag, dashboards]
                    properties:
                      tag:
                        type: string
                        pattern: "^[a-z0-9][a-z0-9_.-]{0,39}$"
                      dashboards:
                        type: integer
                        minimum: 1
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getDashboard
    summary: Get a dashboard with its latest version.
    responses:
      "200":
        description: The dashboard and its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  patch:
    operationId: moveDashboard
    summary: Move a dashboard to another folder.
    description: >-
      Needs Edit on the dashboard and on the target folder.
      A move creates no version, does not change `updated_at` and sends no event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [folder_id]
            properties:
              folder_id:
                type: string
                format: uuid
    responses:
      "200":
        description: The dashboard in its new folder with its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: deleteDashboard
    summary: Delete a dashboard with every version, comment, agent request and import record.
    description: >-
      Needs Edit on the dashboard. The delete cannot be undone.
      Open event streams receive `dashboard.deleted` and then end.
      While the `/observe` chat that created the dashboard is still queued or running, the delete is refused.
    responses:
      "204":
        description: The dashboard and everything that belongs to it are deleted.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The agent is still creating this dashboard (`dashboard_being_created`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-versions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: listDashboardVersions
    summary: List the versions of a dashboard without their Specs, newest first.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of version metadata.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versions, next_cursor]
              properties:
                versions:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/VersionMeta"
                next_cursor:
                  type: string
                  nullable: true
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: createDashboardVersion
    summary: Save a new version on top of the version the caller last saw, validating the Spec and running every panel query.
    description: >-
      A request whose parent version is no longer the latest answers 409, unless it repeats the latest version exactly
      (same parent, author and Spec), in which case it answers 200 with `Idempotent-Replay: true`.
      A failing panel or variable does not fail the save when the parent version lists it in `unverified` and its queries
      (every field, with the datasource each query uses) and every variable they reach are unchanged;
      the new version lists it again with the new issues.
      Any other failing query is a 422 `invalid_spec` that lists only the blocking issues.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [spec, summary, parent_version]
            properties:
              spec:
                type: object
                additionalProperties: true
                description: The ObserveSpec document.
              summary:
                type: string
                minLength: 1
                maxLength: 500
              parent_version:
                type: integer
                minimum: 1
                maximum: 2147483647
    responses:
      "200":
        description: The request repeats the latest version, so that version is returned.
        headers:
          Idempotent-Replay:
            required: true
            schema:
              type: string
              enum: ["true"]
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "201":
        description: The new version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/VersionConflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-versions-version:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
  get:
    operationId: getDashboardVersion
    summary: Get one version of a dashboard with its Spec.
    responses:
      "200":
        description: The dashboard summary and the requested version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-versions-version-restore:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
  post:
    operationId: restoreDashboardVersion
    summary: Save a copy of an earlier version as a new version.
    description: >-
      The stored Spec is parsed again and its datasource references are checked, but its queries are not run,
      so restoring a known-good state does not fail because an upstream is briefly down.
      The new version copies the restored version's `unverified` list.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [parent_version]
            properties:
              parent_version:
                type: integer
                minimum: 1
                maximum: 2147483647
              summary:
                type: string
                maxLength: 500
                description: A blank or missing summary uses the default `Restore version {version}`.
    responses:
      "201":
        description: The new version, with `restored_from` naming the restored one.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/VersionConflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-diff:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: diffDashboardVersions
    summary: List the structural changes between two versions of a dashboard.
    parameters:
      - name: from
        in: query
        description: >-
          Defaults to `to` minus one.
          `0` diffs against an empty document, which yields a single `add` change at the root path `""`
          whose `to` is the whole Spec.
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
      - name: to
        in: query
        description: Defaults to the latest version.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    responses:
      "200":
        description: The changes from `from` to `to`.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, changes]
              properties:
                from:
                  type: integer
                  minimum: 0
                to:
                  type: integer
                  minimum: 1
                changes:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/SpecChange"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
