dashboards:
  post:
    operationId: createDashboard
    x-audit: { action: dashboard.create, target: { kind: dashboard } }
    x-surfaces:
      mcp: [create_dashboard]
    summary: Create a dashboard from a Spec, validating it and running every panel query.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [spec]
            properties:
              spec:
                type: object
                additionalProperties: true
                description: The ObserveSpec document.
              summary:
                type: string
                maxLength: 500
                description: A blank or missing summary uses the default `Create dashboard`.
              folder_id:
                type: string
                format: uuid
                description: >-
                  The folder to create the dashboard in.
                  Missing means the caller's default folder: a person's My Dashboards, a service-account key's General.
                  404 when the folder does not exist or the caller cannot see it, 403 when they cannot create there.
    responses:
      "201":
        description: The dashboard and its first version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  get:
    operationId: listDashboards
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_dashboards]
      cli: [observe dashboards list]
    summary: List the dashboards the caller can see, most recently updated first, grouped by folder or most viewed first.
    description: >-
      Filters combine with AND; `total_count` counts all matches regardless of the cursor.
      Dashboards in folders the caller cannot see are never listed or counted.
      A `cursor` only works with the `order` it came from; a cursor from the other order is a 400.
      `next_cursor` is also set on an `offset` page and continues after its last row.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      - name: offset
        in: query
        description: >-
          Skip this many dashboards, for numbered pages; counted in the same order and over the same visible, filtered dashboards as `total_count`.
          Cannot be combined with `cursor` (400).
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: made_by
        in: query
        description: "Who made the dashboard: `me` (the caller), `user:<uuid>`, `service_account:<uuid>`, `agent` (saved by the agent), `mcp` (any MCP client) or `mcp:<client>` (one MCP client by name)."
        schema:
          type: string
      - name: datasource
        in: query
        description: A datasource uid; only dashboards whose latest version uses it.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: q
        in: query
        description: Case-insensitive text found in the title or the description; leading and trailing whitespace is ignored and a value of only whitespace is rejected.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: folder
        in: query
        description: Only dashboards in this folder; a folder that does not exist or that the caller cannot see gives an empty page, not an error.
        schema:
          type: string
          format: uuid
      - name: order
        in: query
        description: >-
          `updated` (default) sorts by most recent update.
          `folder` sorts General last and the other folders by lower-case title, then folder id, and by most recent update inside a folder.
          `views` sorts by `view_count`, most viewed first, then by most recent update.
          `name` sorts by lower-case title, then by id.
        schema:
          type: string
          enum: [updated, folder, views, name]
          default: updated
      - name: tag
        in: query
        description: Only dashboards with every given tag.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z0-9][a-z0-9_.-]{0,39}$"
      - name: problem
        in: query
        description: >-
          Only dashboards with this health problem at their last check (`no_data`, `query_failed`, `variable_failed`) or now (`duplicate_title`, `unopened`); `any` means any of them, and also a dashboard waiting for a recheck of an earlier problem, or with a health repair on record.
          The same rules as `GET /health`.
        schema:
          type: string
          enum: [any, no_data, query_failed, variable_failed, duplicate_title, unopened]
      - name: exclude_audit
        in: query
        description: >-
          `true` leaves out the dashboards in the built-in Audit folder, from the page, the `total_count` and the paging alike; the other folders are listed as before.
          It only narrows what the caller can already see, and does not widen it.
          Default `false`.
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: One page of dashboards.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dashboards, next_cursor, total_count]
              properties:
                dashboards:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/DashboardListItem"
                next_cursor:
                  type: string
                  nullable: true
                total_count:
                  type: integer
                  minimum: 0
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-tags:
  get:
    operationId: listDashboardTags
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      cli: [observe dashboards tags]
    summary: List every dashboard tag with its dashboard count, by tag name.
    parameters:
      - name: exclude_audit
        in: query
        description: >-
          `true` leaves out the dashboards in the built-in Audit folder, so their tags and the counts come from the other folders only.
          Default `false`.
        schema:
          type: boolean
          default: false
    responses:
      "200":
        description: Every tag in use, at most 500, ordered by name.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [tag, dashboards]
                    properties:
                      tag:
                        type: string
                        pattern: "^[a-z0-9][a-z0-9_.-]{0,39}$"
                      dashboards:
                        type: integer
                        minimum: 1
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getDashboard
    x-audit: { action: dashboard.view, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [get_dashboard, get_panels]
      cli: [observe dashboards show]
    summary: Get a dashboard with its latest version.
    responses:
      "200":
        description: The dashboard and its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  patch:
    operationId: moveDashboard
    x-audit: { action: dashboard.move, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [move_dashboard]
      cli: [observe dashboards move]
    summary: Move a dashboard to another folder.
    description: >-
      Needs Edit on the dashboard and on the target folder.
      A personal folder (My Dashboards) takes no moves; moving into one answers 409 `personal_folder`.
      Moving a dashboard out of My Dashboards into a shared folder is how it is published.
      A move creates no version, does not change `updated_at` and sends no event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [folder_id]
            properties:
              folder_id:
                type: string
                format: uuid
    responses:
      "200":
        description: The dashboard in its new folder with its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The request conflicts with existing state.
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the content holds an answer that read Admin-only data and the folder is not one only Admins can read (`restricted_answer`).
          Or the dashboard is a starter the server keeps current with each release (`provisioned`); duplicate it to change a copy.
          Or the dashboard has an unexpired public link and the folder is one only Admins can read (`admins_only_folder`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: deleteDashboard
    x-audit: { action: dashboard.delete, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      cli: [observe dashboards delete]
    summary: Delete a dashboard with every version, comment, agent request and import record.
    description: >-
      Needs Edit on the dashboard. The delete cannot be undone.
      Open event streams receive `dashboard.deleted` and then end.
      While the `/observe` chat that created the dashboard is still queued or running, the delete is refused.
    responses:
      "204":
        description: The dashboard and everything that belongs to it are deleted.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The agent is still creating this dashboard (`dashboard_being_created`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-versions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: listDashboardVersions
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_dashboard_versions]
      cli: [observe dashboards versions]
    summary: List the versions of a dashboard without their Specs, newest first.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of version metadata.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versions, next_cursor]
              properties:
                versions:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/VersionMeta"
                next_cursor:
                  type: string
                  nullable: true
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: createDashboardVersion
    x-audit: { action: dashboard.update, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [update_dashboard, update_panels]
    summary: Save a new version on top of the version the caller last saw, validating the Spec and running every panel query.
    description: >-
      A request whose parent version is no longer the latest answers 409, unless it repeats the latest version exactly
      (same parent, author and Spec), in which case it answers 200 with `Idempotent-Replay: true`.
      A failing panel or variable does not fail the save when the parent version lists it in `unverified` and its queries
      (every field, with the datasource each query uses) and every variable they reach are unchanged;
      the new version lists it again with the new issues.
      Any other failing query is a 422 `invalid_spec` that lists only the blocking issues.
      With `merge: auto`, a stale save that changed other panels, variables or settings than the newer versions is merged and saved on top of the latest, and the reply has `merged_from`; an overlap answers 409 with `conflicts`.
      With `propose_if_needed`, a caller who can comment but not edit, or whose connection is in propose mode, gets a proposal and a 202 instead of a 403.
      Without it, such a caller is refused with 403.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [spec, summary, parent_version]
            properties:
              spec:
                type: object
                additionalProperties: true
                description: The ObserveSpec document.
              summary:
                type: string
                minLength: 1
                maxLength: 500
              parent_version:
                type: integer
                minimum: 1
                maximum: 2147483647
              merge:
                type: string
                enum: [auto]
                description: Merge a stale save onto the latest version on the server instead of answering 409 when nothing overlaps.
              propose_if_needed:
                type: boolean
                default: false
                description: Save the change as a proposal when the caller can comment but not edit, or their connection is in propose mode, instead of answering 403.
    responses:
      "200":
        description: The request repeats the latest version, so that version is returned.
        headers:
          Idempotent-Replay:
            required: true
            schema:
              type: string
              enum: ["true"]
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardVersionSaved"
      "201":
        description: The new version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardVersionSaved"
      "202":
        description: The change became a proposal, or a revision of the caller's open one; no version was saved.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ProposalCreated"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The parent version is no longer the latest; `latest_version` names the current one.
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the dashboard is a starter the server keeps current with each release (`provisioned`); duplicate it to change a copy.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/VersionConflict"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-versions-version:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
  get:
    operationId: getDashboardVersion
    x-audit: { none: "read; only dashboard, observation and public link views are recorded" }
    x-surfaces:
      mcp: [get_dashboard]
      cli: [observe dashboards show]
    summary: Get one version of a dashboard with its Spec.
    description: >-
      The response is `private, no-cache` with a weak `ETag` and `Vary: Authorization, Cookie`, so a client that sends `If-None-Match` gets 304 while nothing changed.
    responses:
      "200":
        description: The dashboard summary and the requested version.
        headers:
          ETag:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "304":
        $ref: "../openapi.yaml#/components/responses/NotModified"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-versions-version-restore:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
  post:
    operationId: restoreDashboardVersion
    x-audit: { action: dashboard.restore, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [restore_dashboard_version]
      cli: [observe dashboards restore]
    summary: Save a copy of an earlier version as a new version.
    description: >-
      The stored Spec is parsed again and its datasource references are checked, but its queries are not run,
      so restoring a known-good state does not fail because an upstream is briefly down.
      The new version copies the restored version's `unverified` list.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [parent_version]
            properties:
              parent_version:
                type: integer
                minimum: 1
                maximum: 2147483647
              summary:
                type: string
                maxLength: 500
                description: A blank or missing summary uses the default `Restore version {version}`.
    responses:
      "201":
        description: The new version, with `restored_from` naming the restored one.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The parent version is no longer the latest; `latest_version` names the current one.
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the dashboard is a starter the server keeps current with each release (`provisioned`); duplicate it to change a copy.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/VersionConflict"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-panels:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: patchDashboardPanels
    x-audit: { action: dashboard.update, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [update_panels]
      cli: [observe dashboards panels]
    summary: Save a new version that adds, replaces, removes or moves panels, running only the queries of what changed.
    description: >-
      The patch is applied to `parent_version` with the same merge as the `update_panels` tool, then saved like `createDashboardVersion` with `merge: auto`.
      Only the changed panels and variables run their queries, or every query when `dashboard.time` changes.
      A retried request with the same parent and body answers 200 with `Idempotent-Replay: true`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [summary, parent_version]
            properties:
              upsert:
                type: array
                maxItems: 50
                items:
                  type: object
                  additionalProperties: true
                description: Complete panels matched by id; an existing id replaces that panel and keeps its position without `gridPos`, a new id adds one.
              delete:
                type: array
                maxItems: 50
                items:
                  type: string
                description: Ids of panels to remove; a row only with all of its children.
              layout:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required: [id]
                  properties:
                    id:
                      type: string
                    gridPos:
                      type: object
                      additionalProperties: true
                    row:
                      type: string
                      description: Id of the row to move the panel into; an empty string moves it to the top level.
                description: Moves of existing panels.
              variables:
                type: array
                items:
                  type: object
                  additionalProperties: true
                description: The complete variable list; replaces the existing one.
              dashboard:
                type: object
                additionalProperties: false
                properties:
                  time:
                    type: object
                    additionalProperties: true
                  title:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  links:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                description: Dashboard-level values to replace; a key left out is kept.
              summary:
                type: string
                minLength: 1
                maxLength: 500
              parent_version:
                type: integer
                minimum: 1
                maximum: 2147483647
              propose_if_needed:
                type: boolean
                default: false
                description: Save the change as a proposal when the caller can comment but not edit, or their connection is in propose mode, instead of answering 403.
              accept_empty:
                type: boolean
                default: false
                description: Save a panel whose valid queries return no data for the dashboard's time range, which is refused as `query_empty` otherwise; the version lists the panel as unverified. A query that fails is still refused. Only a signed-in person may set it; a service-account key gets 403 `user_session_required`.
    responses:
      "200":
        description: The request repeats the latest version, so that version is returned.
        headers:
          Idempotent-Replay:
            required: true
            schema:
              type: string
              enum: ["true"]
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardVersionSaved"
      "201":
        description: The new version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardVersionSaved"
      "202":
        description: The change became a proposal, or a revision of the caller's open one; no version was saved.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ProposalCreated"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The parent version is no longer the latest; `latest_version` names the current one.
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the dashboard is a starter the server keeps current with each release (`provisioned`); duplicate it to change a copy.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/VersionConflict"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-duplicate:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: duplicateDashboard
    x-audit: { action: dashboard.create, target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [duplicate_dashboard]
      cli: [observe dashboards duplicate]
    summary: Save the latest version as version 1 of a new dashboard.
    description: >-
      Needs View on the dashboard and Create in the target folder.
      The copy keeps every Spec field except `title`, and the source version's `unverified` list.
      Its datasource references are checked but its queries are not run, as for a restore,
      so duplicating does not fail because an upstream is briefly down.
      Versions, comments, agent requests and the import record stay with the original.
      A copy of a dashboard that holds an answer that read Admin-only data goes only into a folder only Admins can read, and then holds that answer itself.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [title]
            properties:
              title:
                type: string
                description: The copy's title; it must pass the same rules as a Spec title.
              folder_id:
                type: string
                format: uuid
                description: >-
                  The folder to create the dashboard in.
                  Missing means the source dashboard's folder when the caller can create there, else the caller's default folder: a person's My Dashboards, a service-account key's General.
                  404 when the folder does not exist or the caller cannot see it, 403 when they cannot create there.
    responses:
      "201":
        description: The new dashboard and its first version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the dashboard holds an answer that read Admin-only data and the folder is not one only Admins can read (`restricted_answer`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-diff:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: diffDashboardVersions
    x-audit: { none: "read; only dashboard, observation and public link views are recorded" }
    x-surfaces:
      mcp: [diff_dashboard_versions]
      cli: [observe dashboards diff]
    summary: List the structural changes between two versions of a dashboard.
    parameters:
      - name: from
        in: query
        description: >-
          Defaults to `to` minus one.
          `0` diffs against an empty document, which yields a single `add` change at the root path `""`
          whose `to` is the whole Spec.
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
      - name: to
        in: query
        description: Defaults to the latest version.
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    responses:
      "200":
        description: The changes from `from` to `to`.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, changes]
              properties:
                from:
                  type: integer
                  minimum: 0
                to:
                  type: integer
                  minimum: 1
                changes:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/SpecChange"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-views:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getDashboardViews
    x-audit: { none: "read; only dashboard, observation and public link views are recorded" }
    x-surfaces:
      mcp: [get_dashboard]
      cli: [observe dashboards show]
    summary: Count how many people opened the dashboard in the last 30 days.
    description: >-
      Needs View on the dashboard.
      The count is person-days: a person who opens the dashboard on three different UTC days counts three, however often they open it on one day.
      The window is the last 30 UTC days including today, and the same count is `view_count` on each item of `GET /dashboards`.
    responses:
      "200":
        description: The count and the window it covers.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [view_count, window_days]
              properties:
                view_count:
                  type: integer
                  minimum: 0
                window_days:
                  type: integer
                  minimum: 1
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: recordDashboardView
    x-audit: { none: "recently opened counter; the view is recorded by GET /dashboards/{ id }" }
    summary: Record that the caller opened the dashboard.
    description: >-
      Needs View on the dashboard.
      The web app calls it once each time it loads a dashboard page.
      It keeps the caller's latest open, at most once every 10 minutes, and the dashboard health list reads it to find dashboards nobody opens.
      It also records that the caller opened the dashboard on this UTC day, once however often they open it, which `view_count` counts.
      A service-account key gets 204 and nothing is written, because only people count as opens.
    responses:
      "204":
        description: The open is recorded, or there was nothing to record.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-viewers:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: listDashboardViewers
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_dashboard_viewers]
      cli: [observe dashboards viewers]
    summary: List the other people who have the dashboard open now.
    description: >-
      Needs View on the dashboard.
      A person is listed while their open dashboard page has reported in during the last 45 seconds, by name and user id, ordered by name; the caller is left out.
      Everyone who can view a dashboard can see who else is looking at it.
    responses:
      "200":
        description: The people looking at the dashboard now.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardViewers"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: reportDashboardViewer
    x-audit: { none: "presence ping; the view is recorded by GET /dashboards/{ id }" }
    summary: Report that the caller has the dashboard open, and list who else does.
    description: >-
      Needs View on the dashboard.
      The web app calls it when a dashboard page opens and every 20 seconds while the page is visible; each call keeps the caller listed for 45 seconds and answers with the same list as `GET /api/v1/dashboards/{id}/viewers`.
      A service-account key gets the list and nothing is recorded, because only people count as viewers.
    responses:
      "200":
        description: The other people looking at the dashboard now.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardViewers"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
