auth-login:
  get:
    operationId: authLogin
    x-audit: { none: "starts a sign-in; the outcome is recorded by the callback" }
    summary: Start the OIDC sign-in and redirect to the identity provider.
    security: []
    parameters:
      - name: return_to
        in: query
        required: false
        description: Local path to return to after sign-in; anything else is replaced by `/`.
        schema:
          type: string
    responses:
      "302":
        description: Redirect to the identity provider, or to `/login?error=<code>` when sign-in cannot start, with `unavailable` when discovery fails and `sign_in_off` when the server has no identity provider configured.
        headers:
          Location:
            required: true
            schema:
              type: string
auth-callback:
  get:
    operationId: authCallback
    x-audit: { action: auth.login, target: { kind: session } }
    summary: Complete the OIDC sign-in and redirect to the local return path.
    security: []
    parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        schema:
          type: string
    responses:
      "302":
        description: Redirect to the return path with a session cookie, or to `/login?error=<code>` on refusal, with `sign_in_off` when the server has no identity provider configured.
        headers:
          Location:
            required: true
            schema:
              type: string
auth-logout:
  post:
    operationId: authLogout
    x-audit: { action: auth.logout, target: { kind: session } }
    summary: End the current session and clear its cookie.
    security: []
    responses:
      "204":
        description: The session cookie is cleared; nothing is returned.
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
auth-session:
  get:
    operationId: authSession
    x-audit: { none: "reads the caller's own session" }
    summary: Report whether the request carries a valid session.
    security: []
    responses:
      "200":
        description: The session state.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SessionState"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
me:
  get:
    operationId: getMe
    x-audit: { none: "reads the caller's own account" }
    x-surfaces:
      cli: [observe login, observe doctor]
    summary: Return the authenticated caller.
    responses:
      "200":
        description: The caller.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Principal"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
instance:
  get:
    operationId: getInstance
    x-audit: { none: "read; only dashboard, observation and public link views are recorded" }
    x-surfaces:
      cli: [observe doctor]
    summary: Return the server's public and MCP URLs and its sign-in settings; never a secret.
    responses:
      "200":
        description: The URLs clients use to reach this server and who may sign in.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Instance"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
