dashboards-id-actions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: runAction
    summary: Run an action that is saved in the dashboard's latest version.
    description: >-
      The server builds the request from the saved action, so the caller chooses only the variable values, the time range and the clicked value, never the method, address, headers or body template.
      `version` must be the dashboard's latest version, or the call answers 409 `stale_version`.
      `panel`, `element` and `action` (the index in the element's `actions`) locate a canvas action; without `element`, `panel`, `override` and `action` locate a field action: the panel's own `actions`, or those of the override at index `override`.
      An action that is missing answers 404 `action_not_found`.
      `inputs` gives a value for each of the action's own `variables` by key, and may name no other key; an action variable that has no input answers 400 `action_invalid`.
      `variables` may name only variables the version declares, each with at most 100 values of at most 1000 bytes, and every variable the action references needs a value.
      `__user.login`, `__user.email`, `__user.name` and `__user.id` come from the signed-in person and cannot be supplied.
      The request is sent only to an https address on the outbound allowlist, to a public address, and a redirect is returned as its own status without being followed.
      The remote body is read up to 64 KiB and discarded, never returned or logged.
      The caller needs Edit on the dashboard, and service accounts cannot call this endpoint.
      A person has at most 2 actions in flight.
      Every attempt that reaches the network is logged at INFO as `action run` with the person, dashboard, version, panel, element or override when the request has one, action index, method, host, status, outcome and duration, and never with the address, headers, body, variable values or inputs.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version, panel, action, from, to]
            properties:
              version:
                type: integer
                minimum: 1
                maximum: 2147483647
              panel:
                type: string
                minLength: 1
                maxLength: 64
              element:
                type: string
                minLength: 1
                maxLength: 64
                description: The canvas element whose action runs.
              override:
                type: integer
                minimum: 0
                description: With no element, the override whose actions hold the action; absent means the panel's own field actions.
              action:
                type: integer
                minimum: 0
              variables:
                type: object
                nullable: true
                additionalProperties:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 1000
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              value:
                type: object
                nullable: true
                additionalProperties: false
                properties:
                  raw:
                    type: string
                    maxLength: 1000
                  text:
                    type: string
                    maxLength: 1000
                  numeric:
                    type: number
                    nullable: true
              fields:
                type: object
                nullable: true
                maxProperties: 50
                additionalProperties:
                  type: string
                  maxLength: 1000
              inputs:
                type: object
                nullable: true
                maxProperties: 10
                description: Values for the action's variables, by key.
                additionalProperties:
                  type: string
                  maxLength: 1000
    responses:
      "200":
        description: The remote server answered; `ok` is true for a 2xx status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ActionResult"
      "400":
        description: The body is malformed, a field is out of range, or `variables` names an undeclared variable, `inputs` names a key the action does not declare, or `element` and `override` are both set (`invalid_request`); or the action cannot be built from the supplied values, for example a header value with a line break, a JSON body that is no longer valid, an address that changed host or a body above 64 KiB (`action_invalid`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The caller is a service account (`forbidden`), has no Edit access to the dashboard (`forbidden_role`), or the action's domain is not on the outbound allowlist (`outbound_domain_not_allowed`, with `host`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ActionError"
      "404":
        description: The dashboard does not exist (`not_found`), or the version has no such panel, element, override or action (`action_not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: The dashboard has a newer version than `version` (`stale_version`); reload it before running the action.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "429":
        description: The caller already has 2 actions in flight (`too_many_actions`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        description: The request did not complete, because of a connection error, a timeout or a private or reserved address (`action_failed`, with `host`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ActionError"
