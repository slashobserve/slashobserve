users:
  get:
    operationId: listUsers
    summary: List everyone who has signed in, newest first.
    description: People are ordered by when they first signed in, newest first, so paging stays stable while people are active; last_seen_at does not affect the order. Service accounts cannot call this endpoint.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of people.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [users, next_cursor]
              properties:
                users:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/Person"
                next_cursor:
                  type: string
                  nullable: true
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
users-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: updatePersonRole
    summary: Set or clear the role an Admin chose for a person.
    description: A role value sets the chosen role and null clears it, after which the role is computed again from the server settings, the identity provider's groups and the default. A role decided by SLASHOBSERVE_ADMIN_EMAILS, by being the first person, or by an identity-provider group is locked and answers 409 with code role_locked. Lowering the last Admin answers 409 with code last_admin. Service accounts cannot call this endpoint.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdatePersonRequest"
    responses:
      "200":
        description: The person with the resulting role.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Person"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
users-id-sessions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  delete:
    operationId: signOutUserEverywhere
    summary: Delete every session of a person.
    description: Any signed-in person may sign anyone out, including themselves; the person can sign in again at once. Signing yourself out also expires your session cookie. Service accounts cannot.
    responses:
      "204":
        description: Every session of the person is deleted.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
