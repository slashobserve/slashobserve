datasources-uid-trace-logs:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: traceLogs
    x-surfaces:
      mcp: [logs_for_trace]
    summary: Read the log lines that carry a trace id, or one span id, from a logs datasource.
    description: >-
      The trace view's path from a span to its logs; the datasource in the path must be Loki or ClickHouse.
      The server builds the query itself from the ids, so no query text crosses this call.
      On Loki it narrows the stream selector to `service` through the first of the `service_name`, `service`, `app` and `job` labels present in the window, or reads every stream when `service` is not given; it filters `trace_id` (and `span_id`) as structured metadata or parsed labels first and, when that answers no line, runs the same selector with a line filter on the id, so lines that only carry the id in their body still match.
      On ClickHouse it reads the logs page's columns from `otel_logs` where `TraceId` (and `SpanId`) match within the window, newest first.
      `from` and `to` are the trace's window, with the grammar of the explore query; the web passes the trace's start minus a minute to its end plus a minute.
      The query runs with the agent tools' limits, nothing is cached, and the call counts against the caller's 8 in-flight query requests and takes one of the server's shared upstream slots, waiting at most 5 seconds for one before it answers 429 `too_many_requests` with `Retry-After`.
      Viewers and above may call it, service-account keys included.
      The response has the shape of panel data with one query `A` of kind `instant`, `meta.truncated` when the line limit was hit and `meta.oldest` and `meta.newest` as the time edges of the lines returned; an empty result is a 200 with no frames, never a 404.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [trace_id, from, to]
            properties:
              trace_id:
                type: string
                pattern: "^([0-9a-fA-F]{16}|[0-9a-fA-F]{32})$"
              span_id:
                type: string
                pattern: "^[0-9a-fA-F]{16}$"
                description: Narrow the lines to one span.
              service:
                type: string
                minLength: 1
                maxLength: 200
                description: The span's `service.name`, used to narrow the Loki stream selector; ClickHouse ignores it.
              from:
                type: string
                minLength: 1
                maxLength: 128
              to:
                type: string
                minLength: 1
                maxLength: 128
              timezone:
                type: string
                minLength: 1
                maxLength: 64
                description: The browser's IANA time zone, used to resolve relative times such as `now/d`.
              limit:
                type: integer
                minimum: 1
                maximum: 1000
                default: 500
                description: The most lines to return.
    responses:
      "200":
        description: The lines of the trace, or no frames when it logged nothing in the window.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelData"
      "400":
        description: >-
          The request is malformed or fails validation, or the datasource is not Loki or ClickHouse (`invalid_request`); the body carries no `ref`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        description: The datasource does not exist (`not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: >-
          The datasource refused the query (`query_invalid`) or the result passed a limit (`limit_exceeded`); the body carries no `ref`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request, including a datasource call that failed without a classified cause.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: The datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: The datasource did not answer within the 15 second query timeout, or the request did not finish within 20 seconds.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
