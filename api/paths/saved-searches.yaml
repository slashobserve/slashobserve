saved-searches:
  get:
    operationId: listSavedSearches
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_saved_searches]
      cli: [observe saved-searches list]
    summary: List the saved logs, trace and metrics searches the caller can view, most recently changed first.
    description: >-
      Lists every saved search in the folders the caller can view, newest `updated_at` first.
      `kind` keeps only one kind of search, and `folder_id` keeps one folder; a folder the caller cannot view gives 404.
      Each item carries the `folder` it is saved in, what the caller may do with it in `permissions`, and the `url` of the logs, traces or metrics page that reopens it.
    parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum: [logs, traces, metrics]
      - name: folder_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page.
        schema:
          type: string
    responses:
      "200":
        description: One page of saved searches.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SavedSearchList"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: createSavedSearch
    x-audit: { action: saved_search.create, target: { kind: saved_search } }
    x-surfaces:
      mcp: [save_search]
      cli: [observe saved-searches save]
    summary: Save a logs, trace or metrics search in a folder.
    description: >-
      Saves what the logs page, the trace view or the metrics page shows: the datasource, the query as it runs with its filter pills folded in, the visible columns of a logs search, the filters of a trace search or the mode of a metrics search, and the range as written.
      It is saved in `folder_id`, which needs Create there, else in the caller's My Dashboards, else in General.
      Everyone who can view that folder can read it.
      The datasource must exist (422 `unknown_datasource`) and fit the kind (422 `unsupported_datasource`): logs take Loki, ClickHouse, Elasticsearch and OpenSearch, traces take Tempo, Jaeger and ClickHouse, metrics take Prometheus.
      A logs or metrics search needs a `query`; a traces search may have one, TraceQL on Tempo, `key=value` pairs on Jaeger and SQL on ClickHouse.
      A body that breaks a rule of its fields answers 422 `invalid_saved_search` with the rule in `error`.
      A service-account key gets the checks of the `save_search` tool: a query with a lint error answers 422 `query_invalid` and nothing is saved, and a search the key already saved with the same title, datasource, query, filters, range and folder answers 200 with `replayed` true and that search, so a retry makes no second copy.
      The kind and the datasource never change afterwards: save a new search instead.
      The query, filters and range can be changed with a PATCH.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateSavedSearchRequest"
    responses:
      "200":
        description: The search this key had already saved, with `replayed` true.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SavedSearchReplayed"
      "201":
        description: The saved search.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SavedSearch"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: A field breaks a rule (`invalid_saved_search`), the datasource does not exist (`unknown_datasource`), does not fit the kind (`unsupported_datasource`) or a key's query fails the lint check (`query_invalid`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
saved-searches-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: updateSavedSearch
    x-audit: { action: saved_search.update, target: { kind: saved_search, id: path.id } }
    x-surfaces:
      mcp: [update_saved_search]
      cli: [observe saved-searches update, observe saved-searches rename, observe saved-searches move]
    summary: Rename a saved search, move it to another folder or change what it searches.
    description: >-
      Needs Edit on the saved search; a move also needs Edit on the target folder, and a move into a personal folder answers 409 `personal_folder`, because it would make the search private: save it there instead.
      `query`, `filters`, `from` and `to` replace what the search runs; the kind and the datasource never change, and the result is checked the way a save is, so a rule a save would break answers 422 `invalid_saved_search`.
      A rename or a change of what it searches appends one `saved_search.updated` that lists what changed, a move appends `saved_search.moved` and takes the earlier events of the search to the new folder, and a change to what the search already has appends nothing.
      A body with none of `title`, `folder_id`, `query`, `filters`, `from` and `to` answers 400.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdateSavedSearchRequest"
    responses:
      "200":
        description: The saved search as it is now.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SavedSearch"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The target is a personal folder (`personal_folder`).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: The title is empty, too long or has control characters (`invalid_saved_search`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: deleteSavedSearch
    x-audit: { action: saved_search.delete, target: { kind: saved_search, id: path.id } }
    x-surfaces:
      cli: [observe saved-searches delete]
    summary: Delete a saved search.
    description: Needs Edit on the saved search. The deletion is recorded as `saved_search.deleted`, which stays in the folder the search was in.
    responses:
      "204":
        description: The saved search is gone.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
