dashboards-id-proposals:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: listProposals
    x-audit: { none: "list read; lists are not recorded", target: { kind: dashboard, id: path.id } }
    x-surfaces:
      mcp: [list_proposals]
      cli: [observe proposals list]
    summary: List the proposals on a dashboard, newest first.
    description: >-
      Needs View on the dashboard.
      A proposal is a change to a dashboard saved by someone who may comment but not edit, or by a connection in propose mode, for a person who can edit to merge or discard.
      The list holds the open proposals unless `state` says otherwise.
    parameters:
      - name: state
        in: query
        schema:
          type: string
          enum: [open, merged, discarded, all]
          default: open
      - name: run_id
        in: query
        description: Only the proposal that the agent request with this id opened, which is how a run finds its proposal however many others the dashboard has; a value that is not a UUID is 400.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of proposals without their documents.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ProposalList"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
proposals-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getProposal
    x-audit: { none: "read; only dashboard, observation and public link views are recorded", target: { kind: proposal, id: path.id } }
    x-surfaces:
      mcp: [get_proposal]
      cli: [observe proposals show]
    summary: Get one proposal with its head revision's document, what it changes and what stops a merge.
    description: >-
      Needs View on the dashboard; a proposal on a dashboard the caller cannot see answers 404.
      `changes` compares the head revision with `base_version`.
      `conflicts` lists, while the proposal is open and behind, the units that the proposal and the newer versions both changed.
    responses:
      "200":
        description: The proposal.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Proposal"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
proposals-id-merge:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: mergeProposal
    x-audit: { action: proposal.merge, target: { kind: proposal, id: path.id } }
    x-surfaces:
      mcp: [merge_proposal]
      cli: [observe proposals merge]
    summary: Save a proposal's head revision as the next version of its dashboard and close it as merged.
    description: >-
      Needs Edit on the dashboard and a connection that is not in propose mode.
      The save runs the same checks as any other save, on top of the dashboard's latest version: a document that does not parse or whose queries fail answers 422.
      When the dashboard has changed the same panels, variables or settings since the proposal's base, the answer is 409 `version_conflict` with `conflicts`, and the same request with a `choices` entry for each of them succeeds.
      A merge whose result equals the latest version saves nothing and closes the proposal with `merged_version` null.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/MergeProposalRequest"
    responses:
      "200":
        description: The merged proposal.
        headers:
          Location:
            description: The version the merge saved; absent when the merge saved nothing.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ProposalSummary"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/ProposalForbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The dashboard has newer versions that changed the same panels, variables or settings (`version_conflict`, with `conflicts`),
          the proposal has a newer revision than the one named (`proposal_changed`),
          or the proposal is no longer open (`invalid_transition`).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the dashboard is a starter the server keeps current with each release (`provisioned`), which a proposal cannot change.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/VersionConflict"
                - $ref: "../openapi.yaml#/components/schemas/ProposalChanged"
                - $ref: "../openapi.yaml#/components/schemas/InvalidTransition"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
proposals-id-discard:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: discardProposal
    x-audit: { action: proposal.discard, target: { kind: proposal, id: path.id } }
    x-surfaces:
      mcp: [discard_proposal]
      cli: [observe proposals discard]
    summary: Close a proposal without saving it.
    description: >-
      The author of the proposal, or anyone who may merge it, may discard it.
      The body is empty or an object with an optional `reason`, trimmed and at most 500 characters (400 `invalid_request` beyond that), which the proposal then shows as `close_reason`; the activity event does not carry it.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason:
                type: string
                maxLength: 500
                description: Why the proposal is discarded.
    responses:
      "200":
        description: The discarded proposal.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ProposalSummary"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/ProposalNotOpen"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
