dashboards-id-comments:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: createDashboardComment
    summary: Comment on a panel or the whole dashboard, or reply to a thread.
    description: >-
      A comment starts a thread or replies to one.
      A thread's first comment is anchored to a version and to a panel id, or to the whole dashboard when `panel_id` is absent or null, and never moves; `panel_present` on responses says whether the latest version still has that panel and is always true for a whole-dashboard comment.
      A reply names its thread's comment in `parent_id` and omits `version` and `panel_id`; it takes both from its thread.
      Replies are one level deep: replying to a reply attaches the new reply to that reply's thread.
      A thread's status lives on its first comment and a reply's `status` mirrors it.
      The body is trimmed first, and the limit of 1 to 4000 characters applies to the trimmed text.
      Control characters other than newline, carriage return and tab, and the bidirectional override and isolate characters (U+202A to U+202E and U+2066 to U+2069), are refused.
      A `comment.created` event with `type`, `dashboard_id`, `comment_id`, `status` and `author`, plus `panel_id` for a comment on a panel and `parent_id` for a reply, goes to the dashboard's event stream.
      A comment queues a revision only when `request_revision` is true and an LLM provider is configured; a reply never requests a revision.
      The comment and the revision are created in one transaction, and the comment's `revision` holds the queued revision.
      When the revision succeeds, the server resolves the thread with `resolved_by_version` set to the saved version, unless it is already resolved.
      With no LLM provider configured, no revision is queued and `revision` stays null.
      At most 5 revisions may be queued or running per dashboard; beyond that the comment is not created.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              request_revision:
                type: boolean
                default: false
                description: Whether to queue an agent revision for the comment, when an agent is configured. A reply cannot request one.
              version:
                type: integer
                nullable: true
                minimum: 1
                maximum: 2147483647
                description: Required unless `parent_id` is set.
              panel_id:
                type: string
                nullable: true
                minLength: 1
                maxLength: 64
                description: The panel to comment on; absent or null means the whole dashboard. Not allowed with `parent_id`.
              parent_id:
                type: string
                nullable: true
                format: uuid
                description: The comment to reply to. Not allowed with `version` or `panel_id`.
              body:
                type: string
    responses:
      "201":
        description: The new comment, open, with the queued revision in `revision` when one was requested.
        headers:
          Location:
            required: true
            description: Identifies the comment resource for `PATCH`; there is no `GET` for a single comment.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CommentEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        description: The dashboard, the version or the comment named by `parent_id` does not exist.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: The panel id does not exist in that version's Spec (`unknown_panel`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "429":
        description: The dashboard already has 5 revisions queued or running (`too_many_revisions`); the comment is not created.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  get:
    operationId: listDashboardComments
    summary: List the comments of a dashboard across all versions, oldest first.
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [open, resolved, all]
          default: all
      - name: panel_id
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of comments.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comments, next_cursor]
              properties:
                comments:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/Comment"
                next_cursor:
                  type: string
                  nullable: true
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-comments-commentid:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: comment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: setDashboardCommentStatus
    summary: Resolve or reopen a comment.
    description: >-
      Setting the status a comment already has answers 200 with the comment unchanged and sends no event.
      A real change sends `comment.updated` with `type`, `dashboard_id`, `comment_id`, `status` and `author` (plus `panel_id` for a comment on a panel), where `author` is the caller who changed the status or, when an agent request resolves the thread, its requester.
      Changing a reply changes its thread and returns the thread's first comment.
      `resolved_by_version` names the version that fixed the thread; it must be at least the version the thread is on (400) and at most the dashboard's latest version (422), it is stored only when the call changes the status to resolved, and reopening clears it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                enum: [open, resolved]
              resolved_by_version:
                type: integer
                minimum: 1
                maximum: 2147483647
    responses:
      "200":
        description: The comment with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CommentEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: "`resolved_by_version` is not a version of this dashboard (`unknown_version`)."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
