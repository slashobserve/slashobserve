datasources-uid-preview:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: previewDraftPanel
    summary: Run an unsaved data panel placed into a saved dashboard version and return its frames.
    description: >-
      The draft replaces the panel `panel_id` of the given version, the result is validated as a whole like a save (the draft must keep the id `panel_id`, and its datasource and every query's must be or resolve to the datasource in the path), and the draft's queries run with the agent tools' limits (15 seconds, 200 series, 100,000 points, 1,000 rows).
      Only signed-in users may call it: a service-account key gets 403 `user_session_required` and uses `query_range` instead.
      Nothing is cached, and the call counts against the caller's 8 in-flight query requests.
      `from`, `to`, `tz`, `max_data_points` and `variables` behave as the parameters of panel data: `from` and `to` default to the version's `time`, `max_data_points` defaults to 1000 and is capped by the draft's `maxDataPoints`,
      and each variable lists its selected values, with `$__all` selecting All; a variable that is not given gets its default.
      Every query runs as a range query unless it sets `instant` or the panel is a table or logs panel.
      A panel's `timeFrom` replaces the range with the last N units up to now, and `timeShift` moves the range back; `meta.from` and `meta.to` report the range that ran.
      The response has the shape of panel data, with `meta.cached` always false.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [dashboard_id, version, panel_id, panel]
            properties:
              dashboard_id:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 1
                maximum: 2147483647
              panel_id:
                type: string
                minLength: 1
                maxLength: 64
              panel:
                type: object
                additionalProperties: true
                description: The draft panel, in the Spec's panel shape.
              from:
                type: string
                minLength: 1
                maxLength: 128
              to:
                type: string
                minLength: 1
                maxLength: 128
              tz:
                type: string
                minLength: 1
                maxLength: 64
                description: The browser's IANA time zone, used as for panel data when the dashboard's `timezone` is `browser`.
              max_data_points:
                type: integer
                minimum: 10
                maximum: 11000
                default: 1000
              variables:
                type: object
                additionalProperties:
                  type: array
                  minItems: 1
                  items:
                    type: string
    responses:
      "200":
        description: The frames the draft's queries returned.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelData"
      "400":
        description: The request is malformed or fails validation, the draft is not a data panel, or its id does not match the request, or its datasource or any query's datasource is not the one in the path.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The caller is not a signed-in user (`user_session_required`), or cannot change the dashboard (`forbidden_role`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: The datasource, dashboard or version does not exist (`not_found`), or the version has no panel `panel_id` (`panel_not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: >-
          The draft fails Spec validation (`invalid_spec` with `issues`), or one of its queries or variables cannot run:
          `query_invalid`, `query_forbidden`, `limit_exceeded` (also for a response over 32 MiB), `unknown_datasource`, `variable_failed`, `variable_empty` or `expression_error` (an expression query failed or one of its inputs did), with the failing query's `ref` when one query failed.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/ValidationError"
                - $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request, including a datasource call that failed without a classified cause.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: A datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the draft's 15 second query timeout, or the request did not finish within 20 seconds; `ref` names the failing query when one query timed out.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
