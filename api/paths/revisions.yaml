dashboards-id-revisions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: listDashboardRevisions
    x-audit: { none: "list read; recorded as run.list with scope dashboard by the service, once per caller and dashboard in 10 minutes", target: { kind: dashboard, id: path.id } }
    x-surfaces:
      cli: [observe dashboards revisions]
    summary: List the agent requests of a dashboard, newest first, including the new-dashboard request that created it.
    description: >-
      A list is recorded in the audit trail as one `run.list` with the dashboard as its target and `scope` `dashboard`, once per caller and dashboard in 10 minutes.
      A run that read data only Admins can query (`restricted`) is left out for anyone who is neither its requester nor an Admin.
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of revisions.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisions, next_cursor]
              properties:
                revisions:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/Revision"
                next_cursor:
                  type: string
                  nullable: true
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
dashboards-id-revisions-revisionid:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: revision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getDashboardRevision
    x-audit: { action: run.view, target: { kind: run, id: path.revision_id } }
    x-surfaces:
      cli: [observe dashboards revisions]
    summary: Read one revision request.
    description: >-
      A read is recorded in the audit trail as `run.view` with the requester's id as `owner_id`, once per reader and request in 10 minutes.
      A run that read data only Admins can query (`restricted`) answers 404 to anyone who is neither its requester nor an Admin.
    responses:
      "200":
        description: The revision with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RevisionEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
