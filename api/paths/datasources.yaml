datasources:
  get:
    operationId: listDatasources
    summary: Report the health and dashboard usage of every configured datasource, never its connection details.
    responses:
      "200":
        description: One status per configured datasource.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DatasourceList"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
