datasources-uid-metrics:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: listDatasourceMetrics
    summary: List the metric names of a datasource, up to a limit.
    description: >-
      The browser's only path to metric names; it never calls a datasource directly.
      It runs the same code, validation and limits as the agent's `list_metrics` tool: a Prometheus datasource lists its metrics with their type and help,
      and a ClickHouse datasource lists the OpenTelemetry metric names of its `otel_metrics_*` tables with the OTel kind as `type` and the table.
      The call takes one of the server's shared upstream slots, waiting at most 5 seconds for one before it answers 429 `too_many_requests` with `Retry-After`, counts against the per-caller in-flight limit, times out after 15 seconds and is never cached.
      Any query parameter not listed below, or one given twice, is a 400.
    parameters:
      - name: search
        in: query
        description: Case-insensitive substring filter.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        description: Maximum names to return.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      "200":
        description: Up to `limit` metrics; `truncated` is true when there were more.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [datasource, metrics, truncated]
              properties:
                datasource:
                  type: string
                metrics:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/MetricName"
                truncated:
                  type: boolean
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/QueryUnprocessable"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        $ref: "../openapi.yaml#/components/responses/QueryBadGateway"
      "504":
        $ref: "../openapi.yaml#/components/responses/QueryTimeout"
datasources-uid-labels:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: listDatasourceLabels
    summary: List the label names of a datasource, or its OpenTelemetry attribute keys on ClickHouse, up to a limit.
    description: >-
      The browser's only path to label names; it never calls a datasource directly.
      It runs the same code, validation and limits as the agent's `list_labels` tool.
      ClickHouse labels need `table` or `metric`: with only `metric` the server uses the first `otel_metrics_*` table that holds it, and answers 404 `not_found` when none does.
      A ClickHouse request with neither is a 400.
      The call takes one of the server's shared upstream slots, waiting at most 5 seconds for one before it answers 429 `too_many_requests` with `Retry-After`, counts against the per-caller in-flight limit, times out after 15 seconds and is never cached.
      Any query parameter not listed below, or one given twice, is a 400.
    parameters:
      - name: metric
        in: query
        description: Only names seen on this metric. On ClickHouse it also finds the metric's table when `table` is not given.
        schema:
          type: string
          maxLength: 256
      - name: table
        in: query
        description: ClickHouse table such as `otel_logs`; Prometheus ignores it.
        schema:
          type: string
          maxLength: 256
      - name: search
        in: query
        description: Case-insensitive substring filter.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        description: Maximum names to return.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      "200":
        description: Up to `limit` label names; `truncated` is true when there were more.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [datasource, labels, truncated]
              properties:
                datasource:
                  type: string
                labels:
                  type: array
                  items:
                    type: string
                truncated:
                  type: boolean
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/QueryUnprocessable"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        $ref: "../openapi.yaml#/components/responses/QueryBadGateway"
      "504":
        $ref: "../openapi.yaml#/components/responses/QueryTimeout"
datasources-uid-labels-name-values:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
    - name: name
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
  get:
    operationId: listDatasourceLabelValues
    summary: List the values of one label of a datasource, up to a limit.
    description: >-
      The browser's only path to label values; it never calls a datasource directly.
      It runs the same code, validation and limits as the agent's `list_label_values` tool.
      ClickHouse labels need `table` or `metric`, as for the label names operation, and a malformed label name is a 422 `query_invalid`.
      The call takes one of the server's shared upstream slots, waiting at most 5 seconds for one before it answers 429 `too_many_requests` with `Retry-After`, counts against the per-caller in-flight limit, times out after 15 seconds and is never cached.
      Any query parameter not listed below, or one given twice, is a 400.
    parameters:
      - name: metric
        in: query
        description: Only names seen on this metric. On ClickHouse it also finds the metric's table when `table` is not given.
        schema:
          type: string
          maxLength: 256
      - name: table
        in: query
        description: ClickHouse table such as `otel_logs`; Prometheus ignores it.
        schema:
          type: string
          maxLength: 256
      - name: search
        in: query
        description: Case-insensitive substring filter.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        description: Maximum names to return.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      "200":
        description: Up to `limit` values of the label; `truncated` is true when there were more.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [datasource, label, values, truncated]
              properties:
                datasource:
                  type: string
                label:
                  type: string
                values:
                  type: array
                  items:
                    type: string
                truncated:
                  type: boolean
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/QueryUnprocessable"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        $ref: "../openapi.yaml#/components/responses/QueryBadGateway"
      "504":
        $ref: "../openapi.yaml#/components/responses/QueryTimeout"
