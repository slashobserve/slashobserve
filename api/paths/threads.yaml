threads:
  get:
    operationId: listThreads
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_comments]
      cli: [observe comments list]
    summary: List the comment threads on a dashboard, an annotation, an observation or a proposal.
    description: >-
      Pages through the messages of the target's threads, oldest first, and returns each message with the thread it belongs to.
      `limit` counts messages, so a thread can continue on the next page; `threads` holds only the threads that appear on this page.
      `can_comment` says whether the caller may start threads and write messages on the target.
      Reading needs View on the target: a dashboard follows its folder, an annotation on a dashboard follows that dashboard, a global annotation follows the General folder, an observation follows the folder it is in, and a proposal follows its dashboard.
      A target the caller cannot see answers 404, never 403.
    parameters:
      - name: target
        in: query
        required: true
        description: "The object to read, as `<kind>:<id>` with kind `dashboard`, `annotation`, `observation` or `proposal`."
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum: [open, resolved, all]
          default: all
      - name: panel_id
        in: query
        description: Only threads on this panel; dashboards only.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of messages with their threads.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadPage"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        description: "`target` is not `<kind>:<id>` (`invalid_target`), `status` is not open, resolved or all (`invalid_status`), or `panel_id` is not a panel id (`invalid_panel_id`)."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: openThread
    x-audit: { action: thread.open, target: { kind: thread } }
    x-surfaces:
      mcp: [create_comment]
      cli: [observe comments add]
    summary: Start a thread on a dashboard, an annotation, an observation or a proposal.
    description: >-
      The first message of a thread has the id of the thread, so either id names it.
      A dashboard thread is anchored to a version, the latest when `version` is absent, and to a panel of that version, or to the whole dashboard when `panel_id` is absent; the anchor never moves.
      `version` and `panel_id` are refused on an annotation or an observation.
      `block_id` anchors the first message to one block of an observation; absent or null means the whole observation.
      It is refused on a dashboard, an annotation or a proposal, and must name a block of this observation, with 422 `invalid_block` otherwise.
      Deleting the block keeps the message, now about the whole observation.
      `anchor` points the thread at one spot of a dashboard panel or, with `block_id`, of an observation block, and is refused on an annotation or a proposal (422 `invalid_target`) or when its kind lacks a field it needs (422 `invalid_anchor`).
      `block_id` with an anchor sets the thread's block; without an anchor it keeps its message meaning, the block the first message is about.
      `block_id` with an anchor of a kind that cannot sit on a block, `variable`, answers 422 `invalid_anchor` naming both fields.
      An observation has one page thread, its discussion, and any number of anchored threads; starting a second page thread adds the message to the first.
      The body is trimmed first, and the limit of 1 to 4000 characters applies to the trimmed text.
      Control characters other than newline, carriage return and tab, and the bidirectional override and isolate characters (U+202A to U+202E and U+2066 to U+2069), are refused, and so is text with no visible character, such as only zero-width characters (400 or 422 with a `reason`, see `docs/reference/text-rules.md`).
      Mention a person with `@[Name](user:<id>)`, the built-in agent with `@observe`, one of your own connected agents with `@[Name](grant:<grant id>)` and a service account that takes runs with `@[Name](service_account:<id>)`, at most 20 mentions in a message, a repeated mention counting each time (422 `too_many_mentions`).
      A grant that is not yours, revoked or expired, a service account that takes no runs, and a person who does not exist or cannot see the target all answer 422 `invalid_mention`; a service-account key may mention `@observe` and service accounts, never a grant.
      A mention is recorded, shows in the activity log, and a mentioned person gets it in their Inbox.
      `to` decides who the message is for.
      Absent, a message that mentions one agent asks it, a message that mentions a person asks no agent, and any other message asks the thread's agent unless it is off.
      `agent` asks the agent it mentions, else the thread's agent, else `@observe`; `everyone` asks no agent and turns the thread's agent off.
      The agent a message asks becomes the thread's agent, so later plain replies ask it too.
      More than one agent in a message answers 422 `too_many_agents` and writes nothing, whatever `to` says.
      The agent asked gets one run in the same transaction as the message, with the message's text as the prompt (the agent's token removed) and the earlier messages of the thread, the last 20 and at most 8000 characters, as its context.
      A dashboard thread starts a `comment` run on the thread's version and panel, which a Commenter may start and which ends in a proposal when the person cannot edit; an observation thread starts a read-only `investigate` run about the observation, which needs Comment on it, has no per-person cap and answers in the thread without writing on the page.
      An annotation or a proposal thread starts no run.
      A run that cannot start never fails the message: the message is stored and `message.run_refusal` says why, as `mention_target_unsupported`, `agent_unavailable` (`@observe` without a model provider, or a thread agent that was disconnected, which is then cleared), `agent_not_yours` (the thread's agent is someone else's connected agent), `forbidden_role` or `too_many_runs`.
      A started run is in `message.run`, and `to` in the answer says how the message was delivered.
      `client_id` is a UUID the caller makes for the message; sending it again answers 200 with the message already posted, `replayed: true`, the same `message.run` or `message.run_refusal` as the first time and no new run, and reusing it on another target answers 422 `client_id_reused`.
      The thread is recorded as a `thread.opened` activity event, and a dashboard thread also sends `comment.created` to the dashboard's event stream; a change of the thread's agent is audited as `thread.agent_set`.
      Writing needs Comment on the target; a caller who can see it but not comment gets 403.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [target, body]
            properties:
              target:
                type: string
                description: "The object to comment on, as `<kind>:<id>` with kind `dashboard`, `annotation`, `observation` or `proposal`."
              version:
                type: integer
                nullable: true
                minimum: 1
                maximum: 2147483647
                description: The dashboard version to anchor to; the latest when absent. Dashboards only.
              panel_id:
                type: string
                nullable: true
                minLength: 1
                maxLength: 64
                description: The panel to comment on; absent or null means the whole object. Dashboards only.
              block_id:
                type: string
                format: uuid
                nullable: true
                description: "Observations only. With `anchor` it sets the thread's block, the block the anchor sits on; without `anchor` it keeps its message meaning, the block this first message is about. Absent or null means the whole observation. With an `anchor` of kind `variable`, which cannot sit on a block, it answers 422 `invalid_anchor`."
              anchor:
                nullable: true
                allOf:
                  - $ref: "../openapi.yaml#/components/schemas/Anchor"
                description: The spot the thread points at; absent or null for the whole dashboard, panel or observation. Dashboards and observations only.
              body:
                type: string
              to:
                type: string
                enum: [agent, everyone]
                description: Who the message is for; absent decides from the mentions and the thread's agent.
              client_id:
                type: string
                format: uuid
                nullable: true
                description: A UUID the caller makes for this message, so a resend returns the message already posted.
              time_zone:
                type: string
                maxLength: 64
                description: The IANA time zone the person reads times in, such as `Asia/Kolkata`; a run this message starts writes its times in it, labelled. Without it, with `UTC`, or with a zone the server does not know, they are UTC; the message is posted either way.
    responses:
      "200":
        description: The message `client_id` names was already posted; it is returned as it was, with `replayed` true and the `message.run` or `message.run_refusal` it was first answered with.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadSent"
      "201":
        description: The thread and its first message, or the observation's page thread and the new message, with `message.run` or `message.run_refusal` when the message asked an agent.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadSent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-messages:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: replyToThread
    x-audit: { action: thread.message, target: { kind: thread, id: path.thread_id } }
    x-surfaces:
      mcp: [reply_to_comment]
      cli: [observe comments reply]
    summary: Add a message to a thread.
    description: >-
      The path takes the thread's id or the id of any of its messages.
      A reply never reopens a resolved thread.
      The body rules, the mention syntax, `to`, `client_id` and the 4000 character limit are those of starting a thread; a run started from a reply is given the thread's earlier messages as context.
      The reply is recorded as a `thread.replied` activity event, and on a dashboard thread it sends `comment.created` to the dashboard's event stream.
      `block_id` anchors the reply to one block of the thread's observation, as when starting a thread, and is refused on any other target with 422 `invalid_block`.
      `reply_to_id` names a message of this thread that the reply answers, and the message then carries it as `reply_to`; any other id answers 422 `invalid_reply_to`.
      Editing a message changes neither.
      Writing needs Comment on the thread's target.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body:
                type: string
              block_id:
                type: string
                format: uuid
                nullable: true
                description: The block of the observation the reply is about; absent or null means the whole observation. Observations only.
              reply_to_id:
                type: string
                format: uuid
                nullable: true
                description: A message of this thread the reply answers.
              to:
                type: string
                enum: [agent, everyone]
                description: Who the message is for; absent decides from the mentions and the thread's agent.
              client_id:
                type: string
                format: uuid
                nullable: true
                description: A UUID the caller makes for this message, so a resend returns the message already posted.
              time_zone:
                type: string
                maxLength: 64
                description: The IANA time zone the person reads times in, such as `Asia/Kolkata`; a run this message starts writes its times in it, labelled. Without it, with `UTC`, or with a zone the server does not know, they are UTC; the message is posted either way.
    responses:
      "200":
        description: The message `client_id` names was already posted; it is returned as it was, with `replayed` true and the `message.run` or `message.run_refusal` it was first answered with.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadSent"
      "201":
        description: The thread and the new message, with `message.run` or `message.run_refusal` when the message asked an agent.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadSent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-resolve:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: resolveThread
    x-audit: { action: thread.resolve, target: { kind: thread, id: path.thread_id } }
    x-surfaces:
      mcp: [resolve_comment]
      cli: [observe comments resolve]
    summary: Resolve a thread.
    description: >-
      The path takes the thread's id or the id of any of its messages.
      The body is optional.
      `version` names the dashboard version that fixed the thread; it must be at least the version the thread is on (422 `invalid_version`) and at most the dashboard's latest version (422 `unknown_version`), and it is refused on a finding or an annotation.
      Resolving a thread that is already resolved answers 200 with the thread unchanged and records nothing.
      A real change is recorded as a `thread.resolved` activity event, and on a dashboard thread it sends `comment.updated` to the dashboard's event stream.
      Needs Comment on the thread's target, and a caller with only Comment resolves only a thread they started: for anyone else it answers 403 `not_starter`, and a caller who can edit resolves any thread.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              version:
                type: integer
                minimum: 1
                maximum: 2147483647
    responses:
      "200":
        description: The thread with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-reopen:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: reopenThread
    x-audit: { action: thread.reopen, target: { kind: thread, id: path.thread_id } }
    x-surfaces:
      mcp: [reopen_comment]
      cli: [observe comments reopen]
    summary: Reopen a resolved thread.
    description: >-
      The path takes the thread's id or the id of any of its messages, and the request has no body.
      Reopening clears who resolved the thread and the version that fixed it.
      Reopening a thread that is already open answers 200 with the thread unchanged and records nothing.
      A real change is recorded as a `thread.reopened` activity event, and on a dashboard thread it sends `comment.updated` to the dashboard's event stream.
      Needs Comment on the thread's target.
    responses:
      "200":
        description: The thread with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-read:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: markThreadRead
    x-audit: { none: "read position of the caller's own inbox", target: { kind: thread, id: path.thread_id } }
    summary: Mark a thread read for the caller.
    description: >-
      Clears the thread's `unread` for the caller until someone else writes in it again.
      The web app calls it when a person opens a thread, and a reply by the caller marks the thread read too.
      Needs View on the thread's target.
      Only signed-in people may call it: a service-account key gets 403 `forbidden`, and the CLI and MCP have no equivalent because read state belongs to the person.
    responses:
      "204":
        description: The thread is read.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-share:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  delete:
    operationId: withdrawSharedAnswer
    x-audit: { action: run.withdraw, target: { kind: run } }
    x-surfaces:
      cli: [observe comments withdraw]
    summary: Withdraw a shared answer back to only you.
    description: >-
      Undoes `POST /observe/{id}/share` for the caller's own private questions shared in this thread and makes each of those runs a private question again, read only by its requester and Admins.
      When a share opened the thread, the whole thread is deleted; otherwise only the shared questions and the answers posted under them are, and the thread keeps its other messages.
      It is allowed only to the person who asked, while every message in the thread is theirs or their run's reply; once someone else wrote in it, the answer stays shared (`others_wrote`).
      On an observation the run's answer leaves the observation, so it is no longer read or listed through it, but the answer's text that the share wrote onto the page stays there as page content; the observation's editors remove those blocks like any other block.
      The run can be shared again afterwards, which opens a new thread.
      Each withdrawn run is recorded as `run.withdraw`, and each deletion, of the thread or of a message, as a `thread.deleted` activity event.
      Needs View on the thread's target; someone who cannot view it, or who has no answer shared in it, gets 404.
      It is a delete, so no MCP tool reaches it.
    responses:
      "204":
        description: The shares are deleted and their answers are private again.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: Someone other than the asker wrote in the thread, so the answer stays shared (`others_wrote`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-apply:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: applySuggestedChange
    x-audit: { action: finding.apply, target: { kind: finding } }
    x-surfaces:
      mcp: [apply_suggested_change]
      cli: [observe comments apply]
    summary: Ask the agent to make the change an answer in this thread suggests.
    description: >-
      An answer to a question about a dashboard may carry `suggested_change`, one sentence on the change the person asked for or the nearest safe one; the question's run never changes the dashboard itself.
      This posts the message "Revise the dashboard: <suggested change>" in the thread as the caller and starts a run that revises the dashboard, with the suggested change as its prompt and the thread's earlier messages as context, so the thread shows who asked for the change.
      The run is the caller's and goes to the agent that wrote the answer; it saves a new version when the caller can edit the dashboard, and opens a proposal for someone who can edit to merge when the caller can only comment.
      `finding_id` must be the answer of a run asked in this thread, on a dashboard; any other id answers 404, and an answer with no suggested change answers 422 `no_suggested_change`.
      A second call for the same answer while its run is queued or running, or after it succeeded, posts nothing and returns the first message and run with `replayed` true; after that run failed or was canceled, a call starts a new one.
      The run counts against the dashboard's limit of 5 waiting or running revisions (429 `too_many_revisions`), needs the model provider for the built-in agent (503 `agent_unavailable`), and refuses with 409 `assignee_unavailable` when the connected agent that answered is not the caller's live agent or the service account no longer takes runs.
      It is recorded as `finding.apply` and the message as a `thread.replied` activity event.
      Needs Comment on the dashboard.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [finding_id]
            properties:
              finding_id:
                type: string
                format: uuid
                description: The answer whose suggested change to apply, the `id` of the run's finding.
    responses:
      "200":
        description: The answer's change is already being applied or was applied; the first message and its run are returned with `replayed` true.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadSent"
      "201":
        description: The thread, the new message and its run in `message.run`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadSent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The connected agent or service account that answered cannot take the run (`assignee_unavailable`), the change is being applied by a run that could not be read back (`already_applied`), or the dashboard is a starter the server keeps current with each release (`provisioned`).
          Or the run that wrote the answer read data only Admins can query, such as the audit trail, and the dashboard is not in a folder only Admins can read (`restricted_answer`, saying why).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: The thread is not on a dashboard (`invalid_thread`), or the answer suggests no change (`no_suggested_change`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "429":
        description: The dashboard already has its limit of waiting or running revisions (`too_many_revisions`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: The built-in agent answered and the server has no model provider (`agent_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
threads-mentionable:
  get:
    operationId: listMentionablePeople
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_mentionable_people]
      cli: [observe comments people]
    summary: List the people who can be mentioned on a target.
    description: >-
      Returns the people, other than the caller, who can see the target and whose name or email contains `q`, ordered by name, at most `limit` of them, with `more` true when others match too.
      Seeing follows the target's folder, so a person without access to it is never listed, and mentioning one answers 422 `invalid_mention`.
      A person you mention appears in their Inbox as a `mention`.
      The caller must be able to comment on the target: a viewer gets 403 `forbidden_role`, and a target the caller cannot see answers 404, never 403.
    parameters:
      - name: target
        in: query
        required: true
        description: "The object the comment is on, as `<kind>:<id>` with kind `dashboard`, `annotation`, `observation` or `proposal`."
        schema:
          type: string
      - name: q
        in: query
        description: Text to look for in the name or the email, ignoring case. Empty lists the first people by name.
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
    responses:
      "200":
        description: The people, possibly none.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/MentionablePeople"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        description: "`target` is not `<kind>:<id>` (`invalid_target`)."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
messages-messageid:
  parameters:
    - name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: editMessage
    x-audit: { action: thread.message_edit, target: { kind: message, id: path.message_id } }
    x-surfaces:
      mcp: [edit_comment]
      cli: [observe comments edit]
    summary: Edit the body of your own message.
    description: >-
      Only the message's author may edit it, and only while the author can still comment on the thread's target; another caller who can see the thread gets 403 `not_author`.
      A reply written by an agent run is never editable, not even by the person who requested the run, and answers 403 `not_author` too.
      The body rules, the mention syntax and the 4000 character limit are those of starting a thread, and the mentions are recorded again from the new body; an edit never starts a run.
      Sending the body the message already has answers 200 and changes nothing.
      A real edit sets `edited_at`, is recorded as a `thread.edited` activity event, and on a dashboard thread sends `comment.updated` naming the edited message to the dashboard's event stream.
      An edit never records a mention event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body:
                type: string
    responses:
      "200":
        description: The thread and the message with its current body.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadMessageEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The caller is not the author (`not_author`), or can no longer comment on the target (`forbidden_role`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: deleteMessage
    x-audit: { action: thread.message_delete, target: { kind: message, id: path.message_id } }
    x-surfaces:
      cli: [observe comments delete]
    summary: Delete a message from a thread.
    description: >-
      The message's author may delete it while they can still comment on the thread's target, and anyone who manages the target's folder may delete any message, including a reply an agent run wrote.
      A reply an agent run wrote is never deletable by the person who requested the run unless they manage the folder.
      Deleting the first message of a thread deletes the whole thread with its replies and mentions, so its author may do that only while nobody else has written in the thread.
      Everyone else who can see the thread gets 403 `not_author`.
      The deletion is recorded as a `thread.deleted` activity event naming the message, and on a dashboard thread it sends `comment.updated` naming the thread to the dashboard's event stream.
      A reply that quoted the message keeps its text and shows no quote.
      An agent run that was started from the message still finishes, and its reply is dropped when the thread is gone.
      No MCP tool deletes anything, so an agent cannot call this.
    responses:
      "204":
        description: The message, or the whole thread when it was the first message, is deleted.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The caller may not delete this message (`not_author`), or can no longer comment on the target (`forbidden_role`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
