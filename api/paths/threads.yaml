threads:
  get:
    operationId: listThreads
    summary: List the comment threads on a dashboard, a finding or an annotation.
    description: >-
      Pages through the messages of the target's threads, oldest first, and returns each message with the thread it belongs to.
      `limit` counts messages, so a thread can continue on the next page; `threads` holds only the threads that appear on this page.
      `can_comment` says whether the caller may start threads and write messages on the target.
      Reading needs View on the target: a dashboard follows its folder, a finding or annotation on a dashboard follows that dashboard, a global annotation follows the General folder, and a finding without a dashboard is visible to its creator and to Admins.
      A target the caller cannot see answers 404, never 403.
    parameters:
      - name: target
        in: query
        required: true
        description: "The object to read, as `<kind>:<id>` with kind `dashboard`, `finding` or `annotation`."
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum: [open, resolved, all]
          default: all
      - name: panel_id
        in: query
        description: Only threads on this panel; dashboards only.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: One page of messages with their threads.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadPage"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        description: "`target` is not `<kind>:<id>` (`invalid_target`), `status` is not open, resolved or all (`invalid_status`), or `panel_id` is not a panel id (`invalid_panel_id`)."
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  post:
    operationId: openThread
    summary: Start a thread on a dashboard, a finding or an annotation.
    description: >-
      The first message of a thread has the id of the thread, so either id names it.
      A dashboard thread is anchored to a version, the latest when `version` is absent, and to a panel of that version, or to the whole dashboard when `panel_id` is absent; the anchor never moves.
      `version` and `panel_id` are refused on a finding or an annotation.
      The body is trimmed first, and the limit of 1 to 4000 characters applies to the trimmed text.
      Control characters other than newline, carriage return and tab, and the bidirectional override and isolate characters (U+202A to U+202E and U+2066 to U+2069), are refused.
      Mention a person with `@[Name](user:<id>)` and the built-in agent with `@observe`, at most 20 mentions in a message.
      A mention is recorded and shows in the activity log; it starts no agent run and notifies no one.
      The thread is recorded as a `thread.opened` activity event, and a dashboard thread also sends `comment.created` to the dashboard's event stream.
      A thread never queues an agent revision; send a comment with `request_revision` to a dashboard for that.
      Writing needs Comment on the target; a caller who can see it but not comment gets 403.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [target, body]
            properties:
              target:
                type: string
                description: "The object to comment on, as `<kind>:<id>` with kind `dashboard`, `finding` or `annotation`."
              version:
                type: integer
                nullable: true
                minimum: 1
                maximum: 2147483647
                description: The dashboard version to anchor to; the latest when absent. Dashboards only.
              panel_id:
                type: string
                nullable: true
                minLength: 1
                maxLength: 64
                description: The panel to comment on; absent or null means the whole object. Dashboards only.
              body:
                type: string
    responses:
      "201":
        description: The new open thread and its first message.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadMessageEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-messages:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: replyToThread
    summary: Add a message to a thread.
    description: >-
      The path takes the thread's id or the id of any of its messages.
      A reply never reopens a resolved thread.
      The body rules, the mention syntax and the 4000 character limit are those of starting a thread.
      The reply is recorded as a `thread.replied` activity event, and on a dashboard thread it sends `comment.created` to the dashboard's event stream.
      Writing needs Comment on the thread's target.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body:
                type: string
    responses:
      "201":
        description: The thread and the new message.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadMessageEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-resolve:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: resolveThread
    summary: Resolve a thread.
    description: >-
      The path takes the thread's id or the id of any of its messages.
      The body is optional.
      `version` names the dashboard version that fixed the thread; it must be at least the version the thread is on (422 `invalid_version`) and at most the dashboard's latest version (422 `unknown_version`), and it is refused on a finding or an annotation.
      Resolving a thread that is already resolved answers 200 with the thread unchanged and records nothing.
      A real change is recorded as a `thread.resolved` activity event, and on a dashboard thread it sends `comment.updated` to the dashboard's event stream.
      Needs Comment on the thread's target.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              version:
                type: integer
                minimum: 1
                maximum: 2147483647
    responses:
      "200":
        description: The thread with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
threads-threadid-reopen:
  parameters:
    - name: thread_id
      in: path
      required: true
      description: The thread's id, or the id of any of its messages.
      schema:
        type: string
        format: uuid
  post:
    operationId: reopenThread
    summary: Reopen a resolved thread.
    description: >-
      The path takes the thread's id or the id of any of its messages, and the request has no body.
      Reopening clears who resolved the thread and the version that fixed it.
      Reopening a thread that is already open answers 200 with the thread unchanged and records nothing.
      A real change is recorded as a `thread.reopened` activity event, and on a dashboard thread it sends `comment.updated` to the dashboard's event stream.
      Needs Comment on the thread's target.
    responses:
      "200":
        description: The thread with its current status.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
messages-messageid:
  parameters:
    - name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: editMessage
    summary: Edit the body of your own message.
    description: >-
      Only the message's author may edit it, and only while the author can still comment on the thread's target; another caller who can see the thread gets 403 `not_author`.
      The body rules, the mention syntax and the 4000 character limit are those of starting a thread, and the mentions are recorded again from the new body.
      Sending the body the message already has answers 200 and changes nothing.
      A real edit sets `edited_at`, is recorded as a `thread.edited` activity event, and on a dashboard thread sends `comment.updated` naming the edited message to the dashboard's event stream.
      An edit never records a mention event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body:
                type: string
    responses:
      "200":
        description: The thread and the message with its current body.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ThreadMessageEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The caller is not the author (`not_author`), or can no longer comment on the target (`forbidden_role`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ThreadRefused"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
