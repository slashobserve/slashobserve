dashboards-id-events:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: streamDashboardEvents
    summary: Stream live events for one dashboard as Server-Sent Events.
    description: >-
      The stream starts with `retry: 3000` and an `event: ready` whose data is `{"dashboard_id","latest_version"}`.
      After that each frame is `event: <type>` with the event JSON as data: `version.created` carries `type`, `dashboard_id`, `version`, `parent_version`, `restored_from` (only when the version is a restore), `summary`, `author` and `created_at`.
      `comment.created` and `comment.updated` carry `type`, `dashboard_id`, `comment_id`, `status` and `author`, plus `panel_id` for a comment on a panel and `parent_id` for a reply, never the comment text.
      `comment.updated` names the thread's first comment.
      `revision.updated` is sent on every status change of a revision and carries `type`, `dashboard_id`, `revision_id`, `status`, `version` (the saved version, once the status is `succeeded`) and `comment_id` (for a revision requested by a comment); the saved version's `version.created` arrives before the `revision.updated` whose status is `succeeded`, and clients must not depend on the order between the two.
      `event: resync` with data `{"dashboard_id"}` means events may have been missed.
      A `: ping` comment arrives every 15 seconds, and the server ends the stream after 30 minutes.
      Clients refetch stale data on every `ready` and `resync`; events are never replayed, so `Last-Event-ID` is ignored.
      A caller may hold 20 streams and the process 1000.
    responses:
      "200":
        description: An open `text/event-stream`.
        content:
          text/event-stream:
            schema:
              type: string
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "429":
        description: The caller already holds the maximum number of open streams (`too_many_streams`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: The process holds the maximum number of open streams (`too_many_streams`) or is shutting down (`shutting_down`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
