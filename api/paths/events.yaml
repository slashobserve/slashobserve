dashboards-id-events:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: streamDashboardEvents
    x-audit: { none: "event stream; each change it carries is recorded where it is made", target: { kind: dashboard, id: path.id } }
    summary: Stream live events for one dashboard as Server-Sent Events.
    description: >-
      The stream starts with `retry: 3000` and an `event: ready` whose data is `{"dashboard_id","latest_version"}`.
      After that each frame is `event: <type>` with the event JSON as data: `version.created` carries `type`, `dashboard_id`, `version`, `parent_version`, `restored_from` (only when the version is a restore), `summary`, `author` and `created_at`.
      `comment.created` and `comment.updated` carry `type`, `dashboard_id`, `comment_id`, `status` and `author`, plus `panel_id` for a comment on a panel and `parent_id` for a reply, never the comment text.
      `comment.updated` names the thread's first comment when a thread is resolved or reopened, and the edited message, with `parent_id` when it is a reply, when a message is edited.
      `revision.updated` is sent on every status change of a revision and carries `type`, `dashboard_id`, `revision_id`, `status`, `version` (the saved version, once the status is `succeeded`) `comment_id` (for a revision requested by a comment) and `build_saves` (the number of saves in the revision's build, only while the status is `running` and the revision is building a new version of an existing dashboard); the saved version's `version.created` arrives before the `revision.updated` whose status is `succeeded`, and clients must not depend on the order between the two.
      `proposal.updated` is sent when a proposal on the dashboard is opened, gets a revision, is merged or is discarded, and carries `type`, `dashboard_id`, `proposal_id`, `status` (`open`, `merged` or `discarded`) and `author`, never the proposal's text.
      `dashboard.deleted` is sent once when the dashboard is deleted and carries `type`, `dashboard_id` and `author` (who deleted it), never the title; the stream ends at its next ping.
      `dashboard.moved` is sent when the dashboard moves to another folder and carries `type`, `dashboard_id` and `author` (who moved it), never a folder; access is checked again before it is sent, and a caller who lost access with the move, or whose access cannot be checked then, gets no event and sees the stream end with `closed`.
      `role.changed` is sent when the caller's own role changes while the stream is open, checked every 5 seconds, and carries `dashboard_id` and the new `role`; the caller's other requests are judged by the new role at once.
      `event: resync` with data `{"dashboard_id"}` means events may have been missed.
      A `: ping` comment arrives every 15 seconds, and the server ends the stream after 30 minutes.
      Before the server ends the stream it sends one last `event: closed` whose data is `{"reason"}`: `lifetime` after the 30 minutes, `access_lost` when the caller's credential or view access is gone or the dashboard was deleted, `check_failed` when the credential or the access could not be checked twice in a row or at a move, `slow_subscriber` when the client read too slowly to keep up with the dashboard's events, and `stopping` when the server stops.
      A client reconnects at once after `lifetime`, stops after `access_lost`, and reconnects after a delay for every other reason, one it does not know included; `closed` has no `id`, and a stream that the client or the network ends carries none.
      Clients refetch stale data on every `ready` and `resync`; events are never replayed, so `Last-Event-ID` is ignored.
      A caller may hold 20 streams and the process 1000.
    responses:
      "200":
        description: An open `text/event-stream`.
        content:
          text/event-stream:
            schema:
              type: string
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "429":
        description: The caller already holds the maximum number of open streams (`too_many_streams` with `reason` `per_caller`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: The process holds the maximum number of open streams (`too_many_streams` with `reason` `server_capacity`) or is shutting down (`shutting_down`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
