activity:
  get:
    operationId: listActivity
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_activity]
      cli: [observe activity]
    summary: List workspace activity, newest first.
    description: >-
      Lists the activity log: one event for every dashboard create, save, restore, move and delete, every annotation, finding and saved search created, changed or moved, every dashboard proposal opened, updated, merged or discarded, every comment thread opened, answered, edited, resolved or reopened and every mention in one, and every agent run that is queued, started or settled.
      Events are ordered by their position in the log, newest first, and `seq` is the id of an event.
      A caller sees an event only when it belongs to a folder the caller can view, when it belongs to no folder and the caller acted, or when it belongs to no folder and the caller is an Admin.
      A global annotation belongs to General, so everyone who can read global annotations sees its events.
      An event moves with its dashboard: after a dashboard is moved, its earlier events show only to the viewers of the new folder.
      Events of a deleted dashboard stay in the folder the dashboard was in.
      `data` holds ids, numbers, enums, titles and the version summary, never prompt, comment, annotation or finding text, query text or Spec JSON; read the object through its own endpoint for more.
      The fields of `data` by type:
      `dashboard.created`, `dashboard.version_created` and `dashboard.restored` carry `version`, `title`, `summary`, `parent_version` (not on a create) and `restored_from` (only on a restore);
      `dashboard.moved` carries `title`, `from_folder_id` and `to_folder_id`;
      `dashboard.deleted` carries `title`;
      `annotation.created` carries `title` (the first 80 characters of the text on one line, empty when the text has no characters to show), `tags`, `panel_id` and `time_to` when set, and `time_from`; `annotation.updated` carries `tags`; `annotation.deleted` carries the same fields as `annotation.created`, never more of the text than the `title`;
      `public_link.created` and `public_link.revoked` carry `object` (`kind`, `dashboard` or `observation`, and `id`), `title`, `prefix` and `expires_at` when set, never the token;
      `access_request.opened` carries `object` (`kind`, `dashboard` or `observation`, and `id`) and `title`, never the note, and its actor is the requester; `access_request.granted` carries `object`, `title` and `requested_by` (`kind`, `id` and `name`), and its actor is whoever changed the access that let the requester comment;
      `finding.created` carries `title` and `agent_request_id` when the agent saved it; `finding.pinned` carries `annotation_id`; `finding.moved` carries `title`, `from_folder_id` (null when it was in no folder) and `to_folder_id`;
      `saved_search.created`, `saved_search.updated` and `saved_search.deleted` carry `title` and `kind`, `saved_search.updated` also `changed`, the parts that changed out of `title`, `query`, `filters` and `range` (absent on an event from before it was recorded, which was always a rename), and `saved_search.moved` also `from_folder_id` and `to_folder_id`;
      `observation.created`, `observation.resolved`, `observation.reopened` and `observation.deleted` carry `title`; `observation.updated` carries `title` and, when the title changed, `from_title`, the title before; `observation.moved` carries `title`, `from_folder_id` and `to_folder_id`; `observation.published` and `observation.rca_withdrawn` carry `title` and `revision`; `observation.block_added`, `observation.block_updated`, `observation.block_kept`, `observation.block_discarded` and `observation.block_removed` carry `title`, `block_id` and `block_kind`, and `observation.block_added` also carries the block's `state` (`live` or `requested`);
      `proposal.opened` and `proposal.updated` carry `title`, `revision` and `base_version`; `proposal.merged` carries `title`, `revision` and `version` (null when the change was already in the dashboard and no version was saved); `proposal.discarded` carries `title` and `revision`;
      `run.queued` carries `intent` and `continues_id` when the run continues another; `run.started` carries `intent` and `attempt`; `run.succeeded` carries `intent` and `result_version` when a version was saved, and, for a health repair that saved a version, also `dashboard_title` and `panels_repaired`, the number of panels the repair prompt named whose queries the saved version changed and no longer lists as unverified; `run.failed` carries `intent` and `failure_code`; `run.canceled` carries `intent`; `run.canceling` carries `intent`; `run.released` carries `intent` and `attempt`; `run.kept` carries `intent` and `result_version`; `run.succeeded`, `run.failed` and `run.canceled` also carry `cost_usd`, the run's estimated cost in USD, when it is known.
      `thread.opened` carries `object` (`kind` and `id` of the dashboard, finding, annotation, observation or proposal it is on), `title` (the dashboard or observation title at that time, empty when there is none) and, on a dashboard, `version` and `panel_id` when set; `thread.replied`, `thread.edited` and `thread.deleted` carry `object` and `message_id`, and `thread.deleted` names the thread's first message when the whole thread was deleted; `thread.resolved` carries `object` and `resolved_by_version` when set; `thread.reopened` carries `object`; `thread.mentioned` carries `object`, `message_id` and `mentioned` (`kind`, `id` and `name`).
      Administrative events have no folder and only an Admin reader sees them, in the list, the stream and webhooks, whatever their actor's role is now.
      `user.role_changed` carries `name`, `from_role`, `to_role`, `manual`, false when an override was cleared, and `source` (`admin_emails`, `first_user`, `group` or `default`) when the sign-in policy changed the role and no Admin did; `user.signed_out_everywhere` and `user.deactivated` carry `name`, `sessions` and `grants`; `user.reactivated` and `user.removed` carry `name`; `user.invited` carries `email` and `role`, `user.invite_updated` carries `email` and `role` as `{from, to}`, and `user.invite_withdrawn` carries `email`, and the target id of these three is the invite;
      `service_account.created` carries `name`, `role` and `takes_runs`; `service_account.updated` carries `name` and `role` or `takes_runs` as `{from, to}`; `service_account.deleted` carries `name`; `service_account.key_created` and `service_account.key_revoked` carry `name`, `key_id`, `key_name` and, on create, `expires_at`, never the key;
      `webhook.created`, `webhook.updated`, `webhook.secret_rotated` and `webhook.deleted` carry `name` and `host`, `webhook.created` also `event_types`, and `webhook.updated` carries `changes`, an object with `{from, to}` for each of `name`, `enabled`, `event_types` and `host` that changed, and `url_changed` when the address changed at all, never the address path or the secret;
      `mcp_client.connected` carries `client`, `person_id`, `person_name` and `mode`; `mcp_client.disconnected` also carries `reason`, one of `person`, `admin`, `client`, `code_reuse` or `refresh_reuse`;
      `outbound_domain.added` and `outbound_domain.removed` carry `domain`, and their target id is a UUID derived from the domain;
      `grafana_connection.created`, `grafana_connection.updated` and `grafana_connection.deleted` carry `name` and `host`, `grafana_connection.updated` carries `changes`, an object with `{from, to}` for each of `name` and `host` that changed, and `token_changed` when the token did, never the token.
      `datasource.created`, `datasource.updated`, `datasource.audience_changed` and `datasource.deleted` carry `uid`, `type`, `name` and `host` (the address's host and port, never its path), `datasource.updated` carries `changes`, an object with `{from, to}` for each of `name` and `host` that changed, and `address_changed`, `settings_changed` and `credentials_changed` when they did, never a credential, and `datasource.audience_changed` carries the audience before and after as `from` and `to` (`everyone` or `admins`); a change of the audience and of anything else records both events.
      Suggestions and build progress are not recorded.
      The server deletes events older than `SLASHOBSERVE_ACTIVITY_RETENTION`, 180 days by default, so the list never reaches further back than that.
    parameters:
      - name: dashboard_id
        in: query
        description: Only events of this dashboard.
        schema:
          type: string
          format: uuid
      - name: folder_id
        in: query
        description: Only events whose folder is this one.
        schema:
          type: string
          format: uuid
      - name: observation_id
        in: query
        description: Only events of this observation, its blocks, its RCA revisions and its discussion thread; the visibility rule still applies.
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        description: Only events of these types; repeat the parameter for several.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 79
          items:
            $ref: "../openapi.yaml#/components/schemas/ActivityType"
      - name: since
        in: query
        description: RFC 3339 time; only events created at or after it.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: RFC 3339 time; only events created at or before it.
        schema:
          type: string
          format: date-time
      - name: actor_id
        in: query
        description: Only events made by this person or service account.
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      "200":
        description: One page of events.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ActivityList"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
activity-stream:
  get:
    operationId: streamActivity
    x-audit: { none: "event stream; each change it carries is recorded where it is made" }
    x-surfaces:
      mcp: [list_activity]
      cli: [observe activity]
    summary: Follow workspace activity as Server-Sent Events.
    description: >-
      The stream starts with `retry: 3000` and an `event: ready` whose data is `{}`.
      Each event after that is a frame of `id: <seq>`, `event: activity` and the event JSON of `listActivity` as data, oldest first, filtered to what the caller may see and by the same `dashboard_id`, `folder_id`, `observation_id`, `type` and `since` parameters as the list.
      Without `Last-Event-ID` the stream sends only events appended after it opened, and `Last-Event-ID: 0` starts at the beginning of the log.
      A reconnecting client sends the `id` of the last frame it handled as `Last-Event-ID`, and the stream continues with the next event in log order, so nothing is skipped or repeated.
      `event: reset` with data `{}` follows `ready` when that id is unknown, for example because the event was pruned: events may have been missed, and the stream continues from the newest event; a value that is not a non-negative integer is 400.
      An event appears once its transaction and every older transaction have committed, so a burst of changes is delivered in log order, and an event can arrive up to about a second after its change.
      A `: ping` comment arrives every 15 seconds; at each ping the server re-reads the caller's credentials, role and folder access, so a role change or a revoked key takes effect at the next ping, which ends the stream when the credential is gone.
      The server ends the stream after 30 minutes and clients reconnect.
      A caller may hold 5 streams and the process 500.
    parameters:
      - name: dashboard_id
        in: query
        schema:
          type: string
          format: uuid
      - name: folder_id
        in: query
        schema:
          type: string
          format: uuid
      - name: observation_id
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 79
          items:
            $ref: "../openapi.yaml#/components/schemas/ActivityType"
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      - name: Last-Event-ID
        in: header
        description: The `seq` of the last event the client handled, or `0` to start at the beginning of the log.
        schema:
          type: string
    responses:
      "200":
        description: An open `text/event-stream`.
        content:
          text/event-stream:
            schema:
              type: string
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "429":
        description: The caller already holds the maximum number of open streams (`too_many_streams`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "503":
        description: The process holds the maximum number of open streams (`too_many_streams`) or is shutting down (`shutting_down`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
