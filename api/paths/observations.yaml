observations:
  post:
    operationId: createObservation
    x-audit: { action: observation.create, target: { kind: observation } }
    x-surfaces:
      mcp: [create_observation]
      cli: [observe o new]
    summary: Start an observation, a page of blocks in a folder.
    description: >-
      Needs Edit on the folder; without `folder_id` it is filed in the caller's My Dashboards, then General.
      `first_block` writes a text or panel block in the same transaction.
      The observation is `open`, has no discussion thread until someone opens one, and is found by search by its title, summary and text blocks.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateObservationRequest"
    responses:
      "201":
        description: The observation.
        headers:
          Location:
            required: true
            description: "`/api/v1/observations/{id}` of the new observation."
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        description: The folder does not exist or the caller cannot see it.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  get:
    operationId: listObservations
    x-audit: { none: "list read; lists are not recorded" }
    x-surfaces:
      mcp: [list_observations]
      cli: [observe o list]
    summary: List the observations in the folders the caller can see, most recently changed first.
    description: >-
      Lists the observations of every folder the caller can view, or of one folder with `folder_id`; a folder the caller cannot view gives 404.
      The items carry no blocks; read one observation for them.
      `q` keeps the observations whose title contains it, ignoring case, and `created_by=me` keeps those the caller started.
      `sort` orders by `updated` (the default, newest first), `created` (newest first) or `title` (A to Z), and `order` reverses or sets the direction.
      Page with `cursor` (the default order only) or with `offset`, which also returns `total`, the number of observations that match the filters, so a client can show page numbers.
    parameters:
      - name: folder_id
        in: query
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        schema:
          $ref: "../openapi.yaml#/components/schemas/ObservationState"
      - name: q
        in: query
        description: Title text to look for, at most 200 characters; `%` and `_` match themselves.
        schema:
          type: string
          maxLength: 200
      - name: created_by
        in: query
        schema:
          type: string
          enum: [me]
      - name: sort
        in: query
        schema:
          type: string
          enum: [updated, created, title]
          default: updated
      - name: order
        in: query
        description: "`desc` by default, and `asc` when `sort` is `title`."
        schema:
          type: string
          enum: [asc, desc]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page. It works only with the default order and not with `offset`.
        schema:
          type: string
      - name: offset
        in: query
        description: How many matching observations to skip; the response then carries `total`.
        schema:
          type: integer
          minimum: 0
          maximum: 100000
    responses:
      "200":
        description: One page of observations.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationList"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getObservation
    x-audit: { action: observation.view, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [get_observation]
      cli: [observe o show]
    summary: Read one observation with its blocks.
    description: >-
      Anyone who can view the observation's folder reads the live blocks.
      A requested block is returned only to its author and to people who can edit the folder, and `position` stays dense in what the caller sees.
      `allowed_actions` on the observation and on each block say what the caller may do now.
      An observation the caller cannot see gives 404, never 403.
    responses:
      "200":
        description: The observation, its folder and the caller's permissions.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  patch:
    operationId: updateObservation
    x-audit: { action: observation.update, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [update_observation]
      cli: [observe o edit]
    summary: Change an observation's title or time range.
    description: >-
      Needs Edit on the folder. Allowed whether the observation is open or resolved.
      A new title also renames the chat with no dashboard that this observation is the one observation made from, when the caller started that chat, and `chat_rename` says which happened.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdateObservationRequest"
    responses:
      "200":
        description: The observation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: deleteObservation
    x-audit: { action: observation.delete, target: { kind: observation, id: path.id } }
    x-surfaces:
      cli: [observe o delete]
    summary: Delete an observation with its blocks, snapshots, RCA revisions, public links and discussion.
    description: >-
      Needs Manage on the folder, or Edit on it for the person who started the observation; `allowed_actions` lists `delete` when the caller may.
      The delete cannot be undone, and an RCA's public links stop working with it.
      The activity log keeps the observation's events, ending with `observation.deleted`.
      It is refused with 409 `run_in_progress` while an investigation on the observation is queued or running, because the run would file a new observation when it finished.
      No MCP tool deletes anything, so an agent cannot call this.
    responses:
      "204":
        description: The observation and everything that belongs to it are deleted.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/ObservationConflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-move:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: moveObservation
    x-audit: { action: observation.move, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [move_observation]
      cli: [observe o move]
    summary: Move an observation to another folder.
    description: >-
      Needs Edit on both folders, and a personal folder takes no moves (409 `personal_folder`).
      Its discussion, its blocks and its past activity move with it; moving to the folder it is in changes nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/MoveObservationRequest"
    responses:
      "200":
        description: The observation in its new folder.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        description: The observation or the target folder does not exist for the caller.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: >-
          The action is not allowed in the observation's state (`invalid_transition`), the target folder is My Dashboards (`personal_folder`), or an investigation is still running on the observation (`run_in_progress`, on delete).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the content holds an answer that read Admin-only data and the folder is not one only Admins can read (`restricted_answer`).
          Its `reason` is `permanent`, or `run_in_flight` while an agent run about the content has not ended and the same request can succeed once it ends.
          Or an RCA of the observation has an unexpired public link and the folder is one only Admins can read (`admins_only_folder`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/InvalidTransition"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-resolve:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: resolveObservation
    x-audit: { action: observation.resolve, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [resolve_observation]
      cli: [observe o resolve]
    summary: Close an open observation with a one-line summary.
    description: Needs Edit on the folder. A resolved observation answers 409 `invalid_transition`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ResolveObservationRequest"
    responses:
      "200":
        description: The resolved observation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/ObservationConflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-reopen:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: reopenObservation
    x-audit: { action: observation.reopen, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [reopen_observation]
      cli: [observe o reopen]
    summary: Reopen a resolved observation.
    description: Needs Edit on the folder. The summary is kept. An open observation answers 409 `invalid_transition`.
    responses:
      "200":
        description: The reopened observation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/ObservationConflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-blocks:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: addObservationBlock
    x-audit: { action: observation.block_add, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [add_block]
      cli: [observe o add]
    summary: Add a block to an observation.
    description: >-
      With Edit on the folder the block is `live`; with only Comment it is `requested`, and an editor keeps or discards it; with only View the answer is 403.
      A `snapshot` block names a panel block of the same observation in `from_block_id` and freezes its data now, under the draft query limits and the caller's own view, so `user_scoped` says when the data is one person's.
      Freezing runs queries, so it can answer 429, 502 and 504 with the codes of panel data.
      An observation holds at most 100 blocks and 24 panel and snapshot blocks together.
      A panel block added with a service-account key, as the CLI and scripts do, must run and return data in its range, the check the `add_block` tool runs; a panel that fails it answers 422 `invalid_spec` with `issues` and adds nothing.
      A person's session is not held to it, because the web app shows an empty result before the person saves.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/AddObservationBlockRequest"
    responses:
      "201":
        description: The block.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BlockEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: >-
          The refusals of `ObservationInvalid`, or a query of a snapshot's panel cannot run, with the codes of panel data
          (`query_invalid`, `query_forbidden`, `limit_exceeded`, `unknown_datasource`, `variable_empty`, `expression_error`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/ValidationError"
                - $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        description: A datasource is unavailable (`datasource_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the query timeout (`query_timeout`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
observations-id-layout:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  put:
    operationId: arrangeObservationBlocks
    x-audit: { action: observation.arrange, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [arrange_blocks]
      cli: [observe o arrange]
    summary: Arrange the blocks of an observation.
    description: >-
      Sets the order of the page and, for each block that names one, its `width` and `height`; a field a block leaves out keeps its value, and a `height` of `null` returns it to the default.
      A number for a `height` on a text block is refused with 422 `invalid_block`, because only panel and snapshot blocks take a height.
      Needs Edit on the folder; a caller who can only comment answers 403.
      It never reads or changes a block's `version` or `updated_at`, so an arrangement cannot make someone's edit of a block's text stale, and the last arrangement to arrive wins.
      An id that names no block of this observation, or one the caller cannot see, refuses the whole request with 422 `invalid_block` and the id, and nothing changes; a block the list leaves out stays right after the block it followed, so a block someone added meanwhile keeps its place.
      The answer is the page as stored, and an arrangement that changes nothing records nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ObservationLayoutRequest"
    responses:
      "200":
        description: The blocks the caller sees, in order.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationLayout"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
blocks-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: updateObservationBlock
    x-audit: { action: observation.block_update, target: { kind: block, id: path.id } }
    x-surfaces:
      mcp: [update_block]
      cli: [observe o edit-block]
    summary: Change a block's body, width, height or position, or let a panel follow the page's range.
    description: >-
      Needs Edit on the folder and the block's current `version`; another version answers 409 `version_conflict` with the current block.
      Every change here raises the version, a width, height or position change included, so a person editing the block's text meets `version_conflict` when someone resizes it; arrange a page with `PUT /observations/{id}/layout` instead, which leaves versions alone.
      A `height` of `null` returns the block to its default height, and a number for a text block is refused with `invalid_block`, because only panel and snapshot blocks take a height.
      Only the body of a text or panel block can change (`body_not_editable`).
      `follow_page: true` clears a panel block's own `from` and `to`, so it shows the observation's range again; it goes without a `body` and only on a panel block (`invalid_block`).
      A new panel body sent with a service-account key gets the check that panel blocks get when they are added, and a failure answers 422 `invalid_spec` with `issues`.
      A `position` moves the block and shifts the blocks between, which keep their versions.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdateObservationBlockRequest"
    responses:
      "200":
        description: The updated block.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BlockEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The block's version is not the one named (`version_conflict`, with the current block), or the action is not allowed in the block's state (`invalid_transition`).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/BlockConflict"
                - $ref: "../openapi.yaml#/components/schemas/InvalidTransition"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: removeObservationBlock
    x-audit: { action: observation.block_remove, target: { kind: block, id: path.id } }
    x-surfaces:
      cli: [observe o remove-block]
    summary: Remove a live block.
    description: >-
      Needs Edit on the folder and the block's current `version`, as a query parameter.
      A requested block is kept or discarded instead (409 `invalid_transition`).
      The blocks after it close the gap.
    parameters:
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
    responses:
      "204":
        description: The block is removed.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/BlockWriteConflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-pin:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: pinObservation
    x-audit: { action: finding.pin, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [pin_observation]
      cli: [observe o pin]
    summary: Pin an observation to a dashboard as an annotation.
    description: >-
      Anyone who can read the observation may call it, and the caller needs Edit on the dashboard.
      The annotation's text is the observation's title and a link to it, tagged `finding`, at the end of the observation's range, or now when it has none.
      Without `dashboard_id` it pins to the dashboard the observation's run was about (`dashboard_id` on the observation); an observation with none answers 409 `observation_has_no_dashboard`.
      Pinning an observation to a dashboard it is already pinned to answers 200 with the same annotation.
      An observation that holds an answer that read Admin-only data is pinned only onto a dashboard in a folder only Admins can read, and the annotation then holds that answer.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PinObservationRequest"
    responses:
      "201":
        description: The annotation made for the observation.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationPin"
      "200":
        description: The observation was already pinned to that dashboard; this is its annotation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationPin"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The observation names no dashboard to pin to and none was given (`observation_has_no_dashboard`).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the observation holds an answer that read Admin-only data and the dashboard is not in a folder only Admins can read (`restricted_answer`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-dashboard:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: makeDashboardFromObservation
    x-audit: { action: dashboard.create, target: { kind: observation, id: path.id } }
    x-surfaces:
      mcp: [make_dashboard]
      cli: [observe o dashboard]
    summary: Make a dashboard from the live panel blocks of an observation.
    description: >-
      Anyone who can read the observation may call it; the dashboard lands in the caller's My Dashboards and every query is run again before it is saved.
      The dashboard holds the live panel blocks in order, with the variables each block carries, over the observation's range or, when it has none, the range of the first panel.
      Making a dashboard again from the same observation answers 200 with the one the caller made first, unless the body sets `new`.
      The caller's own chat that wrote the observation becomes a chat about the new dashboard, when it is about no dashboard or observation yet; it stays private to the caller, and a failure to attach it does not fail the call.
      An observation without a live panel block answers 409 `observation_has_no_panels`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/MakeDashboardRequest"
    responses:
      "201":
        description: The new dashboard and its first version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "200":
        description: The dashboard the caller already made from this observation, with its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: >-
          The observation has no live panel block (`observation_has_no_panels`).
          Or the content reads a datasource only Admins can query and the folder is not one only Admins can read (`restricted_content`, naming the `datasource`).
          Or the observation holds an answer that read Admin-only data, which a dashboard in My Dashboards would carry out of folders only Admins can read (`restricted_answer`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/Error"
                - $ref: "../openapi.yaml#/components/schemas/RestrictedContentError"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
blocks-id-dashboard:
