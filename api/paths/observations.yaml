    description: Needs Edit on the folder. A resolved observation answers 409 `invalid_transition`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ResolveObservationRequest"
    responses:
      "200":
        description: The resolved observation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/ObservationConflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-reopen:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: reopenObservation
    x-surfaces:
      mcp: [reopen_observation]
      cli: [observe o reopen]
    summary: Reopen a resolved observation.
    description: Needs Edit on the folder. The summary is kept. An open observation answers 409 `invalid_transition`.
    responses:
      "200":
        description: The reopened observation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/ObservationConflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-blocks:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: addObservationBlock
    x-surfaces:
      mcp: [add_block]
      cli: [observe o add]
    summary: Add a block to an observation.
    description: >-
      With Edit on the folder the block is `live`; with only Comment it is `requested`, and an editor keeps or discards it; with only View the answer is 403.
      A `snapshot` block names a panel block of the same observation in `from_block_id` and freezes its data now, under the draft query limits and the caller's own view, so `user_scoped` says when the data is one person's.
      Freezing runs queries, so it can answer 429, 502 and 504 with the codes of panel data.
      An observation holds at most 100 blocks and 24 panel and snapshot blocks together.
      A panel block added with a service-account key, as the CLI and scripts do, must run and return data in its range, the check the `add_block` tool runs; a panel that fails it answers 422 `invalid_spec` with `issues` and adds nothing.
      A person's session is not held to it, because the web app shows an empty result before the person saves.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/AddObservationBlockRequest"
    responses:
      "201":
        description: The block.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BlockEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        description: >-
          The refusals of `ObservationInvalid`, or a query of a snapshot's panel cannot run, with the codes of panel data
          (`query_invalid`, `query_forbidden`, `limit_exceeded`, `unknown_datasource`, `variable_empty`, `expression_error`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../openapi.yaml#/components/schemas/ValidationError"
                - $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        description: A datasource is unavailable (`datasource_unavailable`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the query timeout (`query_timeout`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
blocks-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: updateObservationBlock
    x-surfaces:
      mcp: [update_block]
      cli: [observe o edit-block]
    summary: Change a block's body, width or position.
    description: >-
      Needs Edit on the folder and the block's current `version`; another version answers 409 `version_conflict` with the current block.
      Only the body of a text or panel block can change (`body_not_editable`).
      A new panel body sent with a service-account key gets the check that panel blocks get when they are added, and a failure answers 422 `invalid_spec` with `issues`.
      A `position` moves the block and shifts the blocks between, which keep their versions.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdateObservationBlockRequest"
    responses:
      "200":
        description: The updated block.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BlockEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/BlockWriteConflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "422":
        $ref: "../openapi.yaml#/components/responses/ObservationInvalid"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  delete:
    operationId: removeObservationBlock
    x-surfaces:
      cli: [observe o remove-block]
    summary: Remove a live block.
    description: >-
      Needs Edit on the folder and the block's current `version`, as a query parameter.
      A requested block is kept or discarded instead (409 `invalid_transition`).
      The blocks after it close the gap.
    parameters:
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
    responses:
      "204":
        description: The block is removed.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/BlockWriteConflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-pin:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: pinObservation
    x-surfaces:
      mcp: [pin_observation]
      cli: [observe o pin]
    summary: Pin an observation to a dashboard as an annotation.
    description: >-
      Anyone who can read the observation may call it, and the caller needs Edit on the dashboard.
      The annotation's text is the observation's title and a link to it, tagged `finding`, at the end of the observation's range, or now when it has none.
      Without `dashboard_id` it pins to the dashboard the observation's run was about (`dashboard_id` on the observation); an observation with none answers 409 `observation_has_no_dashboard`.
      Pinning an observation to a dashboard it is already pinned to answers 200 with the same annotation.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PinObservationRequest"
    responses:
      "201":
        description: The annotation made for the observation.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationPin"
      "200":
        description: The observation was already pinned to that dashboard; this is its annotation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ObservationPin"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The observation names no dashboard to pin to and none was given (`observation_has_no_dashboard`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
observations-id-dashboard:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: makeDashboardFromObservation
    x-surfaces:
      mcp: [make_dashboard]
      cli: [observe o dashboard]
    summary: Make a dashboard from the live panel blocks of an observation.
    description: >-
      Anyone who can read the observation may call it; the dashboard lands in the caller's My Dashboards and every query is run again before it is saved.
      The dashboard holds the live panel blocks in order, with the variables each block carries, over the observation's range or, when it has none, the range of the first panel.
      Making a dashboard again from the same observation answers 200 with the one the caller made first, unless the body sets `new`.
      An observation without a live panel block answers 409 `observation_has_no_panels`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/MakeDashboardRequest"
    responses:
      "201":
        description: The new dashboard and its first version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "200":
        description: The dashboard the caller already made from this observation, with its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        description: The observation has no live panel block (`observation_has_no_panels`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
blocks-id-dashboard:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: makeDashboardFromBlock
    x-surfaces:
      mcp: [make_dashboard]
      cli: [observe o dashboard]
    summary: Make a dashboard from one panel block.
    description: >-
      Works as making a dashboard from the observation, with only this block; a block that is not a live panel block the caller can see answers 404.
      The same caller making a dashboard again from the same block gets the first one back, unless the body sets `new`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/MakeDashboardRequest"
    responses:
      "201":
        description: The new dashboard and its first version.
        headers:
          Location:
            required: true
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "200":
        description: The dashboard the caller already made from this block, with its latest version.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DashboardWithVersion"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/InvalidSpec"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
blocks-id-keep:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: keepObservationBlock
    x-surfaces:
      mcp: [keep_block]
      cli: [observe o keep]
    summary: Keep a requested block, which makes it live.
    description: Needs Edit on the folder and the block's current `version`. A live block answers 409 `invalid_transition`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/KeepObservationBlockRequest"
    responses:
      "200":
        description: The live block.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BlockEnvelope"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/BlockWriteConflict"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
blocks-id-discard:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: discardObservationBlock
    x-surfaces:
      mcp: [discard_block]
      cli: [observe o discard]
    summary: Discard a requested block.
    description: >-
      Needs Edit on the folder, or being the person or key that asked for the block.
      A live block answers 409 `invalid_transition`.
    responses:
      "204":
        description: The block is gone.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/BlockWriteConflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
blocks-id-data:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: observationBlockData
    summary: Run the query of a panel block and return its frames.
    description: >-
      Runs a panel block's stored queries under the draft query limits, never cached.
      Only browser sessions may call it; a key gets 403 `user_session_required`.
      Anyone who can view the observation's folder may call it, and `from` and `to` default to the block's range, then the observation's, then the last hour.
      The response has the shape of panel data.
    parameters:
      - name: from
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: to
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: tz
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: max_data_points
        in: query
        schema:
          type: integer
          minimum: 10
          maximum: 11000
          default: 1000
    responses:
      "200":
        description: The frames the panel block's queries returned.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelData"
      "400":
        description: The request is malformed or fails validation.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The request carried query text (`query_not_in_spec`), or the caller is not a signed-in user (`user_session_required`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: There is no such panel block for the caller (`not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "422":
        description: A query or a variable cannot run, with the codes of panel data.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: A datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the query timeout.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
snapshots-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getSnapshot
    summary: Read the frozen data of a snapshot block.
    description: >-
      Anyone who can view the observation's folder may read it.
      `data` is exactly what the panel data route returned when the snapshot was taken, and `query` the frozen panel's queries, which stay inside the workspace.
    responses:
      "200":
        description: The snapshot.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Snapshot"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
