dashboards-id-versions-version-panels-panel-id-data:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    - name: panel_id
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: getPanelData
    summary: Run the saved queries of one panel in one dashboard version and return their frames.
    description: >-
      The queries are fixed by the saved version, so the request names a panel and never carries query text;
      the parameters `query`, `expr`, `sql` and `q` are refused with 403 `query_not_in_spec` even when their value is malformed, and any other unknown parameter or a malformed query string with 400.
      Each variable selection is a repeated `var-<name>` parameter, for example `var-pod=a&var-pod=b`,
      and the single value `$__all` selects All; OpenAPI 3.0 cannot describe a parameter family, so these are not listed below.
      A variable that is not given gets its default, and a request for an undeclared variable is a 400.
      An interval variable accepts `$__auto` when its `auto` is set, a constant accepts only its value, and a textbox accepts one value, an empty one included.
      An adhoc variable takes repeated `var-<name>=key|op|value` filters (at most 20) with `=`, `!=`, `=~` or `!~`, split at the first two `|`.
      `from` and `to` accept a Spec time expression such as `now-6h`, an RFC 3339 time or epoch milliseconds,
      default to the version's `time`, and may span at most 400 days.
      A range panel aligns `from` and `to` down to a multiple of the step, and an instant panel aligns `to` down to 5 seconds;
      the aligned range comes back in `meta`.
      Every visible query of the panel runs in this one request (at most 4 at a time), and each frame carries the `ref` of the query that produced it; a hidden query does not run.
      The panel's `maxDataPoints` caps `max_data_points`, and a query's or the panel's `interval` is the minimum step of a range query.
      A failing query fails the whole request, and the error names it in `ref`.
      Successful results are cached in the server for 10 seconds, and each caller may have at most 8 query requests in flight.
    parameters:
      - name: from
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: to
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: max_data_points
        in: query
        schema:
          type: integer
          minimum: 10
          maximum: 11000
          default: 1000
    responses:
      "200":
        description: The frames the saved queries returned, an empty list when the result is empty or every query is hidden.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelData"
      "400":
        description: The request is malformed or fails validation, for example an undeclared variable or an invalid variable selection.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The request carried query text; the code is `query_not_in_spec`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: The dashboard or version does not exist (`not_found`), or the version has no such panel (`panel_not_found`).
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "422":
        description: >-
          A query or a variable cannot run: `query_invalid`, `query_forbidden`, `limit_exceeded` (also for a response over 32 MiB),
          `unknown_datasource` or `variable_empty`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        description: The server failed to handle the request, including a datasource call that failed without a classified cause.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "502":
        description: A datasource is unavailable.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
      "504":
        description: A datasource did not answer within the query timeout, or the panel's queries did not all finish within 55 seconds; `ref` names the lowest-index query that failed.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PanelDataError"
dashboards-id-versions-version-variables-name-values:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    - name: name
      in: path
      required: true
      schema:
        type: string
  get:
    operationId: getVariableValues
    summary: List the values of one variable in one dashboard version.
    description: >-
      A custom variable returns its options without an upstream call.
      A constant returns its value, an interval variable its options with `$__auto` first when `auto` is set, and a datasource variable the uids of the configured datasources of its type;
      a textbox variable lists nothing, and an adhoc variable has no list, so asking for it is a 400.
      A query variable runs its saved query with the selections of the variables declared before it, given as repeated `var-<name>` parameters
      (not listed below, see the panel data operation); an earlier variable without a selection gets its default,
      and a selection for the listed variable or a later one is a 400.
      `from` and `to` behave as for panel data, and the range is aligned like the default range of a range panel.
      The same query-text refusal and in-flight limit apply.
    parameters:
      - name: from
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: to
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
    responses:
      "200":
        description: Up to 1000 values; `truncated` is true when there were more.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/VariableValues"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        description: The request carried query text; the code is `query_not_in_spec`.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/QueryUnprocessable"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        $ref: "../openapi.yaml#/components/responses/QueryBadGateway"
      "504":
        $ref: "../openapi.yaml#/components/responses/QueryTimeout"
datasources-uid-lint:
  parameters:
    - name: uid
      in: path
      required: true
      schema:
        type: string
  post:
    operationId: lintDatasourceQuery
    summary: Parse a query for a datasource and return diagnostics, without executing it or returning data.
    description: >-
      Prometheus queries are parsed and checked for metric names that do not exist; ClickHouse queries are checked with `EXPLAIN SYNTAX`.
      The call times out after 5 seconds, counts against the same in-flight limit as panel data, and takes one of the server's shared upstream slots, waiting at most 5 seconds for one before answering 429.
      When the datasource cannot be reached the call answers 502 or 504 instead of a diagnostic.
      A query over 64 KiB is refused with 400 `query_too_long`, and a body over 512 KiB with 413 `too_large`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [query]
            properties:
              query:
                type: string
                minLength: 1
                maxLength: 65536
    responses:
      "200":
        description: The diagnostics, empty when the query is clean.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/LintResult"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../openapi.yaml#/components/responses/TooLarge"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
      "502":
        $ref: "../openapi.yaml#/components/responses/QueryBadGateway"
      "504":
        $ref: "../openapi.yaml#/components/responses/QueryTimeout"
