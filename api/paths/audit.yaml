    operationId: getAuditHistogram
    x-audit: { action: audit.search }
    x-surfaces:
      mcp: [get_audit_histogram]
      cli: [observe audit histogram]
    summary: Count the matching audit events over time.
    description: >-
      Only Admins can call this endpoint, and an Admin service-account key can too; an agent run reaches it only when its requester is an Admin.
      Splits the window into buckets of one step, the smallest of 1s, 5s, 10s, 30s, 1m, 5m, 10m, 30m, 1h, 3h, 6h, 12h and 1d that gives at most `buckets` buckets, and counts the matching events in each; empty buckets are included, oldest first.
      This read is itself recorded as `audit.search` with `view` `histogram`, the query as sent (cut at 4 KiB), its form, the window and the row count, once per caller and query text in 10 minutes; a refused query is recorded every time.
    parameters:
      - name: q
        in: query
        description: >-
          The filter, in one of three forms: KQL by default (`action:dashboard.* and outcome:denied`), Lucene after a `lucene:` prefix, or a Query DSL body that starts with `{` and may carry `query`, `size` and `aggs`.
          Empty matches every event in the window. `GET /audit/fields` lists the fields; the audit query reference in the guide has examples.
        schema:
          type: string
          maxLength: 65536
      - name: since
        in: query
        description: Start of the window, inclusive, as an RFC 3339 time, epoch milliseconds or a relative time such as `now-7d`; 24 hours before `until` when left out.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: until
        in: query
        description: End of the window, exclusive, in the same forms; now when left out. The window is at most 366 days.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: buckets
        in: query
        description: The most buckets wanted, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 60
    responses:
      "200":
        description: The counts.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AuditHistogram"
      "400":
        description: "The window is not valid or `buckets` is out of range (`invalid_request`)."
