service-accounts:
  post:
    operationId: createServiceAccount
    summary: Create a service account.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateServiceAccountRequest"
    responses:
      "201":
        description: The created service account.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ServiceAccount"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  get:
    operationId: listServiceAccounts
    summary: List service accounts.
    responses:
      "200":
        description: Every service account.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ServiceAccountList"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
service-accounts-id:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  patch:
    operationId: updateServiceAccountRole
    summary: Change the role a service account's keys act with.
    description: Service accounts cannot call this endpoint.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UpdateServiceAccountRequest"
    responses:
      "200":
        description: The service account with its new role.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ServiceAccount"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
service-accounts-id-keys:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: createServiceAccountKey
    summary: Issue a key for a service account.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateServiceAccountKeyRequest"
    responses:
      "201":
        description: The key metadata and the token, which is shown only once.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/IssuedServiceAccountKey"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
  get:
    operationId: listServiceAccountKeys
    summary: List the keys of a service account without their secrets.
    responses:
      "200":
        description: Every key of the service account.
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ServiceAccountKeyList"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
service-accounts-id-keys-keyid:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  delete:
    operationId: revokeServiceAccountKey
    summary: Revoke a key of a service account.
    responses:
      "204":
        description: The key is revoked.
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "500":
        $ref: "../openapi.yaml#/components/responses/Internal"
