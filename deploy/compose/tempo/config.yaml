stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    block:
      parquet_row_group_size_bytes: 16000000

backend_scheduler:
  provider:
    compaction:
      max_input_blocks: 2
      compaction:
        block_retention: 72h

backend_worker:
  compaction:
    block_retention: 72h

usage_report:
  reporting_enabled: false
