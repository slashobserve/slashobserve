name: slashobserve

# Development-only OAuth client secret shared by Dex and the server.
x-dex-client-secret: &dex-client-secret slashobserve-dev-client-secret

x-shop: &shop
  image: ${SLASHOBSERVE_SHOP_IMAGE:-ghcr.io/slashobserve/demo-shop:latest}
  command: [serve]
  depends_on:
    otel-collector:
      condition: service_started
  deploy:
    resources:
      limits:
        memory: 64M
        cpus: "0.5"

x-shop-server: &shop-server
  <<: *shop
  healthcheck:
    test: ["CMD", "/usr/local/bin/shop", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      # Development-only credentials; the database is reachable only on the compose network.
      POSTGRES_USER: slashobserve
      POSTGRES_PASSWORD: slashobserve
      POSTGRES_DB: slashobserve
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slashobserve -d slashobserve"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1-distroless@sha256:8bfd667b384c2a2555c355c58c167e11127d2ea1a3711f1c246e4d7c5528eb2a
    command: ["dex", "serve", "/etc/dex/config.yaml.tmpl"]
    environment:
      DEX_ISSUER: http://localhost:${SLASHOBSERVE_DEX_HOST_PORT:-5556}/dex
      DEX_REDIRECT_URI: http://localhost:${SLASHOBSERVE_HOST_PORT:-8080}/api/v1/auth/callback
      DEX_CLIENT_SECRET: *dex-client-secret
    volumes:
      - ./dex/config.yaml.tmpl:/etc/dex/config.yaml.tmpl:ro
    ports:
      - "127.0.0.1:${SLASHOBSERVE_DEX_HOST_PORT:-5556}:5556"
    healthcheck:
      # The image has no wget or curl; gomplate, bundled for the entrypoint, exits non-zero unless /healthz answers 2xx.
      test: ["CMD", "/usr/local/bin/gomplate", "-d", "h=http://127.0.0.1:5556/dex/healthz", "-i", "{{ include \"h\" }}"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 64M

  server:
    image: ${SLASHOBSERVE_IMAGE:-ghcr.io/slashobserve/slashobserve:latest}
    environment:
      SLASHOBSERVE_DATABASE_URL: postgres://slashobserve:slashobserve@postgres:5432/slashobserve?sslmode=disable
      SLASHOBSERVE_LOG_LEVEL: ${SLASHOBSERVE_LOG_LEVEL:-info}
      SLASHOBSERVE_LOG_FORMAT: ${SLASHOBSERVE_LOG_FORMAT:-json}
      SLASHOBSERVE_PUBLIC_URL: http://localhost:${SLASHOBSERVE_HOST_PORT:-8080}
      SLASHOBSERVE_OIDC_ISSUER_URL: http://localhost:${SLASHOBSERVE_DEX_HOST_PORT:-5556}/dex
      SLASHOBSERVE_OIDC_INTERNAL_URL: http://dex:5556
      SLASHOBSERVE_OIDC_CLIENT_ID: slashobserve
      SLASHOBSERVE_OIDC_CLIENT_SECRET: *dex-client-secret
      SLASHOBSERVE_AUTH_ALLOWED_EMAIL_DOMAINS: ${SLASHOBSERVE_AUTH_ALLOWED_EMAIL_DOMAINS:-example.com}
      SLASHOBSERVE_AUTH_PROVIDER_NAME: Dex
      SLASHOBSERVE_ADMIN_EMAILS: ${SLASHOBSERVE_ADMIN_EMAILS:-admin@example.com}
      SLASHOBSERVE_DATASOURCES_FILE: /etc/slashobserve/datasources.yaml
      SLASHOBSERVE_CLICKHOUSE_PASSWORD: slashobserve
      SLASHOBSERVE_API_CONTRACT_CHECK: ${SLASHOBSERVE_API_CONTRACT_CHECK:-false}
      SLASHOBSERVE_LLM_PROVIDER: ${SLASHOBSERVE_LLM_PROVIDER:-}
      SLASHOBSERVE_LLM_MODEL: ${SLASHOBSERVE_LLM_MODEL:-}
      SLASHOBSERVE_LLM_API_KEY: ${SLASHOBSERVE_LLM_API_KEY:-}
      SLASHOBSERVE_LLM_BASE_URL: ${SLASHOBSERVE_LLM_BASE_URL:-}
      SLASHOBSERVE_LLM_LOG_PROVIDER_ERRORS: ${SLASHOBSERVE_LLM_LOG_PROVIDER_ERRORS:-}
      SLASHOBSERVE_LLM_REPLAY_DIR: /etc/slashobserve/llm-fixtures
    volumes:
      - ${SLASHOBSERVE_DATASOURCES_HOST_FILE:-./datasources.yaml}:/etc/slashobserve/datasources.yaml:ro
      - ../../e2e/fixtures/llm:/etc/slashobserve/llm-fixtures:ro
    ports:
      - "127.0.0.1:${SLASHOBSERVE_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      PROMETHEUS_BACKFILL: ${SLASHOBSERVE_PROMETHEUS_BACKFILL:-1}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${SLASHOBSERVE_PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
      - --collector.processes
      - --collector.tcpstat
      - --collector.interrupts
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          memory: 64M

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory,network
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    deploy:
      resources:
        limits:
          memory: 256M

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10-distroless@sha256:4c918ac7ccad3c9f4b0d53e9abc939ff5f4cc101cb5a53f1832a6bcb884961b4
    environment:
      # Development-only credentials; ClickHouse is reachable only on the compose network.
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/config.d/slashobserve.xml:/etc/clickhouse-server/config.d/slashobserve.xml:ro
      - ../../internal/datasource/clickhouse/testdata/readonly_user.sql:/docker-entrypoint-initdb.d/10-readonly-user.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "/usr/bin/clickhouse", "client", "--user", "slashobserve_ro", "--password", "slashobserve", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    environment:
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  frontend-0:
    <<: *shop-server
    environment:
      SHOP_SERVICE: frontend
      SHOP_POD: frontend-0
      SHOP_CHECKOUT_URLS: http://checkout-0:8080,http://checkout-1:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  checkout-0:
    <<: *shop-server
    environment:
      SHOP_SERVICE: checkout
      SHOP_POD: checkout-0
      SHOP_PAYMENTS_URL: http://payments-0:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:${SLASHOBSERVE_SHOP_HOST_PORT:-8081}:8080"

  checkout-1:
    <<: *shop-server
    environment:
      SHOP_SERVICE: checkout
      SHOP_POD: checkout-1
      SHOP_PAYMENTS_URL: http://payments-0:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  payments-0:
    <<: *shop-server
    environment:
      SHOP_SERVICE: payments
      SHOP_POD: payments-0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  loadgen:
    <<: *shop
    command: [loadgen]
    environment:
      LOADGEN_TARGET: http://frontend-0:8080
      LOADGEN_RPS: "20"
      LOADGEN_SEED: "42"
      LOADGEN_START_FILE: /prometheus/backfill-end
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      frontend-0:
        condition: service_healthy
      prometheus:
        condition: service_started
    volumes:
      - prometheus-data:/prometheus:ro
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.5"

volumes:
  postgres-data:
  prometheus-data:
  clickhouse-data:
