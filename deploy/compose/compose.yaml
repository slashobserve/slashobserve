name: slashobserve

# Development-only OAuth client secret shared by Dex and the server.
x-dex-client-secret: &dex-client-secret slashobserve-dev-client-secret

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      # Development-only credentials; the database is reachable only on the compose network.
      POSTGRES_USER: slashobserve
      POSTGRES_PASSWORD: slashobserve
      POSTGRES_DB: slashobserve
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slashobserve -d slashobserve"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1-distroless@sha256:8bfd667b384c2a2555c355c58c167e11127d2ea1a3711f1c246e4d7c5528eb2a
    command: ["dex", "serve", "/etc/dex/config.yaml.tmpl"]
    environment:
      DEX_ISSUER: http://localhost:${SLASHOBSERVE_DEX_HOST_PORT:-5556}/dex
      DEX_REDIRECT_URI: http://localhost:${SLASHOBSERVE_HOST_PORT:-8080}/api/v1/auth/callback
      DEX_CLIENT_SECRET: *dex-client-secret
    volumes:
      - ./dex/config.yaml.tmpl:/etc/dex/config.yaml.tmpl:ro
    ports:
      - "127.0.0.1:${SLASHOBSERVE_DEX_HOST_PORT:-5556}:5556"
    healthcheck:
      # The image has no wget or curl; gomplate, bundled for the entrypoint, exits non-zero unless /healthz answers 2xx.
      test: ["CMD", "/usr/local/bin/gomplate", "-d", "h=http://127.0.0.1:5556/dex/healthz", "-i", "{{ include \"h\" }}"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 64M

  server:
    image: ${SLASHOBSERVE_IMAGE:-ghcr.io/slashobserve/slashobserve:latest}
    environment:
      SLASHOBSERVE_DATABASE_URL: postgres://slashobserve:slashobserve@postgres:5432/slashobserve?sslmode=disable
      SLASHOBSERVE_LOG_LEVEL: ${SLASHOBSERVE_LOG_LEVEL:-info}
      SLASHOBSERVE_LOG_FORMAT: ${SLASHOBSERVE_LOG_FORMAT:-json}
      SLASHOBSERVE_PUBLIC_URL: http://localhost:${SLASHOBSERVE_HOST_PORT:-8080}
      SLASHOBSERVE_OIDC_ISSUER_URL: http://localhost:${SLASHOBSERVE_DEX_HOST_PORT:-5556}/dex
      SLASHOBSERVE_OIDC_INTERNAL_URL: http://dex:5556
      SLASHOBSERVE_OIDC_CLIENT_ID: slashobserve
      SLASHOBSERVE_OIDC_CLIENT_SECRET: *dex-client-secret
      SLASHOBSERVE_AUTH_ALLOWED_EMAIL_DOMAINS: ${SLASHOBSERVE_AUTH_ALLOWED_EMAIL_DOMAINS:-example.com}
      SLASHOBSERVE_AUTH_PROVIDER_NAME: Dex
      SLASHOBSERVE_ADMIN_EMAILS: ${SLASHOBSERVE_ADMIN_EMAILS:-admin@example.com}
      SLASHOBSERVE_DATASOURCES_FILE: /etc/slashobserve/datasources.yaml
      SLASHOBSERVE_CLICKHOUSE_PASSWORD: slashobserve
      SLASHOBSERVE_API_CONTRACT_CHECK: ${SLASHOBSERVE_API_CONTRACT_CHECK:-false}
      SLASHOBSERVE_LLM_PROVIDER: ${SLASHOBSERVE_LLM_PROVIDER:-}
      SLASHOBSERVE_LLM_MODEL: ${SLASHOBSERVE_LLM_MODEL:-}
      SLASHOBSERVE_LLM_API_KEY: ${SLASHOBSERVE_LLM_API_KEY:-}
      SLASHOBSERVE_LLM_BASE_URL: ${SLASHOBSERVE_LLM_BASE_URL:-}
      SLASHOBSERVE_LLM_LOG_PROVIDER_ERRORS: ${SLASHOBSERVE_LLM_LOG_PROVIDER_ERRORS:-}
      SLASHOBSERVE_LLM_REPLAY_DIR: /etc/slashobserve/llm-fixtures
      SLASHOBSERVE_PROVISION_DIR: /provision
      SLASHOBSERVE_SECRET_KEY: ${SLASHOBSERVE_SECRET_KEY:-6d1f0c3b9a8e4d7c2b5a6f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c}
      SLASHOBSERVE_SERVICE_ACCOUNTS_FILE: ${SLASHOBSERVE_SERVICE_ACCOUNTS_FILE-}
    volumes:
      - ${SLASHOBSERVE_DATASOURCES_HOST_FILE:-./datasources.yaml}:/etc/slashobserve/datasources.yaml:ro
      - ../../e2e/fixtures/llm:/etc/slashobserve/llm-fixtures:ro
      - ./dashboards:/provision:ro
    ports:
      - "127.0.0.1:${SLASHOBSERVE_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${SLASHOBSERVE_PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10-distroless@sha256:4c918ac7ccad3c9f4b0d53e9abc939ff5f4cc101cb5a53f1832a6bcb884961b4
    environment:
      # Development-only credentials; ClickHouse is reachable only on the compose network.
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse/config.d/slashobserve.xml:/etc/clickhouse-server/config.d/slashobserve.xml:ro
      - ../../internal/datasource/clickhouse/testdata/readonly_user.sql:/docker-entrypoint-initdb.d/10-readonly-user.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "/usr/bin/clickhouse", "client", "--user", "slashobserve_ro", "--password", "slashobserve", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/slashobserve.yaml"]
    environment:
      GOMEMLIMIT: 768MiB
    volumes:
      - ./loki/config.yaml:/etc/loki/slashobserve.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${SLASHOBSERVE_LOKI_HOST_PORT:-3100}:3100"
    deploy:
      resources:
        limits:
          memory: 1G

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/slashobserve.yaml"]
    environment:
      GOMEMLIMIT: 768MiB
    volumes:
      - ./tempo/config.yaml:/etc/tempo/slashobserve.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${SLASHOBSERVE_TEMPO_HOST_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  jaeger:
    image: quay.io/jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    profiles: [jaeger]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4@sha256:13bb550524faa2aef6950b13fb6414c73b957e97e6169e5808743c8378614599
    profiles: [search]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${SLASHOBSERVE_ELASTICSEARCH_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  opensearch:
    image: opensearchproject/opensearch:2.19.1@sha256:72fe2fc84be8295906b8efca020b46c58ed45c8da60cd9b8b49e1991e38e89a4
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${SLASHOBSERVE_OPENSEARCH_HOST_PORT:-9201}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres-data:
  prometheus-data:
  clickhouse-data:
  loki-data:
  tempo-data:
  elasticsearch-data:
  opensearch-data:
