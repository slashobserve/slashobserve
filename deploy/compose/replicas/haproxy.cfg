global
    maxconn 4096

defaults
    mode http
    retries 3
    option redispatch
    retry-on all-retryable-errors
    default-server inter 1s fall 2 rise 2
    timeout connect 1s
    timeout client 35m
    timeout server 35m

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

backend servers
    balance roundrobin
    option httpchk GET /readyz
    server s1 slashobserve-replicas-server-1:8080 check resolvers docker init-addr last,libc,none
    server s2 slashobserve-replicas-server-2:8080 check resolvers docker init-addr last,libc,none

backend only1
    option httpchk GET /readyz
    server s1 slashobserve-replicas-server-1:8080 check resolvers docker init-addr last,libc,none

backend only2
    option httpchk GET /readyz
    server s2 slashobserve-replicas-server-2:8080 check resolvers docker init-addr last,libc,none

frontend all
    bind *:8080
    default_backend servers

frontend one
    bind *:8081
    default_backend only1

frontend two
    bind *:8082
    default_backend only2
