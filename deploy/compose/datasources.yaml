# No secrets here: passwords are referenced by env var or file.
datasources:
  - uid: prom
    type: prometheus
    name: Prometheus
    prometheus:
      url: http://prometheus:9090
      scrapeInterval: 15s
  - uid: ch
    type: clickhouse
    name: ClickHouse
    clickhouse:
      addr: clickhouse:9000
      database: otel
      username: slashobserve_ro
      passwordEnv: SLASHOBSERVE_CLICKHOUSE_PASSWORD
  - uid: loki
    type: loki
    name: Loki
    grafanaUids: [loki]
    loki:
      url: http://loki:3100
  - uid: tempo
    type: tempo
    name: Tempo
    grafanaUids: [tempo]
    tempo:
      url: http://tempo:3200
