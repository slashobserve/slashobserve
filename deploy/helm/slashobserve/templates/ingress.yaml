{{- if .Values.ingress.enabled }}
{{- $name := include "slashobserve.fullname" . }}
{{- $host := (urlParse .Values.publicURL).hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "slashobserve.fullname" . }}
  labels:
    {{- include "slashobserve.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if not .Values.ingress.exposeMetrics }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-no-metrics
                port:
                  number: 80
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- if not .Values.ingress.exposeMetrics }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-no-metrics
  labels:
    {{- include "slashobserve.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
{{- end }}
{{- end }}
