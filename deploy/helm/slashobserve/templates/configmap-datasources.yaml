{{- if and (not .Values.datasources.existingConfigMap) .Values.datasources.datasources }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slashobserve.datasourcesConfigMap" . }}
  labels:
    {{- include "slashobserve.labels" . | nindent 4 }}
data:
  {{ .Values.datasources.key }}: |
    {{- dict "datasources" .Values.datasources.datasources | toYaml | nindent 4 }}
{{- end }}
