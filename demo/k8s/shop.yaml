apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: default
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: loadgen
          image: slashobserve-demo-shop:k8s
          imagePullPolicy: IfNotPresent
          args: [loadgen]
          env:
            - name: LOADGEN_TARGET
              value: http://frontend-0:8080
            - name: LOADGEN_RPS
              value: "20"
            - name: LOADGEN_SEED
              value: "42"
          resources:
            requests:
              cpu: 50m
              memory: 16M
            limits:
              cpu: 500m
              memory: 32M
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
