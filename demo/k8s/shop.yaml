apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-0
  namespace: default
  labels:
    app.kubernetes.io/name: frontend-0
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-0
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: shop
          image: slashobserve-demo-shop:k8s
          imagePullPolicy: IfNotPresent
          args: [serve]
          env:
            - name: SHOP_SERVICE
              value: frontend
            - name: SHOP_POD
              value: frontend-0
            - name: SHOP_CHECKOUT_URLS
              value: http://checkout-0:8080,http://checkout-1:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 32M
            limits:
              cpu: 500m
              memory: 64M
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-0
  namespace: default
  labels:
    app.kubernetes.io/name: frontend-0
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: frontend-0
  ports:
    - name: http
      port: 8080
      targetPort: http
---
