name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: go-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint

      - name: Cache golangci-lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yaml', 'tools/golangci-lint/go.sum') }}-${{ github.sha }}
          restore-keys: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yaml', 'tools/golangci-lint/go.sum') }}-

      - name: Go lint, chart checks and tidy check
        run: make lint-go lint-deploy tidy-check

  go-test:
    name: go-test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [grafana, evals, rest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: test-${{ matrix.shard }}

      - name: Go tests
        env:
          COVER: "1"
          SHARD: ${{ matrix.shard }}
        run: make test-go GO_TEST_PKGS="$(scripts/go-test-shard.sh "$SHARD")"

      - name: Shop tests
        if: matrix.shard == 'rest'
        run: make test-shop

      - name: Upload the coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.shard }}
          path: coverage.out
          retention-days: 1

  web-lint:
    name: web-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'observe-agent/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Web and agent lint, script tests
        run: make lint-web lint-agent test-agent test-scripts

  web-test:
    name: web-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'observe-agent/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Web tests
        env:
          COVER: "1"
        run: make test-web

      - name: Upload the coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/coverage-summary.json
          retention-days: 1

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: build
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'observe-agent/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Generated files are up to date
        run: |
          make generate
          git diff --exit-code
          test -z "$(git status --porcelain)"

  check:
    name: check
    if: always()
    needs: [go-lint, go-test, web-lint, web-test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every lint, test and build job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done

      - name: Download the coverage files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: Add coverage to the job summary
        run: |
          go_total="$(cat coverage/coverage-go-*/coverage.out | awk '$1 != "mode:" { total += $2; if ($3 > 0) covered += $2 } END { printf "%.1f%%", 100 * covered / total }')"
          web_total="$(jq -r '.total.statements.pct' coverage/coverage-web/coverage-summary.json)%"
          {
            echo "| Coverage | Statements |"
            echo "| --- | --- |"
            echo "| Go | $go_total |"
            echo "| Web | $web_total |"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/govulncheck/go.sum
            demo/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Go and web dependency audit
        run: make audit

  e2e-api:
    name: e2e-api
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SLASHOBSERVE_IMAGE: slashobserve-e2e:ci
      SLASHOBSERVE_SHOP_IMAGE: slashobserve-demo-shop:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: slashobserve-e2e:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build demo shop image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo
          load: true
          tags: slashobserve-demo-shop:ci
          cache-from: type=gha,scope=demo-shop
          cache-to: type=gha,mode=max,scope=demo-shop

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: API smoke suite
        run: make e2e

      - name: Collect compose logs
        if: failure()
        run: scripts/e2e.sh logs > e2e-compose.log 2>&1 || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-compose.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: scripts/e2e.sh down

  e2e-browser:
    name: e2e-browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SLASHOBSERVE_IMAGE: slashobserve-e2e:ci
      SLASHOBSERVE_SHOP_IMAGE: slashobserve-demo-shop:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: slashobserve-e2e:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build demo shop image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo
          load: true
          tags: slashobserve-demo-shop:ci
          cache-from: type=gha,scope=demo-shop
          cache-to: type=gha,mode=max,scope=demo-shop

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run e2e:install --with-deps

      - name: Boot the stack and run the API smoke suite
        run: make e2e

      - name: Browser suite shard
        env:
          PW_SHARD: ${{ matrix.shard }}/4
        run: make e2e-browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: scripts/e2e.sh down

  evals-replay:
    name: evals-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SLASHOBSERVE_IMAGE: slashobserve-evals:ci
      SLASHOBSERVE_SHOP_IMAGE: slashobserve-evals-shop:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: slashobserve-evals:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build demo shop image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo
          load: true
          tags: slashobserve-evals-shop:ci
          cache-from: type=gha,scope=demo-shop
          cache-to: type=gha,mode=max,scope=demo-shop

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Start the replay stack
        run: scripts/evals-stack.sh up replay

      - name: Replay suite
        run: >
          go run ./evals/runner
          --server http://localhost:28080
          --suite replay
          --bootstrap-dex
          --min-pass 1
          --out "$RUNNER_TEMP/evals.json"
          --markdown "$RUNNER_TEMP/evals.md"

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evals.md" ]; then
            cat "$RUNNER_TEMP/evals.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print compose logs
        if: failure()
        run: docker compose -p slashobserve-evals logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: scripts/evals-stack.sh down
