name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.groups.outputs.go }}
      web: ${{ steps.groups.outputs.web }}
      build: ${{ steps.groups.outputs.build }}
      stack: ${{ steps.groups.outputs.stack }}
      image: ${{ steps.groups.outputs.image }}
      audit: ${{ steps.groups.outputs.audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which job groups the changed files need
        id: groups
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          case "$EVENT" in
            pull_request)
              mode=""
              if [ "$DRAFT" = "true" ]; then mode=draft; fi
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)' | scripts/ci-changes.sh $mode
              ;;
            schedule) scripts/ci-changes.sh audit-only ;;
            *) scripts/ci-changes.sh all ;;
          esac | tee -a "$GITHUB_OUTPUT"

  go-lint:
    name: go-lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint

      - name: Read the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yaml', 'tools/golangci-lint/go.sum') }}-${{ steps.week.outputs.week }}
          restore-keys: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yaml', 'tools/golangci-lint/go.sum') }}-

      - name: Go lint, chart checks and tidy check
        run: make lint-go lint-deploy tidy-check

  go-test:
    name: go-test (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [grafana, db, datasource, agent, rest-1, rest-2]
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: race
          shard: ${{ matrix.shard }}

      - name: Go tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          packages="$(scripts/go-test-shard.sh "$SHARD")"
          [[ -n "${packages// /}" ]] || { echo "shard $SHARD has no packages" >&2; exit 1; }
          make test-go GO_TEST_PKGS="$packages"

  web-lint:
    name: web-lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'harness/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.19

      - name: Web and agent lint, script and benchmark adapter tests
        run: make -j4 --output-sync=target lint-web lint-harness test-harness test-scripts test-benchmarks

  web-test:
    name: web-test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'harness/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Web tests
        env:
          SHARD: ${{ matrix.shard }}
        run: make test-web WEB_TEST_FLAGS="--shard=$SHARD/2"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: build
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'harness/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build
        run: make build

      - name: The server embeds the built MCP panel
        run: SLASHOBSERVE_REQUIRE_BUILT_PANEL=1 go test -short -count=1 -run TestTheEmbeddedPanelIsTheBuiltOne ./internal/server/mcp

      - name: Generated files are up to date
        run: |
          make generate
          git diff --exit-code
          test -z "$(git status --porcelain)"

  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the server image from the Dockerfile's own stages
        run: docker build -t slashobserve-server:ci .

  check:
    name: check
    if: always()
    needs: [changes, go-lint, go-test, web-lint, web-test, build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every lint, test and build job the change needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/govulncheck/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Go and web dependency audit
        run: make audit

  e2e-api:
    name: e2e-api
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SLASHOBSERVE_IMAGE: slashobserve-e2e:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images
        uses: ./.github/actions/stack-images
        with:
          server-tag: slashobserve-e2e:ci
          warm: make e2e-warm

      - name: API smoke suite
        run: make e2e

      - name: Collect compose logs
        if: failure()
        run: scripts/e2e.sh logs > e2e-compose.log 2>&1 || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-compose.log
          retention-days: 7
          if-no-files-found: ignore

  e2e-browser:
    name: e2e-browser (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SLASHOBSERVE_IMAGE: slashobserve-e2e:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images
        uses: ./.github/actions/stack-images
        with:
          server-tag: slashobserve-e2e:ci
          warm: make e2e-warm

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Boot the stack while Chromium installs
        run: |
          make e2e-up > e2e-up.log 2>&1 &
          boot=$!
          (cd web && bun run e2e:install)
          wait "$boot" || { cat e2e-up.log || true; exit 1; }

      - name: Browser suite shard
        env:
          PW_SHARD: ${{ matrix.shard }}/4
        run: make e2e-browser

      - name: Collect compose logs
        if: failure()
        run: scripts/e2e.sh logs > e2e-compose.log 2>&1 || true

      - name: Upload the Playwright report and compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
            e2e-compose.log
          retention-days: 7
          if-no-files-found: ignore
