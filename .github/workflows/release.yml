name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 # 0.76.0

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a release version
        run: scripts/release-tags.sh "$GITHUB_REF_NAME"

      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: CHANGELOG has notes for this version
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

  scan:
    name: scan ${{ matrix.image.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: slashobserve
            repository: ghcr.io/slashobserve/slashobserve
            context: .
            title: SlashObserve
            description: Agentic Grafana replacement - describe a dashboard in plain language and get a live one.
          - name: demo-shop
            repository: ghcr.io/slashobserve/demo-shop
            context: demo/shop
            title: SlashObserve demo shop
            description: Demo shop that emits the metrics, logs and traces of the SlashObserve demo stack.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release metadata
        id: meta
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          version="$(scripts/release-tags.sh "$GITHUB_REF_NAME" | head -n 1)"
          {
            echo "version=$version"
            echo "staging=sha-${GITHUB_SHA::12}"
            echo "created=$(git log -1 --format=%cI)"
            echo "build_args<<BUILD_ARGS_END"
            if [[ "$IMAGE_NAME" == slashobserve ]]; then
              echo "VERSION=$version"
              echo "COMMIT=$GITHUB_SHA"
            fi
            echo "BUILD_ARGS_END"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image under its staging tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image.repository }}:${{ steps.meta.outputs.staging }}
          build-args: ${{ steps.meta.outputs.build_args }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=release-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}

      - name: Trivy scan, fail on fixable HIGH and CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          IMAGE_REF: ${{ matrix.image.repository }}:${{ steps.meta.outputs.staging }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm \
              -e TRIVY_USERNAME -e TRIVY_PASSWORD -e TRIVY_DB_REPOSITORY \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image \
              --image-src remote --platform "$platform" \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "$IMAGE_REF"
          done

  promote:
    name: promote ${{ matrix.image.name }}
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: slashobserve
            repository: ghcr.io/slashobserve/slashobserve
          - name: demo-shop
            repository: ghcr.io/slashobserve/demo-shop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the scanned image with its release tags
        env:
          REPOSITORY: ${{ matrix.image.repository }}
        run: |
          args=()
          while read -r tag; do
            args+=(--tag "$REPOSITORY:$tag")
          done < <(scripts/release-tags.sh "$GITHUB_REF_NAME")
          docker buildx imagetools create "${args[@]}" "$REPOSITORY:sha-${GITHUB_SHA::12}"

  release:
    name: release
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Extract release notes from CHANGELOG
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Build and publish the observe CLI release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
