name: Build the stack images
description: Build the server image a compose stack job runs, from binaries compiled on the runner so the Go and Bun caches apply.

inputs:
  server-tag:
    description: Tag of the server image.
    required: true
  warm:
    description: Command that starts the services which need no server image; it runs in the background right away.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: ./.github/actions/setup-go
      with:
        cache-name: build

    - name: Start the services that need no server image
      if: inputs.warm != ''
      shell: bash
      env:
        WARM: ${{ inputs.warm }}
        SLASHOBSERVE_IMAGE: ${{ inputs.server-tag }}
      run: setsid nohup bash -c "$WARM" > "$RUNNER_TEMP/warm.log" 2>&1 < /dev/null &

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: web/package.json

    - name: Restore Bun packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'harness/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Compile the server and the harness
      shell: bash
      env:
        VERSION: ${{ github.sha }}
        COMMIT: ${{ github.sha }}
      run: |
        make build VERSION="$VERSION" COMMIT="$COMMIT"
        mkdir -p "$RUNNER_TEMP/prebuilt/server/out" "$RUNNER_TEMP/prebuilt/harness/out"
        cp bin/slashobserve-server "$RUNNER_TEMP/prebuilt/server/out/"
        cp bin/slashobserve-harness "$RUNNER_TEMP/prebuilt/harness/out/"

    # The named contexts replace the Dockerfile's server and harness stages, so only its last stage is built.
    - name: Build the server image
      shell: bash
      env:
        SERVER_TAG: ${{ inputs.server-tag }}
      run: |
        docker buildx build -t "$SERVER_TAG" \
          --build-context "server=$RUNNER_TEMP/prebuilt/server" \
          --build-context "harness=$RUNNER_TEMP/prebuilt/harness" .
