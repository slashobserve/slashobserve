name: Build the stack images
description: Build the server and demo shop images a compose stack job runs, from binaries compiled on the runner so the Go and Bun caches apply.

inputs:
  server-tag:
    description: Tag of the server image.
    required: true
  shop-tag:
    description: Tag of the demo shop image.
    required: true
  warm:
    description: Command that starts the services which need no server image; it runs in the background as soon as the shop image exists.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: ./.github/actions/setup-go
      with:
        cache-name: build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build the demo shop image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: demo
        load: true
        tags: ${{ inputs.shop-tag }}
        cache-from: type=gha,scope=demo-shop
        cache-to: type=gha,mode=max,scope=demo-shop

    - name: Start the services that need no server image
      if: inputs.warm != ''
      shell: bash
      env:
        WARM: ${{ inputs.warm }}
        SLASHOBSERVE_IMAGE: ${{ inputs.server-tag }}
        SLASHOBSERVE_SHOP_IMAGE: ${{ inputs.shop-tag }}
      run: setsid nohup bash -c "$WARM" > "$RUNNER_TEMP/warm.log" 2>&1 < /dev/null &

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: web/package.json

    - name: Restore Bun packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'observe-agent/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Compile the server and the agent
      shell: bash
      env:
        VERSION: ${{ github.sha }}
        COMMIT: ${{ github.sha }}
      run: |
        make build VERSION="$VERSION" COMMIT="$COMMIT"
        mkdir -p "$RUNNER_TEMP/prebuilt/server/out" "$RUNNER_TEMP/prebuilt/agent/out"
        cp bin/slashobserve-server "$RUNNER_TEMP/prebuilt/server/out/"
        cp bin/observe-agent "$RUNNER_TEMP/prebuilt/agent/out/"

    # The named contexts replace the Dockerfile's server and agent stages, so only its last stage is built.
    - name: Build the server image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        tags: ${{ inputs.server-tag }}
        build-contexts: |
          server=${{ runner.temp }}/prebuilt/server
          agent=${{ runner.temp }}/prebuilt/agent
