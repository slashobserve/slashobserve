name: Set up Go
description: Install the Go toolchain of go.mod and restore a module and build cache that belongs to one job kind. The cache is saved once per week and per dependency set, so most runs only restore it.

inputs:
  cache-name:
    description: Names the cache, so jobs that compile different things (race tests, lint, release build) do not overwrite each other.
    required: true
  save:
    description: Whether this job may save the cache. Jobs that share a cache name leave saving to the one that compiles the most.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Read the week
      id: week
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - name: Restore and save the Go caches
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}-${{ steps.week.outputs.week }}
        restore-keys: |
          go-${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}-
          go-${{ inputs.cache-name }}-${{ runner.os }}-

    - name: Restore the Go caches
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}-${{ steps.week.outputs.week }}
        restore-keys: |
          go-${{ inputs.cache-name }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}-
          go-${{ inputs.cache-name }}-${{ runner.os }}-
