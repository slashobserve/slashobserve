name: Set up Go
description: Install the Go toolchain of go.mod and restore and save a module and build cache that belongs to one job kind. The cache is saved once per week and per dependency set, so most runs only restore it.

inputs:
  cache-name:
    description: Names the cache, so jobs that compile different things (race tests, lint, release build) do not overwrite each other.
    required: true
  shard:
    description: Names the slice of a matrix job. Each shard saves its own cache and starts from the latest cache of any shard of the same cache name when it has none of its own.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Name the cache
      id: names
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-name }}
        SHARD: ${{ inputs.shard }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        {
          echo "week=$(date -u +%G-%V)"
          echo "family=go-$CACHE_NAME-"
          echo "prefix=go-$CACHE_NAME-${SHARD:+$SHARD-}$RUNNER_OS_NAME"
        } >> "$GITHUB_OUTPUT"

    - name: Restore and save the Go caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.names.outputs.prefix }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}-${{ steps.names.outputs.week }}
        restore-keys: |
          ${{ steps.names.outputs.prefix }}-${{ hashFiles('go.mod', 'go.sum', 'tools/*/go.sum') }}-
          ${{ steps.names.outputs.prefix }}-
          ${{ steps.names.outputs.family }}
