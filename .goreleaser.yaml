version: 2

project_name: observe

builds:
  - id: observe
    main: ./cmd/observe
    binary: observe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: observe
    ids: [observe]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: observe_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  prerelease: auto
  name_template: "{{ .Tag }}"
