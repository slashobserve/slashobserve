# USD per million tokens. A model is priced by its exact key, else by the longest match prefix, so dated ids like claude-haiku-5-5-20261001 are priced too.
# A null rate leaves the cost of a run that used that token class blank, never zero.
# Haiku's long-prompt pricing tier is not modelled, so its cost is underestimated for prompts above that tier's threshold.
models:
  claude-opus-5-5: { input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00, match: [claude-opus-5-5] }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50, match: [claude-sonnet-5-5] }
  claude-haiku-5-5: { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125, match: [claude-haiku-5-5] }
  replay: { input: 0, output: 0, cache_read: 0, cache_write: 0 }
