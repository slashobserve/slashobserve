    reason: "the recording rule has no write series: no apiserver write request returned a 5xx code and the write SLI rules need one"
  - dashboard: kube-prometheus/kubelet.json
    panel_title: "Config Error Count"
    reason: "kubelet_node_config_error is not exposed by the kubelet of this Kubernetes version"
  - dashboard: kube-prometheus/kubelet.json
    panel_title: "Operation Error Rate"
    reason: "the kubelet exposes the error counter only after the first error, and none occurred"
  - dashboard: kube-prometheus/kubelet.json
