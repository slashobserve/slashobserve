gaps:
  - dashboard: dotdc/k8s-addons-prometheus.json
    panel_title: "Instance Down"
    reason: "the query selects only unhealthy pods or targets and every one is healthy"
  - dashboard: dotdc/k8s-addons-prometheus.json
    panel_title: "Persistent Volumes - Capacity and usage in %"
    reason: "no kubelet_volume_stats_* series: kind local-path volumes are hostPath volumes, for which the kubelet reports no volume stats"
  - dashboard: dotdc/k8s-addons-prometheus.json
    panel_title: "Persistent Volumes - Capacity and usage in bytes"
    reason: "no kubelet_volume_stats_* series: kind local-path volumes are hostPath volumes, for which the kubelet reports no volume stats"
  - dashboard: dotdc/k8s-addons-prometheus.json
    panel_title: "Persistent Volumes - Inodes"
    reason: "no kubelet_volume_stats_* series: kind local-path volumes are hostPath volumes, for which the kubelet reports no volume stats"
  - dashboard: dotdc/k8s-system-coredns.json
    panel_title: "CoreDNS - DNS Errors"
    reason: "no coredns_proxy_request_duration_seconds_count series with rcode SERVFAIL or REFUSED, because CoreDNS has had no failed upstream query"
  - dashboard: dotdc/k8s-views-global.json
    panel_title: "CPU Core Throttled by instance"
    reason: "node_cpu_core_throttles_total is not exposed by node-exporter on these nodes"
  - dashboard: dotdc/k8s-views-global.json
    panel_title: "CPU Throttled seconds by namespace"
    reason: "varies with throttling between runs"
  - dashboard: dotdc/k8s-views-global.json
    panel_title: "Kubernetes Pods Status Reason"
    reason: "kube_pod_status_reason has no series while no pod has a status reason"
  - dashboard: dotdc/k8s-views-global.json
    panel_title: "OOM Events by namespace"
    reason: "the query keeps only values above 0 and no container was OOM killed, restarted or throttled"
  - dashboard: dotdc/k8s-views-global.json
