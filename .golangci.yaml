version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 15
    sloglint:
      forbidden-keys:
        - error
        - err
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go$
        linters:
          - gocyclo
      - path: ^internal/logattrs/
        linters:
          - sloglint
      - path-except: ^(internal|cmd|pkg)/
        linters:
          - sloglint

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/slashobserve/slashobserve)
      custom-order: true
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
